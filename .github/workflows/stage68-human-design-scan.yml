name: Stage68 human + Apple design scan

on:
  push:
    branches: [fix/human-editorial-apple-audit-20260810]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Human voice risk scan
        run: npm run audit:copy
      - name: Human voice phrase context
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[]; const ignored=new Set(['.git','node_modules','redirects']);
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(ignored.has(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))files.push(p)}} walk('.');
          const re=/(more than|not just|not only|timeless|authentic|unique|seamless|elevat\w*|mehr als|nicht nur|authentisch\w*|einzigartig\w*|több mint|nem csak|autentikus\w*|egyedi\w*)/i;
          const priority=files.filter(f=>/^(index\.html|contact\/|portrait\/|brand\/|event-photography\/|glamour\/|about\/|trust\/|hu\/(index|kapcsolat|portre|brand|rendezvenyfotozas|muveszi-fotografia|bizalom)\/|de-at\/(index|kontakt|portrait|brand|eventfotografie|fine-art|vertrauen|speier-viko)\/)/.test(f.replaceAll('\\','/')));
          function text(h){return h.replace(/<script\b[\s\S]*?<\/script>/gi,' ').replace(/<style\b[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim()}
          for(const f of priority){const t=text(fs.readFileSync(f,'utf8'));const sentences=t.split(/(?<=[.!?…])\s+/);const hits=sentences.filter(s=>re.test(s));if(hits.length){console.log('\n### '+f);for(const s of hits)console.log('- '+s.slice(0,520));}}
          NODE
      - name: Existing full static audit
        run: npm run audit
      - name: Design drift inventory
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const ignored=new Set(['.git','node_modules','dist','build','redirects']);
          const files=[];
          function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(ignored.has(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))files.push(p)}}
          walk('.');
          let inline=0, tiny=0, nowrap=0, hardBreak=0;
          const offenders=[];
          for(const f of files){const h=fs.readFileSync(f,'utf8');const styles=[...h.matchAll(/style="([^"]+)"/gi)].map(m=>m[1]);const i=styles.length;const t=styles.filter(s=>/font-size\s*:\s*(?:[0-9](?:\.[0-9]+)?px|0\.[0-7][0-9]*rem)/i.test(s)).length;const n=styles.filter(s=>/white-space\s*:\s*nowrap/i.test(s)).length;const b=(h.match(/<br\s*\/?\s*>/gi)||[]).length;inline+=i;tiny+=t;nowrap+=n;hardBreak+=b;if(i+t+n+b>15)offenders.push({file:f,inline:i,tiny:t,nowrap:n,br:b});}
          offenders.sort((a,b)=>(b.inline+b.tiny+b.nowrap+b.br)-(a.inline+a.tiny+a.nowrap+a.br));
          console.log(JSON.stringify({htmlFiles:files.length,inlineStyles:inline,tinyInlineText:tiny,nowrapInline:nowrap,hardBreaks:hardBreak,highestRisk:offenders.slice(0,50)},null,2));
          NODE
