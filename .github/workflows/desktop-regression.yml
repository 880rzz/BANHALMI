name: Desktop browser regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source contract audits
        run: npm test
      - name: Run strict PSI and CrUX field gate
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node tools/audit-pagespeed-field.mjs
      - name: Prepare production-like Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/exhaustive-visual artifacts/lighthouse-desktop artifacts/lighthouse-mobile
          mkdir -p _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          npx --yes esbuild@0.25.9 _site/assets/css/site.css --minify --outfile=/tmp/site.min.css
          mv /tmp/site.min.css _site/assets/css/site.css
          test "$(find _site/assets/css -type f -name '*.css' | wc -l | tr -d ' ')" = "1"
      - name: Install Chromium browser audit runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run exhaustive browser QA and visual capture
        run: |
          set -euo pipefail
          node tools/perf-static-server.mjs _site 4173 > /tmp/banhalmi-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          npm run test:e2e
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-browser-layout.mjs
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-first-principles-layout.mjs
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/capture-exhaustive-visual.mjs
          kill $SERVER_PID || true
          trap - EXIT
      - name: Run mobile Lighthouse 100 gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.mobile.cjs
      - name: Run desktop Lighthouse budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.desktop.cjs
      - name: Upload browser and Lighthouse QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression-${{ github.sha }}
          path: |
            artifacts/browser-layout
            artifacts/exhaustive-visual
            artifacts/lighthouse-mobile
            artifacts/lighthouse-desktop
          if-no-files-found: warn
          retention-days: 14
