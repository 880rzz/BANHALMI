name: Apply BANHALMI SEO GDPR fixes

on:
  push:
    branches:
      - audit/seo-geo-llm-gdpr-fix-20260808

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seo-geo-llm-gdpr-fix-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Apply fixes
        run: node tools/apply-seo-gdpr-fixes-20260808.mjs
      - name: Remove one-off applicator before audit
        run: |
          rm -f tools/apply-seo-gdpr-fixes-20260808.mjs
          rm -f .github/workflows/apply-seo-gdpr-fixes-20260808.yml
      - name: Run full deterministic audit
        run: npm run audit
      - name: Run full browser regression
        run: npm run test:browser
      - name: Commit audited result
        run: |
          git config user.name "BANHALMI CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align SEO indexing and cross-domain privacy scope"
          git push origin HEAD:audit/seo-geo-llm-gdpr-fix-20260808
