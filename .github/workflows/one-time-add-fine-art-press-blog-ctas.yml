name: One-time add fine-art press and blog CTAs

on:
  push:
    paths:
      - '.github/workflows/one-time-add-fine-art-press-blog-ctas.yml'
      - 'tools/one_time_add_fine_art_press_blog_ctas.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add localized fine-art resource buttons
        run: python3 tools/one_time_add_fine_art_press_blog_ctas.py
      - name: Remove one-time migration files
        run: |
          rm -f tools/one_time_add_fine_art_press_blog_ctas.py
          rm -f .github/workflows/one-time-add-fine-art-press-blog-ctas.yml
      - name: Run complete repository audit
        run: npm run audit
      - name: Commit audited changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add press and blog links to fine-art pages"
          git push
