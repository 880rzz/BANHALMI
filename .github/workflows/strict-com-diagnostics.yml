name: Strict COM diagnostics

on:
  push:
    branches:
      - agent/strict-live-audit-remediation

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-live-audit-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          npm run fix:strict-live 2>&1 | tee strict-com-diagnostics.log
          npm run audit 2>&1 | tee -a strict-com-diagnostics.log
          s1=${PIPESTATUS[0]}
          npm run audit:copy 2>&1 | tee -a strict-com-diagnostics.log
          s2=${PIPESTATUS[0]}
          npm run audit:production 2>&1 | tee -a strict-com-diagnostics.log
          s3=${PIPESTATUS[0]}
          printf '{"audit":%s,"copy":%s,"production":%s}\n' "$s1" "$s2" "$s3" > strict-com-diagnostics-status.json
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strict-com-diagnostics.log strict-com-diagnostics-status.json
          git diff --cached --quiet || git commit -m "Record strict COM diagnostics [skip ci]"
          git push
