name: Repair BANHALMI visual rhythm regression

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/visual-rhythm-repair-20260825.yml
      - tools/repair-visual-rhythm-20260825.cjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply design repair
        run: node tools/repair-visual-rhythm-20260825.cjs
      - name: Validate design authority
        run: |
          node tools/audit-apple-responsive-contract.mjs
          node tools/audit-layout-authority.mjs
          node tools/audit-css-syntax-stage44.mjs
          node tools/audit-static-integrity.mjs
      - name: Commit repair
        run: |
          git config user.name "BANHALMI release bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/visual-rhythm-repair-20260825.yml
          git rm tools/repair-visual-rhythm-20260825.cjs
          git add -A
          git commit -m "Restore Apple visual rhythm and spacing authority"
          git push origin HEAD:main
