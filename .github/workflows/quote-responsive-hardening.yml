name: Quote responsive hardening

on:
  push:
    branches:
      - agent/simplify-quote-flow-20260813
    paths:
      - tools/apply-quote-responsive-hardening.mjs
      - .github/workflows/quote-responsive-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-quote-flow-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Install dependencies
        run: npm ci

      - name: Apply responsive hardening
        run: node tools/apply-quote-responsive-hardening.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive browser audit
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/banhalmi-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const pages = ['/hu/ajanlatkeres/','/requestaquote/','/de-at/anfrage/'];
          const viewports = [
            {name:'mobile-small', width:320, height:700},
            {name:'mobile', width:390, height:844},
            {name:'tablet', width:768, height:1024},
            {name:'desktop', width:1440, height:900}
          ];
          const failures=[];
          for (const route of pages) {
            for (const vp of viewports) {
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle'});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if (overflow>1) failures.push(`${route} ${vp.name}: horizontal overflow ${overflow}px`);
              const price=page.locator('[data-estimate-gross]').first();
              if (!(await price.isVisible())) failures.push(`${route} ${vp.name}: price not visible initially`);
              const form=page.locator('[data-smart-quote]');
              await form.scrollIntoViewIfNeeded();
              await page.evaluate(()=>window.scrollBy(0,Math.min(1000,document.documentElement.scrollHeight/3)));
              await page.waitForTimeout(150);
              const priceBox=await price.boundingBox();
              if (!priceBox || priceBox.y+priceBox.height<0 || priceBox.y>vp.height) failures.push(`${route} ${vp.name}: current price left viewport while configuring`);
              const grossBefore=(await price.textContent()||'').trim();
              const brand=page.locator('input[name="category"][value="brand"]');
              if (await brand.count()) {
                await brand.check();
                await page.waitForTimeout(100);
                const grossAfter=(await price.textContent()||'').trim();
                if (!grossAfter || grossAfter==='Calculating…' || grossAfter==='Berechnung…' || grossAfter==='Számítás…') failures.push(`${route} ${vp.name}: estimate did not resolve after option change`);
                if (grossBefore===grossAfter) console.log(`${route} ${vp.name}: category change retained same numeric total; accepted if pricing components coincide`);
              }
              const guide=page.locator('.quote-decision-guide');
              if (!(await guide.isVisible())) failures.push(`${route} ${vp.name}: decision guide missing`);
              if (vp.width<=899) {
                const pos=await page.locator('.quote-summary-card').evaluate(el=>getComputedStyle(el).position);
                if (pos!=='fixed') failures.push(`${route} ${vp.name}: mobile price bar is not fixed (${pos})`);
                const dlDisplay=await page.locator('.quote-summary-card dl').evaluate(el=>getComputedStyle(el).display);
                if (dlDisplay!=='none') failures.push(`${route} ${vp.name}: mobile price bar is not compact`);
              } else {
                const pos=await page.locator('.quote-intro').evaluate(el=>getComputedStyle(el).position);
                if (pos!=='sticky') failures.push(`${route} ${vp.name}: desktop/tablet price column is not sticky (${pos})`);
              }
              await page.close();
            }
          }
          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Responsive quote audit passed: 3 languages × 4 viewports; live price remains visible and decision guide renders.');
          NODE

      - name: Validate quote contracts
        run: |
          node tools/audit-pricing-huf.mjs
          node tools/audit-pricing-currency-stage38.mjs
          node tools/audit-quote-service-context-stage24.mjs
          node tools/audit-first-principles-stage28.mjs
          node tools/audit-hungarian-copy.mjs
          node tools/audit-human-voice-en-de.mjs

      - name: Commit hardened quote pages
        shell: bash
        run: |
          if git diff --quiet -- hu/ajanlatkeres/index.html requestaquote/index.html de-at/anfrage/index.html; then
            echo "No page changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu/ajanlatkeres/index.html requestaquote/index.html de-at/anfrage/index.html
          git commit -m "Keep live quote price visible across responsive views"
          git push origin HEAD:agent/simplify-quote-flow-20260813
