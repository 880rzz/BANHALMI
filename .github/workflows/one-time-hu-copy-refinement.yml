          regex_global = [
              (re.compile(r'\bmeeting\b', re.I), 'megbeszélés'),
              (re.compile(r'\bbrief\b', re.I), 'projektleírás'),
              (re.compile(r'\blifestyle\b', re.I), 'életmód'),
