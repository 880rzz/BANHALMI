name: One-time Hungarian copy refinement

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-copy-refinement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine Hungarian copy and permanent guards
