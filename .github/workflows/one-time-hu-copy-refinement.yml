          def replace_text_nodes(fragment, replacements):
              protected = {}
              def hold(match):
                  key = f'__BANHALMI_PROTECTED_{len(protected)}__'
                  protected[key] = match.group(0)
                  return key
              fragment = re.sub(r'(?is)<(?:script|style|noscript|template)\b[^>]*>.*?</(?:script|style|noscript|template)>', hold, fragment)
              parts = re.split(r'(<[^>]+>)', fragment)
              for i in range(0, len(parts), 2):
                  value = parts[i]
                  for old, new in replacements.items():
                      value = value.replace(old, new)
                  for pattern, new in regex_global:
                      value = pattern.sub(new, value)
                  parts[i] = value
              fragment = ''.join(parts)
              for key, value in protected.items():
                  fragment = fragment.replace(key, value)
              return fragment

          changed_pages = []
          for path in hu_pages:
              text = path.read_text(encoding='utf-8')
              marker = re.search(r'(?i)</head>', text)
              if not marker:
                  raise SystemExit(f'{path}: missing </head>')
              head = text[:marker.end()]
              body = text[marker.end():]
              replacements = dict(exact_global)
              replacements.update(page_specific.get(path.as_posix(), {}))
              body_new = replace_text_nodes(body, replacements)
              # Exact navigation labels: text only, never attributes or routes.
              body_new = re.sub(r'>\s*Brand\s*<', '>Brandfotózás<', body_new)
              body_new = re.sub(r'>\s*Portré\s*<', '>Portréfotózás<', body_new)
              body_new = re.sub(r'>\s*Művészi fotózás\s*<', '>Művészi fotográfia<', body_new)
              body_new = re.sub(r'>\s*Rendezvény\s*<', '>Rendezvényfotózás<', body_new)
              new_text = head + body_new
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed_pages.append(path.as_posix())

