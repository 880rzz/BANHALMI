              'Könyvek, kiállítások, projektek és válogatott forrásanyagok.': 'Könyvek, kiállítások, projektek és ellenőrizhető háttéranyagok.',
              'Válassza ki, milyen vizuális feladatot kell megoldanunk.': 'Milyen képi feladatra keres megoldást?',
              'Headshot, executive portré és személyes vizuális pozicionálás.': 'Üzleti portré, vezetői portré és személyes vizuális pozicionálás.',
              'Következetes képi rendszer vezetőknek, csapatoknak és szervezeteknek.': 'Egységes képi rendszer vezetőknek, csapatoknak és szervezeteknek.',
              "['/hu/rendezvenyfotozas/','C-Level események','Diszkrét, kontextusérzékeny dokumentáció vezetői és vállalati helyzetekben.']": "['/hu/rendezvenyfotozas/','Vezetői események','Visszafogott, helyzetérzékeny fotózás vezetői és vállalati eseményeken.']",
              'Szerzői portré és alkotói munka identitásról, jelenlétről és emberi történetekről.': 'Szerzői portrék és személyes művészeti sorozatok az identitásról és jelenlétről.',
              'Válogatott megbízók, együttműködések és igazolt szakmai tagságok.': 'Válogatott ügyfelek, együttműködések és ellenőrizhető szakmai tagságok.',
              'Egyértelmű válaszok az előkészítésről, folyamatról, átadásról és jogokról.': 'Válaszok az előkészítésről, a fotózásról, az átadásról és a felhasználási jogokról.',
              'Stúdiók, közvetlen elérhetőségek és a projektet koordináló személyek.': 'Stúdiók, közvetlen elérhetőségek és a projekt koordinátorai.',
              "cta:'Csomag összeállítása'": "cta:'Projekt összeállítása'",
              "ctaDesc:'Készítsen előzetes projekttervet és tájékoztató kalkulációt.'": "ctaDesc:'Állítsa össze a projekt előzetes terjedelmét és tájékoztató költségkeretét.'",
              "artDesc:'Lépjen be az önálló művészeti életműbe és forrásarchívumba.'": "artDesc:'Az önálló művészeti életmű és forrásarchívum megnyitása.'"
          }
          for old, new in menu_replacements.items():
              if old not in menu:
                  raise SystemExit(f'mega-menu expected source missing: {old}')
              menu = menu.replace(old, new)
          menu_path.write_text(menu, encoding='utf-8')

          config_path = Path('assets/js/site-config.js')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('20260803-art-navigation', '20260805-hu-copy')
          config_path.write_text(config, encoding='utf-8')

          # Keep regeneration sources aligned with the published Hungarian copy.
          generator_paths = [Path('.human-voice/homepage-rewrite.py'), Path('.human-voice/oeuvre-rewrite.py')]
          source_replacements = {
              'meeting el\\u0151tt': 'tal\\u00e1lkoz\\u00e1s el\\u0151tt',
              'board meeting': 'vezet\\u0151i esem\\u00e9ny',
              'headshot lesz bel\\u0151le': 'vezet\\u0151i portr\\u00e9 lesz bel\\u0151le',
              'executive portr\\u00e9specialista': 'vezet\\u0151i portr\\u00e9specialista',
              'vizu\\u00e1lis brand strat\\u00e9ga': 'vizu\\u00e1lis m\\u00e1rkastrat\\u00e9ga',
              'workshopok': 'm\\u0171helyfoglalkoz\\u00e1sok'
          }
          for path in generator_paths:
              if not path.exists():
                  continue
              source = path.read_text(encoding='utf-8')
              for old, new in source_replacements.items():
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')

          # Update existing regression contracts to the approved Hungarian wording.
          tool_replacements = {
              'Executive portrék és vizuális pozicionálás vezetőknek és szervezeteknek.': 'Vezetői portrék és vizuális pozicionálás vezetőknek és szervezeteknek.',
              'executive portréfotózás': 'vezetői portréfotózás',
              'C-level eseményfotózás': 'felsővezetői eseményfotózás',
              'Executive, üzleti és lifestyle portrék a pontos headshottól egy vezető teljes nyilvános vizuális pozicionálásáig.': 'Vezetői, üzleti és életmódportrék az egységes profilképtől egy vezető teljes nyilvános vizuális megjelenéséig.'
          }
          for path in Path('tools').glob('*.mjs'):
              source = path.read_text(encoding='utf-8')
              updated = source
              for old, new in tool_replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          audit_source = r'''import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve(import.meta.dirname, '..');
          const failures = [];
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const target = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(target) : [target];
          });
          const pages = walk(path.join(root, 'hu')).filter((file) => file.endsWith('index.html'));
          if (pages.length !== 20) failures.push(`Expected 20 Hungarian pages, found ${pages.length}`);

          function visibleBody(html) {
            const body = html.match(/<body\b[^>]*>([\s\S]*?)<\/body>/i)?.[1] || '';
            return body
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<noscript\b[^>]*>[\s\S]*?<\/noscript>/gi, ' ')
              .replace(/<!--([\s\S]*?)-->/g, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;|&#160;/g, ' ')
              .replace(/&amp;/g, '&')
              .replace(/\s+/g, ' ')
              .trim();
          }

          const banned = [
            /\bmeeting\b/i,
            /\bboard meeting/i,
            /\bheadshot\b/i,
            /\bexecutive\b/i,
            /\bC[-‑ ]?level\b/i,
            /\bemployer branding\b/i,
            /\bpersonal branding\b/i,
            /\bthought leadership\b/i,
            /Art direction/i,
            /International Business Network Benefit/i,
            /BANHALMI team/i,
            /since 1999/i,
            /shared-secret/i,
            /inputvalidáció/i,
            /retenciós kontroll/i,
            /\bbackend\b/i,
            /\bwidgetek\b/i,
            /\bhoneypot\b/i
          ];
          for (const file of pages) {
            const text = visibleBody(fs.readFileSync(file, 'utf8'));
            for (const pattern of banned) if (pattern.test(text)) failures.push(`${path.relative(root, file)}: non-Hungarian or obsolete visible phrase remains: ${pattern}`);
          }

          const menu = read('assets/js/mega-menu.js');
          const approvedMenu = [
            'Szakmai pálya, alkotói fordulópontok és közösségi munka 1999 óta.',
            'Válogatás megbízásos sorozatokból és a művészeti archívumból.',
            'Könyvek, kiállítások, projektek és ellenőrizhető háttéranyagok.',
            'Milyen képi feladatra keres megoldást?',
            'Üzleti portré, vezetői portré és személyes vizuális pozicionálás.',
            'Egységes képi rendszer vezetőknek, csapatoknak és szervezeteknek.',
            'Visszafogott, helyzetérzékeny fotózás vezetői és vállalati eseményeken.',
            'Válaszok az előkészítésről, a fotózásról, az átadásról és a felhasználási jogokról.',
            "cta:'Projekt összeállítása'"
          ];
          for (const phrase of approvedMenu) if (!menu.includes(phrase)) failures.push(`mega-menu: approved Hungarian copy missing: ${phrase}`);
          for (const obsolete of ['Headshot, executive portré', 'C-Level események', "cta:'Csomag összeállítása'", 'kontextusérzékeny dokumentáció']) {
            if (menu.includes(obsolete)) failures.push(`mega-menu: obsolete Hungarian copy remains: ${obsolete}`);
          }

          const homepageGenerator = read('.human-voice/homepage-rewrite.py');
          const huSource = homepageGenerator.split("'hu/index.html'")[1]?.split("'de-at/index.html'")[0] || homepageGenerator;
          for (const obsolete of ['meeting el\\u0151tt', 'board meeting', 'headshot lesz bel\\u0151le']) {
            if (huSource.includes(obsolete)) failures.push(`homepage generator: obsolete Hungarian source remains: ${obsolete}`);
          }

          if (failures.length) {
            console.error(failures.map((failure) => `✗ ${failure}`).join('\n'));
            process.exit(1);
          }
          console.log(`Hungarian copy audit passed: ${pages.length} pages, shared menu and regeneration sources checked.`);
          '''
          audit_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in audit_source.splitlines()) + '\n'
          Path('tools/audit-hungarian-copy.mjs').write_text(audit_source, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['audit:hu-copy'] = 'node tools/audit-hungarian-copy.mjs'
          audit_cmd = scripts.get('audit', '')
          guard = 'node tools/audit-hungarian-copy.mjs'
          if guard not in audit_cmd:
              scripts['audit'] = guard + (' && ' + audit_cmd if audit_cmd else '')
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.audit/hu-copy-report.txt').unlink(missing_ok=True)
          print(f'Changed Hungarian pages: {len(changed_pages)}')
          for page in changed_pages:
              print(' -', page)
          PY
      - name: Install dependencies
        run: npm install
      - name: Run Hungarian copy guard
        run: npm run audit:hu-copy
      - name: Run full deterministic audit
        run: npm run audit
      - name: Validate diff
        run: git diff --check
      - name: Commit refined Hungarian copy
        run: |
          rm -f .github/workflows/one-time-hu-copy-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Hungarian copy and protect menu language"
          git push
