                  'Professzionális headshot fotózás — LinkedIn, vállalati profil, sajtóanyag és egységes csapatportré-napok.': 'Professzionális üzleti portréfotózás — LinkedInhez, vállalati profilhoz, sajtóanyaghoz és egységes csapatportré-napokhoz.',
                  'Executive portréfotózás — alapítók, boardtagok, felsővezetők, előadók és nyilvánosan szereplő döntéshozók.': 'Vezetői portréfotózás — alapítóknak, igazgatósági tagoknak, felsővezetőknek, előadóknak és nyilvánosan szereplő döntéshozóknak.',
                  'C-level üzleti fotózás — vezetői csapatok, board meetingek, munkahelyi történetek, éves jelentések, PR és employer branding.': 'Felsővezetői üzleti fotózás — vezetői csapatokhoz, igazgatósági ülésekhez, munkahelyi történetekhez, éves jelentésekhez, sajtókommunikációhoz és munkáltatói márkaépítéshez.',
