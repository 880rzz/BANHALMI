                  'Nem néhány szép képet adok át, amelyek aztán egy mappában maradnak. Olyan fotóanyagot készítek, amelyet valóban lehet használni: weboldalon, sajtóban, toborzásban, prezentációban és kampányokban.': 'Az átadott képanyag konkrét felületekre készül: weboldalra, sajtóba, toborzáshoz, prezentációkhoz és kampányokhoz.',
                  'Egy fotózás akkor hasznos, ha a képek minden fontos felületen működnek.': 'A fotózás akkor válik üzletileg hasznossá, amikor a képek minden fontos felületen következetesen működnek.',
                  'Előbb megismerem a céget. A képek utána jönnek.': 'Először a céget és a kommunikációs helyzetet ismerem meg. Erre épül a képanyag.'
              },
              'hu/archivum/index.html': {
                  'Ez az oldal a jelenlegi munkámat mutatja be. A banhalmi.art mögé néz: teljes projekteket, könyveket, kiállításokat, interjúkat és 1999 óta készült fényképeket rendez össze. Nem válogatott sikerek sora, hanem annak nyoma, hogyan alakult ki ez a képi gondolkodás.': 'Ez az oldal a banhalmi.art mögötti összefüggéseket mutatja meg: teljes projekteket, könyveket, kiállításokat, interjúkat és 1999 óta készült képeket rendez egymás mellé. Együtt láthatóvá teszik, hogyan alakult ki ez a képi gondolkodás.'
              },
              'hu/bizalom/index.html': {
                  'Egyetlen áttekinthető kiindulópont ahhoz, hogyan kezeljük a személyes adatokat, a megrendelt képeket, a szerzői jogokat, az AI-val támogatott munkafolyamatokat, a biztonságot és a felelős projektátadást.': 'Itt egy helyen látható, hogyan kezeljük a személyes adatokat, a megrendelt képeket, a szerzői jogokat, az AI-val támogatott munkafolyamatokat, a biztonságot és a projektátadást.',
                  'Executive portré, vizuális branding és C-level rendezvényfotózás Bécsből és Budapestről.': 'Vezetői portré, vizuális márkaépítés és felsővezetői rendezvényfotózás Bécsből és Budapestről.'
              },
              'hu/eletmu/index.html': {
                  'hogyan mutathatja meg a fénykép az embert, nem csupán a külsejét?': 'hogyan mutathatja meg a fénykép az embert a puszta külsőn túl?',
                  'Fotóművész és alkalmazott fotográfus, executive portréspecialista, vizuális brand stratéga, kurátor és fotográfiai oktató.': 'Fotóművész és alkalmazott fotográfus, vezetői portréspecialista, vizuális márkastratéga, kurátor és fotográfiai oktató.',
                  'Nem szeretném egyetlen gondolattá egyszerűsíteni azt, aki előttem áll.': 'Az előttem álló embert nem szűkítem egyetlen gondolatra.'
              },
              'hu/ajanlatkeres/index.html': {
                  'C-level rendezvényfotózás Vezetői csúcstalálkozókhoz, board meetingekhez és vállalati eseményekhez.': 'Felsővezetői rendezvényfotózás vezetői csúcstalálkozókhoz, igazgatósági ülésekhez és vállalati eseményekhez.',
                  'A projektet az első beszélgetéstől a végső átadásig ugyanaz a brief és minőségi rendszer tartja össze.': 'A projektet az első beszélgetéstől a végső átadásig ugyanaz a projektleírás és minőségi rendszer tartja össze.',
                  'Norbert vezeti a vizuális stratégiát, az executive és C-level fotózásokat, a helyszíni irányítást, a művészi döntéseket és a végleges képek jóváhagyását.': 'Norbert vezeti a vizuális stratégiát, a vezetői portré- és felsővezetői eseményfotózásokat, a helyszíni irányítást, a művészi döntéseket és a végleges képek jóváhagyását.'
