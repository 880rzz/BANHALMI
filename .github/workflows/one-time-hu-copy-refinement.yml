          menu = menu_path.read_text(encoding='utf-8')
          menu_replacements = {
              'A BANHALMI szakmai és művészeti útja 1999-től napjainkig.': 'Szakmai pálya, alkotói fordulópontok és közösségi munka 1999 óta.',
