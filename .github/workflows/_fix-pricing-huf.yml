            if (!html.includes('name="estimate_display_currency"')) html = replaceOnce(html, hiddenMarker, hiddenExtended, `${page.path} hidden currency fields`);
            const displayCurrency = page.lang === 'hu' ? 'HUF' : 'EUR';
            html = html.replace(/data-lang="([^"]+)" data-location-error=/, `data-lang="$1" data-display-currency="${displayCurrency}" data-location-error=`);

