          function offerCatalog(lang, pageUrl) {
            const localized = names[lang];
            const isHu = lang === 'hu';
            const currency = isHu ? 'HUF' : 'EUR';
            const source = isHu ? 'https://www.norbertbanhalmi.com/pricing-huf.json' : 'https://www.norbertbanhalmi.com/pricing.json';
            const itemListElement = componentOffers.map(([nameKey, componentKey]) => {
              const eur = pricing.priceComponentsGrossEUR[componentKey];
              const price = isHu ? hufGross(eur) : eur;
              return {
                '@type': 'Offer',
                name: localized[nameKey],
                price: String(price),
                priceCurrency: currency,
                priceSpecification: {
                  '@type': 'UnitPriceSpecification',
                  price: String(price),
                  priceCurrency: currency,
                  valueAddedTaxIncluded: true
                },
                seller: { '@id': 'https://www.norbertbanhalmi.com/#organization' },
                availability: 'https://schema.org/InStock',
                url: source
              };
            });
            return {
              '@context': 'https://schema.org',
              '@type': 'OfferCatalog',
              '@id': `${pageUrl}#offer-catalog`,
              name: localized.catalog,
              description: localized.description,
              provider: { '@id': 'https://www.norbertbanhalmi.com/#organization' },
              itemListElement,
              url: source,
              ...(isHu ? { additionalProperty: [
                { '@type': 'PropertyValue', name: 'Canonical base currency', value: 'EUR' },
                { '@type': 'PropertyValue', name: 'Fixed planning conversion', value: '1 EUR = 400 HUF' },
                { '@type': 'PropertyValue', name: 'Live exchange rate', value: 'false' }
              ] } : {})
            };
          }

          const quotePages = [
            { path: 'requestaquote/index.html', lang: 'en', pageUrl: 'https://www.norbertbanhalmi.com/requestaquote/' },
            { path: 'hu/ajanlatkeres/index.html', lang: 'hu', pageUrl: 'https://www.norbertbanhalmi.com/hu/ajanlatkeres/' },
            { path: 'de-at/anfrage/index.html', lang: 'de', pageUrl: 'https://www.norbertbanhalmi.com/de-at/anfrage/' }
          ];

          for (const page of quotePages) {
            let html = read(page.path);
            let replacedCatalog = 0;
            html = html.replace(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g, (full, body) => {
              try {
                const data = JSON.parse(body);
                if (data && data['@type'] === 'OfferCatalog') {
                  replacedCatalog += 1;
                  return `<script type="application/ld+json">${JSON.stringify(offerCatalog(page.lang, page.pageUrl))}</script>`;
                }
              } catch {}
              return full;
            });
            assert(replacedCatalog === 1, `${page.path}: expected one OfferCatalog, found ${replacedCatalog}`);

            const pricingLink = '<link href="/pricing.json" rel="alternate" title="BANHALMI pricing data" type="application/json"/>';
            assert(html.includes(pricingLink), `${page.path}: pricing link missing`);
            if (!html.includes('/pricing-guide.json')) html = html.replace(pricingLink, pricingLink + '<link href="/pricing-guide.json" rel="alternate" title="BANHALMI AI pricing guide" type="application/json"/>');
            if (page.lang === 'hu' && !html.includes('/pricing-huf.json')) html = html.replace(pricingLink, pricingLink + '<link href="/pricing-huf.json" rel="alternate" title="BANHALMI forint árlista" type="application/json"/>');

