                '<li>A magyar kalkulátor az euróban meghatározott kanonikus bruttó árakat rögzített <strong>1 EUR = 400 HUF</strong> tervezési árfolyamon mutatja forintban. Ez nem napi devizaárfolyam, és a végleges ajánlat pénznemét nem dönti el.</li><li>A forintösszegek 20% osztrák áfát tartalmaznak. A 0%-os kezelés csak a cég, a közösségi adószám és a jogszabályi feltételek ellenőrzése után válhat érvényessé.</li>',
                'Hungarian pricing explanation');
              html = replaceOnce(html,
                '<p class="machine-data-links"><a href="/pricing.json" rel="noopener noreferrer" target="_blank">Géppel olvasható árazási logika ↗</a></p>',
                '<p class="machine-data-links"><a href="/pricing-huf.json" rel="noopener noreferrer" target="_blank">Géppel olvasható forintárak ↗</a> <a href="/pricing-guide.json" rel="noopener noreferrer" target="_blank">AI számítási útmutató ↗</a> <a href="/pricing.json" rel="noopener noreferrer" target="_blank">Kanonikus euróárak ↗</a></p>',
                'Hungarian machine pricing links');
              html = html.replaceAll('Gyors, stúdióban készülő CV- vagy LinkedIn-headshot. Nettó 100 € + ÁFA, 10 perc fotózás és 1 azonnal retusált kép; egy főre, egyszerű beállítással.', 'Gyors, stúdióban készülő CV- vagy LinkedIn-headshot. Nettó 40 000 Ft + ÁFA, bruttó 48 000 Ft; 10 perc fotózás és 1 azonnal retusált kép, rögzített 1 EUR = 400 HUF tervezési árfolyamon.');
