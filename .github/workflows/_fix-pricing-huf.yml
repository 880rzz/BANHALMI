name: One-time HUF pricing migration

on:
  push:
    paths:
      - '.github/workflows/_fix-pricing-huf.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build synchronized EUR and HUF pricing system
        run: |
          cat > /tmp/fix-pricing-huf.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const RATE = 400;
          const NOW = '2026-08-05T23:48:00+02:00';
          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, value) => fs.writeFileSync(p, value);
          const json = (p) => JSON.parse(read(p));
          const writeJson = (p, value) => write(p, JSON.stringify(value, null, 2) + '\n');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const replaceOnce = (source, before, after, label) => {
            const count = source.split(before).length - 1;
            assert(count === 1, `${label}: expected one exact match, found ${count}`);
            return source.replace(before, after);
          };
          const replaceBetween = (source, startMarker, endMarker, replacement, label) => {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            assert(start >= 0 && end > start, `${label}: markers not found`);
            return source.slice(0, start) + replacement + source.slice(end);
          };
          const hufGross = (eur) => Math.round(Number(eur) * RATE);
          const hufTax = (grossHUF) => {
            const gross = Math.round(Number(grossHUF));
            const net = Math.round(gross / 1.2);
            return { grossHUF: gross, netHUF: net, vatHUF: gross - net };
          };

          // Canonical pricing: EUR remains authoritative; HUF is a deterministic localized view.
          const pricing = json('pricing.json');
          pricing.schemaVersion = '2026-08-05-v7-eur-huf-fixed-rate';
          pricing.dateModified = NOW;
          pricing.currency = 'EUR';
          pricing.secondaryDisplayCurrency = 'HUF';
          pricing.displayCurrencies = {
            en: { currency: 'EUR', role: 'canonical orientation pricing' },
            'de-AT': { currency: 'EUR', role: 'canonical orientation pricing' },
            'hu-HU': {
              currency: 'HUF',
              role: 'localized orientation display',
              conversionFrom: 'EUR',
              fixedPlanningRate: RATE,
              formula: 'HUF gross = EUR gross × 400',
              liveExchangeRate: false
            }
          };
          pricing.fixedCurrencyConversions = {
            EUR_HUF: {
              sourceCurrency: 'EUR',
              targetCurrency: 'HUF',
              rate: RATE,
              rateType: 'fixed planning conversion',
              liveExchangeRate: false,
              scope: 'Hungarian website, Hungarian preliminary PDF and AI-generated Hungarian orientation estimates',
              formula: 'Convert the gross EUR result to HUF first. Then calculate HUF net = round(gross HUF / 1.20) and HUF VAT = gross HUF - net HUF.',
              disclosure: 'This is not a daily foreign-exchange rate and does not predetermine the currency of the final written offer.'
            }
          };
          pricing.priceComponentsGrossHUF = Object.fromEntries(
            Object.entries(pricing.priceComponentsGrossEUR).map(([key, value]) => [key, hufGross(value)])
          );
          pricing.standardUsageLicence = {
            included: true,
            scope: 'The standard organisational licence for the agreed final images is unlimited in time and territory for the commissioning organisation and the communication channels recorded in the written offer.',
            copyright: 'Copyright remains with the photographer.',
            reviewRequiredFor: [
              'transfer beyond the accepted client or agreed agencies and media partners',
              'stock, resale or sublicensing',
              'uses outside the accepted project purpose',
              'exceptional paid-media, campaign or third-party exploitation when not already recorded in the written offer'
            ],
            interpretation: 'Do not describe every usage right as an automatic surcharge. Standard organisational use is included; only exceptional or out-of-scope exploitation requires separate review.'
          };
          pricing.machineReadableHufSource = 'https://www.norbertbanhalmi.com/pricing-huf.json';
          pricing.pricingSemantics = pricing.pricingSemantics || {};
          pricing.pricingSemantics.hungarianDisplay = 'The Hungarian interface displays HUF using the fixed planning conversion 1 EUR = 400 HUF. EUR remains the canonical base price. Convert gross first, then derive HUF net and VAT so the displayed HUF figures reconcile exactly.';
          pricing.pricingSemantics.usageLicence = 'The standard organisational licence is included and unlimited in time and territory for the agreed client and channels. Exceptional transfer, resale, sublicensing or out-of-scope use is reviewed in the final written offer.';
          pricing.calculationRules = pricing.calculationRules || {};
          pricing.calculationRules.currencyConversion = {
            hungarianDisplay: 'grossHUF = round(grossEUR × 400); netHUF = round(grossHUF / 1.20); vatHUF = grossHUF - netHUF',
            canonicalCurrency: 'EUR',
            displayCurrency: 'HUF',
            fixedRate: RATE,
            noLiveRateSubstitution: true
          };
          pricing.finalOfferFactors = pricing.finalOfferFactors.map((item) => item === 'usage rights and media scope' ? 'exceptional or out-of-scope usage, transfer and media exploitation beyond the included standard organisational licence' : item);
          for (const service of pricing.services) {
            for (const pkg of service.packages || []) if (Number.isFinite(Number(pkg.grossEUR))) pkg.grossHUF = hufGross(pkg.grossEUR);
            for (const [eurKey, hufKey] of [
              ['extraRetouchedImageGrossEUR', 'extraRetouchedImageGrossHUF'],
              ['additionalPhotographerPerHourGrossEUR', 'additionalPhotographerPerHourGrossHUF']
            ]) if (Number.isFinite(Number(service[eurKey]))) service[hufKey] = hufGross(service[eurKey]);
            if (service.groupPortraitPricing) {
              const group = service.groupPortraitPricing;
              group.setupGrossHUF = hufGross(group.setupGrossEUR);
              group.perPersonGrossHUF = hufGross(group.perPersonGrossEUR);
              group.extraRetouchedImagePerPersonGrossHUF = hufGross(group.extraRetouchedImagePerPersonGrossEUR);
              group.additionalPhotographerGrossHUF = hufGross(group.additionalPhotographerGrossEUR);
            }
          }
          writeJson('pricing.json', pricing);

          const pricingHuf = {
            documentType: 'BANHALMI fixed-rate HUF orientation pricing',
            schemaVersion: '2026-08-05-v1',
            dateModified: NOW,
            canonicalBasePricingSource: 'https://www.norbertbanhalmi.com/pricing.json',
            aiInterpretationGuide: 'https://www.norbertbanhalmi.com/pricing-guide.json',
            quoteCalculator: 'https://www.norbertbanhalmi.com/hu/ajanlatkeres/',
            currency: 'HUF',
            baseCurrency: 'EUR',
            conversion: pricing.fixedCurrencyConversions.EUR_HUF,
            priceBasis: 'Gross Hungarian orientation amounts derived from the canonical gross EUR prices at the fixed planning rate 1 EUR = 400 HUF.',
            vat: {
              ratePercent: 20,
              includedInDisplayedPrices: true,
              calculation: 'netHUF = round(grossHUF / 1.20); vatHUF = grossHUF - netHUF'
            },
            bindingStatus: pricing.bindingStatus,
            standardUsageLicence: pricing.standardUsageLicence,
            priceComponentsGrossHUF: pricing.priceComponentsGrossHUF,
            services: pricing.services.map((service) => {
              const converted = {
                id: service.id,
                name: service.name,
                packages: (service.packages || []).map((pkg) => ({
                  code: pkg.code,
                  ...(pkg.durationMinutes ? { durationMinutes: pkg.durationMinutes } : {}),
                  ...(pkg.durationHours ? { durationHours: pkg.durationHours } : {}),
                  baseGrossEUR: pkg.grossEUR,
                  grossHUF: pkg.grossHUF,
                  ...(pkg.includedRetouchedImages ? { includedRetouchedImages: pkg.includedRetouchedImages } : {})
                }))
              };
              if (service.includedRetouchedImages != null) converted.includedRetouchedImages = service.includedRetouchedImages;
              if (service.extraRetouchedImageGrossHUF != null) converted.extraRetouchedImageGrossHUF = service.extraRetouchedImageGrossHUF;
              if (service.additionalPhotographerPerHourGrossHUF != null) converted.additionalPhotographerPerHourGrossHUF = service.additionalPhotographerPerHourGrossHUF;
              if (service.groupPortraitPricing) converted.groupPortraitPricing = {
                setupGrossHUF: service.groupPortraitPricing.setupGrossHUF,
                perPersonGrossHUF: service.groupPortraitPricing.perPersonGrossHUF,
                includedRetouchedImagesPerPerson: service.groupPortraitPricing.includedRetouchedImagesPerPerson,
                extraRetouchedImagePerPersonGrossHUF: service.groupPortraitPricing.extraRetouchedImagePerPersonGrossHUF,
                capacityPerPhotographerPerHour: service.groupPortraitPricing.capacityPerPhotographerPerHour,
                additionalPhotographerGrossHUF: service.groupPortraitPricing.additionalPhotographerGrossHUF
              };
              return converted;
            }),
            calculationRules: {
              currencyConversion: pricing.calculationRules.currencyConversion,
              serviceFormulas: pricing.calculationRules,
              instruction: 'Use the HUF component amounts directly or calculate the canonical EUR gross total and convert that gross total at exactly 400 HUF per EUR. Never substitute a live exchange rate for the official Hungarian orientation display.'
            },
            finalOfferFactors: pricing.finalOfferFactors,
            finalOfferCurrencyNotice: 'The accepted written offer records the contractual currency. The fixed HUF display is a preliminary planning view, not a promise that every final invoice will be issued in HUF.'
          };
          writeJson('pricing-huf.json', pricingHuf);

          const guide = json('pricing-guide.json');
          guide.schemaVersion = '2026-08-05-v3-eur-huf';
          guide.dateModified = NOW;
          guide.hungarianPricingSource = 'https://www.norbertbanhalmi.com/pricing-huf.json';
          guide.displayCurrencyByLanguage = {
            en: 'EUR',
            'de-AT': 'EUR',
            'hu-HU': 'HUF at the fixed planning rate 1 EUR = 400 HUF'
          };
          guide.fixedCurrencyConversion = pricing.fixedCurrencyConversions.EUR_HUF;
          guide.assistantInstructions = [
            ...guide.assistantInstructions.filter((item) => !item.includes('fixed planning rate') && !item.includes('Hungarian')),
            'For Hungarian-language orientation estimates, display HUF as the primary currency using the fixed planning conversion 1 EUR = 400 HUF. Do not use or imply a live foreign-exchange rate.',
            'For HUF tax display, convert the gross EUR total first: grossHUF = round(grossEUR × 400); netHUF = round(grossHUF / 1.20); vatHUF = grossHUF - netHUF.',
            'Always state that EUR is the canonical base price and that the HUF amount is a non-binding fixed-rate planning view. The accepted written offer defines the contractual currency.',
            'The standard organisational licence is included and unlimited in time and territory for the agreed client and channels. Do not invent a usage-rights surcharge unless the requested use is exceptional or outside the accepted scope.'
          ];
          guide.calculationOrder = [
            ...guide.calculationOrder.filter((item) => !item.includes('HUF')),
            'When the response language is Hungarian, convert the completed gross EUR estimate to HUF at 400, then derive reconciled whole-forint net and VAT values.',
            'Return both canonical EUR and localized HUF values when useful for auditability, with HUF primary in Hungarian responses.'
          ];
          for (const example of guide.workedExamples || []) {
            const amounts = hufTax(hufGross(example.grossEUR));
            example.hungarianDisplay = {
              fixedRateHUFPerEUR: RATE,
              baseGrossEUR: example.grossEUR,
              ...amounts
            };
          }
          guide.responseTemplate.fields = Array.from(new Set([
            ...guide.responseTemplate.fields,
            'baseCurrencyEUR',
            'displayCurrency',
            'fixedHufRateWhenHungarian',
            'displayGrossHUF',
            'displayNetHUF',
            'displayVatHUF'
          ]));
          guide.finalOfferNotice += ' Hungarian HUF figures use a fixed planning rate of 1 EUR = 400 HUF; the accepted written offer records the contractual currency.';
          writeJson('pricing-guide.json', guide);

          const projectPolicy = json('project-policy.json');
          projectPolicy.schemaVersion = '2026-08-05-v3-eur-huf';
          projectPolicy.dateModified = NOW;
          projectPolicy.commercialInterpretation.hungarianOrientationCurrency = 'The Hungarian calculator displays HUF at a fixed planning conversion of 1 EUR = 400 HUF. EUR remains the canonical base price; the accepted written offer records the contractual currency.';
          projectPolicy.interpretationRules.push('Do not treat the fixed 1 EUR = 400 HUF Hungarian planning conversion as a live exchange rate or as an automatic promise of invoice currency.');
          projectPolicy.interpretationRules = Array.from(new Set(projectPolicy.interpretationRules));
          writeJson('project-policy.json', projectPolicy);

          // Embedded fallback is now generated from and identical to pricing.json.
          const compactPricing = JSON.stringify(pricing);
          const pricingVersion = crypto.createHash('sha256').update(compactPricing).digest('hex').slice(0, 12);
          write('assets/js/pricing-data.js', `/* Generated from /pricing.json. Keep both files in sync. */\nwindow.BANHALMI_PRICING_DATA=${compactPricing};\nwindow.BANHALMI_PRICING_VERSION=${JSON.stringify(pricingVersion)};\n`);

          // Currency-aware calculator: EUR remains canonical, Hungarian display becomes HUF.
          let calculator = read('assets/js/quote-calculator.js');
          calculator = replaceOnce(calculator,
            "  var VAT=0.20;",
            "  var VAT=0.20;\n  var DEFAULT_HUF_RATE=400;",
            'quote calculator VAT marker');
          calculator = replaceOnce(calculator,
            "  var pricingLoaded=false,pricingReady=false,pricingError='',pricingMeta={brandIncluded:0,artIncluded:0};",
            "  var pricingLoaded=false,pricingReady=false,pricingError='',pricingMeta={brandIncluded:0,artIncluded:0,hufRate:DEFAULT_HUF_RATE};",
            'quote calculator metadata');
          calculator = replaceOnce(calculator,
            "vat20:'Az előzetes kalkuláció 20% osztrák ÁFÁ-val számol. A 0%-os ÁFA csak a cég, a közösségi adószám és a vonatkozó jogszabályi feltételek ellenőrzése után válhat érvényessé.',reverse:'Az előzetes kalkuláció továbbra is 20% osztrák ÁFÁ-t tartalmaz. A 0%-os ÁFA kizárólag a cég, a közösségi adószám és a vonatkozó jogszabályi feltételek ellenőrzése után lesz érvényes.'",
            "vat20:'A forintösszegek rögzített 1 EUR = 400 HUF tervezési árfolyamon jelennek meg, és 20% osztrák ÁFÁ-t tartalmaznak. A 0%-os ÁFA csak ellenőrzés után válhat érvényessé.',reverse:'A forintösszegek rögzített 1 EUR = 400 HUF tervezési árfolyamon jelennek meg. A kalkuláció továbbra is 20% osztrák ÁFÁ-t tartalmaz; a 0%-os kezelés csak jogi és adószám-ellenőrzés után érvényes.'",
            'Hungarian VAT copy');
          calculator = replaceOnce(calculator,
            "pricingMeta.brandIncluded=Number(brand&&brand.includedRetouchedImages);pricingMeta.artIncluded=Number(art&&art.includedRetouchedImages);if(!isFinite(pricingMeta.brandIncluded)||pricingMeta.brandIncluded<0||!isFinite(pricingMeta.artIncluded)||pricingMeta.artIncluded<0)throw new Error('Missing included-retouch metadata');pricingLoaded=true;pricingReady=true;pricingError='';",
            "pricingMeta.brandIncluded=Number(brand&&brand.includedRetouchedImages);pricingMeta.artIncluded=Number(art&&art.includedRetouchedImages);var fx=data&&data.fixedCurrencyConversions&&data.fixedCurrencyConversions.EUR_HUF;pricingMeta.hufRate=Number(fx&&fx.rate)||DEFAULT_HUF_RATE;if(!isFinite(pricingMeta.brandIncluded)||pricingMeta.brandIncluded<0||!isFinite(pricingMeta.artIncluded)||pricingMeta.artIncluded<0)throw new Error('Missing included-retouch metadata');if(!isFinite(pricingMeta.hufRate)||pricingMeta.hufRate<=0)throw new Error('Missing fixed EUR/HUF planning rate');pricingLoaded=true;pricingReady=true;pricingError='';",
            'pricing metadata load');
          calculator = replaceOnce(calculator,
            "  function money(v){var n=Number(v);if(!isFinite(n))n=0;return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}",
            "  function money(v,currency,language){var n=Number(v);if(!isFinite(n))n=0;var code=currency||'EUR';var locale=code==='HUF'?'hu-HU':language==='de'?'de-AT':language==='hu'?'hu-HU':'en-GB';return new Intl.NumberFormat(locale,{style:'currency',currency:code,minimumFractionDigits:code==='HUF'?0:2,maximumFractionDigits:code==='HUF'?0:2}).format(n);}",
            'money formatter');

          const currencyFunctions = `  function emptyEstimate(ready,mode){return{gross:0,grossBeforeVatMode:0,net:0,vat:0,baseCurrency:'EUR',displayCurrency:'EUR',displayRate:1,displayGross:0,displayNet:0,displayVat:0,reverse:false,reverseEligible:false,vatMode:mode||'at-vat-20',parts:'',category:'',photographerCount:0,peopleCount:0,retouchedImagesPerPerson:0,retouchedImagesTotal:0,instantRetouchHours:0,pricingSource:ready?(pricingLoaded?'pricing.json':'embedded'):'unavailable',pricingReady:!!ready,customTravel:false,travelCountry:'',eventRecommendedPhotographers:0,eventDeliveredImagesEstimate:0};}
          function calculate(f){
            if(!pricingReady)return emptyEstimate(false,'pricing-unavailable');
            var categoryField=f.querySelector('[name="category"]:checked');
            if(!categoryField)return emptyEstimate(true,'at-vat-20');
            var cat=categoryField.value;
            if((cat==='individual'&&!f.querySelector('[name="individual_mode"]:checked'))||(cat==='brand'&&!f.querySelector('[name="brand_duration"]:checked'))||(cat==='event'&&!f.querySelector('[name="event_duration"]:checked')))return emptyEstimate(true,'at-vat-20');
            var uiLang=lang(f),l=copy[uiLang],gross=0,parts=[],ret=Math.max(1,num(f,'retouched_images',1)),people=peopleCount(f,cat),photographers=requiredPhotographers(f,cat),mode=val(f,'individual_mode','quick30');
            if(cat==='individual'){
              gross+=pricesGross[mode]||pricesGross.quick30;
              if(mode!=='headshotcv')gross+=Math.max(0,ret-1)*pricesGross.retouchPortrait;
              parts.push(l.individual+' — '+((packageNames[uiLang]||packageNames.en)[mode]||mode));
            }else if(cat==='group'){
              gross+=pricesGross.groupSetup+people*pricesGross.groupPerson+people*Math.max(0,ret-1)*pricesGross.retouchGroup;
              if(photographers>1)gross+=(photographers-1)*pricesGross.extraPhotographer;
              parts.push(l.group+': '+people+' '+l.people+', '+photographers+' '+l.photographers+', '+ret+' '+l.retouches+' '+l.perPerson);
            }else if(cat==='brand'){
              var bd=val(f,'brand_duration','brand60');
              gross+=pricesGross[bd];
              var brandTotal=people*ret;
              gross+=Math.max(0,brandTotal-pricingMeta.brandIncluded)*pricesGross.retouchPortrait;
              parts.push(l.brand+': '+people+' '+l.people+', '+ret+' '+l.retouches+' '+l.perPerson+'; '+pricingMeta.brandIncluded+' '+l.included);
            }else if(cat==='art'){
              var ad=val(f,'art_duration','art60');
              gross+=pricesGross[ad];
              gross+=Math.max(0,ret-pricingMeta.artIncluded)*pricesGross.retouchArt;
              parts.push(l.art+': '+ret+' '+l.retouches+'; '+pricingMeta.artIncluded+' '+l.included);
            }else{
              var ed=val(f,'event_duration','event60');
              gross+=pricesGross[ed];
              photographers=requiredPhotographers(f,cat);
              var extraEvent=photographers-1;
              gross+=extraEvent*selectedHours(f,cat)*pricesGross.extraPhotographerEventHour;
              parts.push(l.event+': '+ret+' '+(uiLang==='hu'?'becsült átadott kép':uiLang==='de'?'voraussichtlich gelieferte Bilder':'estimated delivered images')+', '+photographers+' '+l.photographers+' ('+(uiLang==='hu'?'előzetesen ajánlott minimum':uiLang==='de'?'vorläufig empfohlenes Minimum':'preliminarily recommended minimum')+')');
            }
            var addons=checked(f,'addons').filter(function(code){return code!=='instantretouch'||instantAllowed(cat,mode);});
            if(cat==='individual'&&mode==='headshotcv')addons=addons.filter(function(code){return ['stylist','hair','makeup'].indexOf(code)>=0;});
            addons.forEach(function(addon){
              if(addon==='instantretouch'){
                var ih=requiredInstantHours(f,cat,ret);gross+=ih*pricesGross.instantretouch;parts.push(l.instant+': '+ih+' '+l.hours);
              }else if(addon==='mobile'){
                var studios=Math.max(1,photographers);gross+=studios*pricesGross.mobile;parts.push(l.mobileStudio+': '+studios);
              }else{
                gross+=pricesGross[addon]||0;parts.push((l.addons&&l.addons[addon])||addon);
              }
            });
            var location=val(f,'location','vienna'),travelCountry=String(val(f,'travel_country','')).toUpperCase(),crew=photographers+(addons.indexOf('stylist')>=0?1:0)+(addons.indexOf('hair')>=0?1:0)+(addons.indexOf('makeup')>=0?1:0)+(addons.indexOf('instantretouch')>=0?1:0),customTravel=false;
            if(location!=='vienna'&&location!=='budapest'){
              if(travelCountry==='AT'||travelCountry==='HU'){
                var vehicles=Math.max(1,Math.ceil(crew/4));gross+=vehicles*pricesGross.travelVehicle;parts.push(l.travel+': '+vehicles+' '+l.vehicles+', '+crew+' '+l.crew);
              }else{
                customTravel=true;parts.push(uiLang==='hu'?'Nemzetközi utazás: egyedi ajánlat':uiLang==='de'?'Internationale Anreise: individuelles Angebot':'International travel: custom quote required');
              }
            }
            var totalRetouched=(cat==='group'||cat==='brand')?people*ret:ret,t=tax(f,gross),displayCurrency=uiLang==='hu'?'HUF':'EUR',displayRate=displayCurrency==='HUF'?pricingMeta.hufRate:1,displayGross=displayCurrency==='HUF'?Math.round(t.total*displayRate):t.total,displayNet=displayCurrency==='HUF'?Math.round(displayGross/(1+VAT)):t.net,displayVat=displayCurrency==='HUF'?displayGross-displayNet:t.vat;
            return{gross:t.total,grossBeforeVatMode:Math.round(gross*100)/100,net:t.net,vat:t.vat,baseCurrency:'EUR',displayCurrency:displayCurrency,displayRate:displayRate,displayGross:displayGross,displayNet:displayNet,displayVat:displayVat,reverse:false,reverseEligible:t.reverseEligible,vatMode:t.mode,parts:parts.join('; '),category:cat,photographerCount:photographers,peopleCount:people,retouchedImagesPerPerson:ret,retouchedImagesTotal:totalRetouched,instantRetouchHours:addons.indexOf('instantretouch')>=0?requiredInstantHours(f,cat,ret):0,pricingSource:pricingLoaded?'pricing.json':'unavailable',pricingReady:pricingReady,customTravel:customTravel,travelCountry:travelCountry,eventRecommendedPhotographers:cat==='event'?photographers:0,eventDeliveredImagesEstimate:cat==='event'?ret:0};
          }
          function paint(f){
            updatePanels(f);
            var e=calculate(f),uiLang=lang(f),l=copy[uiLang],root=quoteRoot(f),summary=f.querySelector('[data-estimate-summary]');
            if(summary)summary.value=e.parts;
            [['estimate_net',e.net],['estimate_vat',e.vat],['estimate_gross',e.gross],['estimate_vat_mode',e.vatMode],['estimate_summary',e.parts],['estimate_display_currency',e.displayCurrency],['estimate_display_rate',e.displayRate],['estimate_display_net',e.displayNet],['estimate_display_vat',e.displayVat],['estimate_display_gross',e.displayGross],['estimate_base_currency',e.baseCurrency]].forEach(function(pair){var x=f.querySelector('[name="'+pair[0]+'"]');if(x)x.value=pair[1];});
            var net=root.querySelector('[data-estimate-net]'),vat=root.querySelector('[data-estimate-vat]'),gross=root.querySelector('[data-estimate-gross]'),note=root.querySelector('[data-estimate-vat-note]')||root.querySelector('[data-vat-note]');
            if(net)net.textContent=e.pricingReady?money(e.displayNet,e.displayCurrency,uiLang):(pricingError?pricingUiError(f):(uiLang==='hu'?'Számítás…':uiLang==='de'?'Berechnung…':'Calculating…'));
            if(vat)vat.textContent=e.pricingReady?money(e.displayVat,e.displayCurrency,uiLang):(pricingError?'—':(uiLang==='hu'?'Számítás…':uiLang==='de'?'Berechnung…':'Calculating…'));
            if(gross)gross.textContent=e.pricingReady?money(e.displayGross,e.displayCurrency,uiLang):(pricingError?'—':(uiLang==='hu'?'Számítás…':uiLang==='de'?'Berechnung…':'Calculating…'));
            if(note)note.textContent=e.reverseEligible?l.reverse:l.vat20;
            var warning=f.querySelector('[data-custom-travel-warning]');if(warning)warning.hidden=!e.customTravel;
            return e;
          }
`;
          calculator = replaceBetween(calculator, '  function emptyEstimate(ready,mode){', '  function init(f){', currencyFunctions, 'calculator currency functions');
          write('assets/js/quote-calculator.js', calculator);

          // Submission payload keeps canonical EUR and adds localized HUF fields.
          let main = read('assets/js/main.js');
          const payloadPattern = /      netAmount: estimate\? String\(estimate\.net\): readField\(form, 'estimate_net'\),[\s\S]*?      grossAmount: estimate\? String\(estimate\.gross\): readField\(form, 'estimate_gross'\),/;
