          // Mobile-safe long HUF totals.
          let css = read('assets/css/style.css');
          if (!css.includes('HUF quote total guard')) css += `\n/* HUF quote total guard: long whole-forint values remain readable on mobile. */\nhtml[lang^="hu"] .quote-total{font-variant-numeric:tabular-nums;font-size:clamp(2rem,7vw,3.5rem);overflow-wrap:anywhere}\n`;
          write('assets/css/style.css', css);

          // Permanent audit: one EUR source, one exact HUF view, complete schemas and AI instructions.
          const audit = `import fs from 'node:fs';
          const fail=[];const read=p=>fs.readFileSync(p,'utf8');const j=p=>JSON.parse(read(p));const ok=(v,m)=>{if(!v)fail.push(m)};const rate=400;
          const p=j('pricing.json'),h=j('pricing-huf.json'),g=j('pricing-guide.json'),policy=j('project-policy.json');
          ok(p.currency==='EUR','pricing.json canonical currency must remain EUR');
          ok(p.fixedCurrencyConversions?.EUR_HUF?.rate===rate,'fixed EUR/HUF rate must be 400');
          ok(p.fixedCurrencyConversions?.EUR_HUF?.liveExchangeRate===false,'HUF rate must be explicitly non-live');
          ok(p.machineReadableHufSource==='https://www.norbertbanhalmi.com/pricing-huf.json','HUF source URL missing');
          ok(p.standardUsageLicence?.included===true,'standard organisational licence must be included');
          ok(/unlimited in time and territory/.test(p.standardUsageLicence?.scope||''),'standard licence scope unclear');
          for(const [key,value] of Object.entries(p.priceComponentsGrossEUR))ok(p.priceComponentsGrossHUF[key]===Math.round(value*rate),'HUF component mismatch: '+key);
          ok(h.currency==='HUF'&&h.baseCurrency==='EUR','pricing-huf currency roles invalid');
          ok(h.conversion?.rate===rate&&h.conversion?.liveExchangeRate===false,'pricing-huf conversion invalid');
          const embedded=read('assets/js/pricing-data.js').match(/window\.BANHALMI_PRICING_DATA=(.*);\nwindow\.BANHALMI_PRICING_VERSION=/s);
          ok(Boolean(embedded),'embedded pricing payload missing');if(embedded){try{ok(JSON.stringify(JSON.parse(embedded[1]))===JSON.stringify(p),'embedded pricing data is not identical to pricing.json')}catch{fail.push('embedded pricing JSON invalid')}}
          const calc=read('assets/js/quote-calculator.js');for(const token of ['displayCurrency','displayGross','displayNet','displayVat','pricingMeta.hufRate','HUF'])ok(calc.includes(token),'calculator missing '+token);
          const main=read('assets/js/main.js');for(const token of ['displayCurrency','displayExchangeRate','displayGrossAmount'])ok(main.includes(token),'quote payload missing '+token);
          const pdf=read('assets/js/quote-pdf.js');for(const token of ['Fix tervezési árfolyam: 1 EUR = 400 HUF','data.currency','displayGross'])ok(pdf.includes(token),'PDF missing '+token);
          const pages=[['requestaquote/index.html','EUR'],['de-at/anfrage/index.html','EUR'],['hu/ajanlatkeres/index.html','HUF']];
          for(const [file,currency] of pages){const html=read(file);for(const token of ['estimate_display_currency','estimate_display_rate','estimate_display_gross'])ok(html.includes(token),file+' missing '+token);const scripts=[...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].map(x=>{try{return JSON.parse(x[1])}catch{return null}});const catalog=scripts.find(x=>x?.['@type']==='OfferCatalog');ok(Boolean(catalog),file+' OfferCatalog missing');if(catalog){ok(catalog.itemListElement.length===30,file+' OfferCatalog must expose 30 price components');ok(catalog.itemListElement.every(x=>x.priceCurrency===currency),file+' OfferCatalog currency mismatch');ok(catalog.itemListElement.some(x=>/Headshot|CV-portré/.test(x.name)&&Number(x.price)===(currency==='HUF'?48000:120)),file+' Headshot CV offer missing')}}
          const hu=read('hu/ajanlatkeres/index.html');for(const token of ['1 EUR = 400 HUF','/pricing-huf.json','forintban','48 000 Ft','144 000 Ft','96 000 Ft'])ok(hu.includes(token),'Hungarian quote page missing '+token);
          for(const file of ['ai.txt','llms.txt']){const text=read(file);for(const token of ['pricing-huf.json','1 EUR = 400 HUF','not a live exchange rate','grossHUF'])ok(text.includes(token),file+' missing '+token)}
          ok(g.fixedCurrencyConversion?.rate===rate,'pricing guide fixed rate missing');ok(g.workedExamples.every(x=>x.hungarianDisplay?.fixedRateHUFPerEUR===rate),'worked example HUF conversion missing');
          ok(/fixed planning conversion/.test(policy.commercialInterpretation?.hungarianOrientationCurrency||''),'project policy HUF interpretation missing');
          if(fail.length){console.error(fail.join('\n'));process.exit(1)}console.log('EUR/HUF pricing, OfferCatalog, PDF and LLM audit passed.');
          `;
          write('tools/audit-pricing-huf.mjs', audit);

          const packageJson = json('package.json');
          if (!packageJson.scripts.audit.includes('audit-pricing-huf.mjs')) packageJson.scripts.audit += ' && node tools/audit-pricing-huf.mjs';
          packageJson.scripts['audit:pricing-huf'] = 'node tools/audit-pricing-huf.mjs';
          writeJson('package.json', packageJson);

          // Browser regression for the localized currency view.
          let browserTest = read('tests/quote-calculator.spec.mjs');
          if (!browserTest.includes('Hungarian quote displays fixed-rate HUF')) browserTest += `\n\ntest('Hungarian quote displays fixed-rate HUF while preserving canonical EUR', async ({ page }) => {\n  await page.goto('/hu/ajanlatkeres/');\n  await expect(page.locator('[data-pricing-ready="true"]')).toHaveCount(1, { timeout: 10000 });\n  await page.locator('input[name="category"][value="individual"]').check();\n  await page.locator('input[name="individual_mode"][value="quick30"]').check();\n  await expect(page.locator('[data-estimate-gross]')).toContainText(/88[ .]?000/);\n  await expect(page.locator('[data-estimate-gross]')).toContainText(/Ft|HUF/);\n  await expect(page.locator('input[name="estimate_gross"]')).toHaveValue('220');\n  await expect(page.locator('input[name="estimate_display_currency"]')).toHaveValue('HUF');\n  await expect(page.locator('input[name="estimate_display_rate"]')).toHaveValue('400');\n  await expect(page.locator('input[name="estimate_display_gross"]')).toHaveValue('88000');\n  await expect(page.locator('[data-vat-note]')).toContainText('1 EUR = 400 HUF');\n});\n`;
          write('tests/quote-calculator.spec.mjs', browserTest);

          let pdfTest = read('tests/quote-pdf-content.test.mjs');
          if (!pdfTest.includes('Fix tervezési árfolyam: 1 EUR = 400 HUF')) {
            pdfTest = pdfTest.replace("  'vorläufige, unverbindliche Kalkulation'", "  'vorläufige, unverbindliche Kalkulation',\n  'Fix tervezési árfolyam: 1 EUR = 400 HUF'");
          }
          write('tests/quote-pdf-content.test.mjs', pdfTest);

          // The one-time mutating workflow removes itself before committing.
          fs.rmSync('.github/workflows/_fix-pricing-huf.yml');
          NODE
          node /tmp/fix-pricing-huf.mjs
      - name: Run deterministic audits
        run: |
          npm install --ignore-scripts
          npm run audit
      - name: Commit migration
        run: |
          git config user.name 'BANHALMI maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add fixed-rate HUF pricing and AI currency model'
          git push
