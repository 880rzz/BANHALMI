name: One-time HUF pricing migration

on:
  push:
    paths:
      - '.github/workflows/_fix-pricing-huf.yml'
      - 'tools/_fix-pricing-huf.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply synchronized EUR and HUF pricing migration
        run: node tools/_fix-pricing-huf.mjs
      - name: Repair generated audit escape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit-pricing-huf.mjs')
          text = path.read_text()
          broken = """match(/window\\.BANHALMI_PRICING_DATA=(.*);
          window\\.BANHALMI_PRICING_VERSION=/s)"""
          fixed = r"match(/window\.BANHALMI_PRICING_DATA=(.*);\nwindow\.BANHALMI_PRICING_VERSION=/s)"
          if broken not in text:
              raise SystemExit('Generated pricing audit escape target was not found')
          path.write_text(text.replace(broken, fixed))
          PY
      - name: Run deterministic audits
        run: |
          npm install --ignore-scripts
          npm run audit
      - name: Commit migration
        run: |
          git config user.name 'BANHALMI maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add fixed-rate HUF pricing and AI currency model'
          git push
