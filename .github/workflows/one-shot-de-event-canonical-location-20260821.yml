name: One-shot canonical DE event Wien Budapest

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/portrait-metadata-vienna-budapest-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/one-shot-de-event-canonical-location-20260821.mjs
      - run: grep -Fq 'C-Level Eventfotografie | Wien–Budapest | BANHALMI' de-at/eventfotografie/index.html
      - run: |
          rm tools/one-shot-de-event-canonical-location-20260821.mjs
          rm .github/workflows/one-shot-de-event-canonical-location-20260821.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- de-at/eventfotografie/index.html tools/one-shot-de-event-canonical-location-20260821.mjs .github/workflows/one-shot-de-event-canonical-location-20260821.yml
          git diff --cached --check
          git commit -m 'SEO: align canonical German event page to Wien and Budapest'
          git pull --rebase origin seo/portrait-metadata-vienna-budapest-20260821
          git push origin HEAD:seo/portrait-metadata-vienna-budapest-20260821
