name: One-time stage-eight team and studio role migration

on:
  push:
    branches:
      - agent/team-studios-stage8-20260802

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-studios-stage8-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply team and studio role clarity
        run: node tools/apply-team-studios-stage8.mjs
      - name: Remove one-time migration files
        run: rm -f tools/apply-team-studios-stage8.mjs .github/workflows/stage8-team-studios-migration.yml
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy > /tmp/banhalmi-human-voice-audit.json
      - name: Verify audit does not modify unrelated tracked files
        run: git diff --exit-code -- . ':!about/index.html' ':!contact/index.html' ':!speier-viko/index.html' ':!requestaquote/index.html' ':!hu/eletmu/index.html' ':!hu/kapcsolat/index.html' ':!hu/speier-viko/index.html' ':!hu/ajanlatkeres/index.html' ':!de-at/werk/index.html' ':!de-at/kontakt/index.html' ':!de-at/speier-viko/index.html' ':!de-at/anfrage/index.html' ':!tools/apply-team-studios-stage8.mjs' ':!.github/workflows/stage8-team-studios-migration.yml'
      - name: Commit audited stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify team and studio responsibilities"
          git push origin HEAD:agent/team-studios-stage8-20260802
