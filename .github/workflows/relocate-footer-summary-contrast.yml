name: Relocate footer contrast into responsive authority

on:
  push:
    branches:
      - audit/full-10-10-20260816
    paths:
      - 'tools/relocate-footer-summary-contrast.mjs'

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-10-10-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relocate footer contrast guard
        run: node tools/relocate-footer-summary-contrast.mjs
      - name: Verify CSS authority and commit
        run: |
          set -euo pipefail
          node tools/audit-apple-responsive-contract.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- assets/css/site.css; then
            echo 'No CSS relocation required.'
            exit 0
          fi
          git add assets/css/site.css
          git commit -m 'fix(a11y): keep footer AA contrast inside responsive authority'
          git push origin HEAD:audit/full-10-10-20260816
