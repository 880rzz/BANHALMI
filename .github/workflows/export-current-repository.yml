name: Export current repository

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-repository-export
          fetch-depth: 0
      - name: Create source archive
        run: |
          zip -qr /tmp/BANHALMI-current.zip . -x '.git/*' -x 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: BANHALMI-current-source
          path: /tmp/BANHALMI-current.zip
          retention-days: 1
