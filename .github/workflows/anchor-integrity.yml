name: Anchor integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/anchor-integrity-20260811
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all same-site fragment links
        run: node tests/audit-anchor-integrity.mjs
