name: Apply indexing redirect fixes stage54
on:
  push:
    branches: [audit/seo-geo-llm-gdpr-fix-20260808]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seo-geo-llm-gdpr-fix-20260808
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/apply-indexing-redirect-fixes-stage54.mjs
      - run: rm -f tools/apply-indexing-redirect-fixes-stage54.mjs
      - run: npm run audit
      - run: npm run test:browser
      - name: Commit audited result
        run: |
          git config user.name "BANHALMI CI"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/apply-indexing-redirect-fixes-stage54.yml
          git add -A
          git commit -m "fix: make live pages indexable and repair legacy redirects" || exit 0
          git push origin HEAD:audit/seo-geo-llm-gdpr-fix-20260808
