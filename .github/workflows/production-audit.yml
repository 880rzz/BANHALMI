name: Production audit checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/vegezz-teljes-production-auditot-es-javitasokat-m51ql6
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tools/run-current-positioning-audit.mjs
      - run: npm run test:browser
