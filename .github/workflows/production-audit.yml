name: Production audit checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/vegezz-teljes-production-auditot-es-javitasokat-m51ql6
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply zero-start calculator patch
        run: |
          python tools/apply-zero-start-fix.py
          python tools/sync-quote-calculator-mirror.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tools/audit-regression.mjs
      - run: npm run test:browser
      - name: Commit verified fix to pull-request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/quote-calculator.js js/quote-calculator.js assets/js/site-config.js tests/quote-calculator.spec.mjs
          git commit -m "Fix zero-euro calculator start natively"
          git push origin HEAD:${{ github.head_ref }}
