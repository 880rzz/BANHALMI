name: Production audit checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-audit:
    if: github.event.pull_request.number == 77 && github.event.pull_request.head.ref == 'agent/data-retention-stage12-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-retention-stage12-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply data retention blocks
        run: node tools/apply-data-retention-stage12.mjs
      - name: Restore permanent workflow and remove migration helpers
        run: |
          git checkout 5ce5294c4385b0c8b7a06a9f324d436dec6a1344 -- .github/workflows/full-audit.yml
          rm -f tools/apply-data-retention-stage12.mjs tools/apply-deliverables-stage9.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy > human-voice-audit.json
      - name: Verify audit did not modify unrelated tracked files
        run: git diff --exit-code -- . ':!*.html' ':!package.json' ':!tools/audit-data-retention-stage12.mjs' ':!.github/workflows/full-audit.yml' ':!tools/apply-data-retention-stage12.mjs' ':!tools/apply-deliverables-stage9.mjs'
      - name: Commit audited stage
        run: |
          rm -f human-voice-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply stage twelve data retention clarity"
          git push origin HEAD:agent/data-retention-stage12-20260802
