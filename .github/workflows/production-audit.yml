name: Production audit checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/vegezz-teljes-production-auditot-es-javitasokat-m51ql6
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply final visual trust hardening
        if: github.actor != 'github-actions[bot]'
        run: node tools/final-visual-trust-hardening.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tools/audit-regression.mjs
      - run: npm run test:browser
