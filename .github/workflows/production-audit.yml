name: Production audit checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-audit:
    if: github.event.pull_request.number == 80 && github.event.pull_request.head.ref == 'agent/payment-invoicing-stage15-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/payment-invoicing-stage15-20260803
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply payment and invoicing blocks
        run: node tools/apply-payment-invoicing-stage15.mjs
      - name: Remove migration helper
        run: rm -f tools/apply-payment-invoicing-stage15.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy > human-voice-audit.json
      - name: Verify audit did not modify unrelated tracked files
        run: git diff --exit-code -- . ':!*.html' ':!package.json' ':!tools/audit-payment-invoicing-stage15.mjs' ':!tools/apply-payment-invoicing-stage15.mjs'
      - name: Commit audited stage
        run: |
          rm -f human-voice-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply stage fifteen payment clarity"
          git push origin HEAD:agent/payment-invoicing-stage15-20260803
