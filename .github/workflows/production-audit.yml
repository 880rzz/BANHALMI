name: Production audit checks
on:
  pull_request:
  push:
    branches: [codex/simplify-four-services-and-fix-quote]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tools/audit-regression.mjs
      - run: npm run test:browser
