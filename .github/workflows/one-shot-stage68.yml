name: One-shot Stage 68 transformer
on:
  push:
    branches:
      - agent/first-principles-apple-20260813-v3
permissions:
  contents: write
jobs:
  transform:
    if: github.event.head_commit.message != 'Apply Stage 68 first-principles Apple UX'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/first-principles-apple-20260813-v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage 68
        run: python tools/apply-stage68.py
      - name: Verify Stage 68
        run: node tools/audit-first-principles-apple-stage68.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css index.html hu/index.html de-at/index.html package.json
          git commit -m "Apply Stage 68 first-principles Apple UX"
          git push origin HEAD:agent/first-principles-apple-20260813-v3
