name: Stage 52 llms agent index migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage52-one-time.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded llms migration
        run: node tools/stage52-llms-agent-index.mjs
      - name: Verify full deterministic audit
        run: npm run audit
      - name: Remove one-time tooling
        run: rm -f .github/workflows/stage52-one-time.yml tools/stage52-llms-agent-index.mjs
      - name: Commit verified migration
        run: |
          git config user.name "BANHALMI Stage 52 Bot"
          git config user.email "107166660+880rzz@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(ai): standardize llms agent entry index"
          git push origin main
