name: One-shot trust proof contrast remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-trust-proof-contrast-20260825.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped WCAG contrast fix and remove runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/site.css')
          css = path.read_text()
          marker = '/* TRUST-PROOF-WCAG-20260825:START */'
          if marker not in css:
              css += '''\n/* TRUST-PROOF-WCAG-20260825:START */
          /* Verified-context band: explicit dark-band and white-card contrast authority. */
          main .trust-proof[data-surface="dark"] .section-head > h2,
          main .trust-proof[data-surface="dark"] .section-head > p:not(.eyebrow){color:#f7f9fc!important}
          main .trust-proof[data-surface="dark"] .section-head > .eyebrow{color:#ead67f!important}
          main .trust-proof[data-surface="dark"] .grid-3 > .card{background:#fff!important;color:#202530!important;border-color:rgba(255,255,255,.18)!important}
          main .trust-proof[data-surface="dark"] .grid-3 > .card h3{color:#202530!important}
          main .trust-proof[data-surface="dark"] .grid-3 > .card p{color:#5b616c!important}
          main .trust-proof[data-surface="dark"] .grid-3 > .card a{color:#5f4715!important}
          /* TRUST-PROOF-WCAG-20260825:END */\n'''
              path.write_text(css)
          PY
          git rm .github/workflows/fix-trust-proof-contrast-20260825.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git commit -m 'Fix verified-context contrast across service pages'
          git push origin HEAD:main
