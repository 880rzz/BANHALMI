name: Portrait and brand cluster migration

on:
  push:
    branches: [seo/portrait-brand-cluster-vienna-budapest-20260812]
    paths:
      - '.github/workflows/portrait-brand-cluster-migration.yml'
      - 'tools/migrate-portrait-brand-cluster-20260812-v2.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/portrait-brand-cluster-vienna-budapest-20260812
          fetch-depth: 0

      - name: Run guarded migration
        run: node tools/migrate-portrait-brand-cluster-20260812-v2.mjs

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('services.json','utf8')); JSON.parse(require('fs').readFileSync('ai-entry.json','utf8'));"

      - name: Commit migrated source pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html portrait/index.html hu/portre/index.html de-at/portrait/index.html lifestyle/index.html hu/brand/index.html de-at/brand/index.html services.json ai-entry.json
          if git diff --cached --quiet; then
            echo 'No migration changes detected.'
            exit 1
          fi
          git commit -m 'Align portrait and brand topical cluster across EN HU DE'
          git push origin HEAD:seo/portrait-brand-cluster-vienna-budapest-20260812
