name: Fix HU principal service
on:
  push:
    branches: [seo/portrait-brand-cluster-vienna-budapest-20260812]
    paths:
      - '.github/workflows/fix-hu-principal-service-20260812.yml'
      - 'tools/fix-hu-principal-service-20260812.mjs'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/portrait-brand-cluster-vienna-budapest-20260812
          fetch-depth: 0
      - run: node tools/fix-hu-principal-service-20260812.mjs
      - name: Commit content fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hu/index.html
          git commit -m 'Restore vezetői portréfotózás in HU service hierarchy'
          git push origin HEAD:seo/portrait-brand-cluster-vienna-budapest-20260812
