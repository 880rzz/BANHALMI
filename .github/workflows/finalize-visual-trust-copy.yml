name: Finalize visual trust copy

on:
  push:
    branches:
      - agent/visual-trust-positioning
    paths:
      - tools/finalize-visual-trust-copy.mjs
      - .github/workflows/finalize-visual-trust-copy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-trust-positioning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/finalize-visual-trust-copy.mjs
      - run: node tools/audit-regression.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          git diff --cached --quiet || git commit -m 'Preserve first-impression positioning in visual trust copy'
          git push
