name: Apply video call ecosystem migration

on:
  push:
    branches:
      - fix/video-call-ecosystem-20260809
    paths:
      - scripts/apply-video-call-ecosystem-20260809.mjs
      - .github/workflows/apply-video-call-ecosystem-20260809.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-call-ecosystem-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply one-time migration
        run: node scripts/apply-video-call-ecosystem-20260809.mjs
      - name: Commit migrated source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 1
          fi
          git commit -m "fix: set video consultation to 15 minutes and lock ecosystem roles"
          git push origin HEAD:fix/video-call-ecosystem-20260809
