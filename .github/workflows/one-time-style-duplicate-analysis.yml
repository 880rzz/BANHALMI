name: One-time style duplicate analysis
on:
  push:
    branches: [main]
    paths:
      - 'tools/analyze-style-duplicate-range.mjs'
      - '.github/workflows/one-time-style-duplicate-analysis.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/analyze-style-duplicate-range.mjs
