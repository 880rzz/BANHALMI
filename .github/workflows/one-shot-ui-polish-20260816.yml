name: One-shot UI polish 20260816

on:
  push:
    branches: [fix/ui-polish-hero-footer-info-20260816]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-polish-hero-footer-info-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Apply source fix
        run: |
          set -euo pipefail
          python3 .github/ui-polish-20260816.py
          npm test
      - name: Browser geometry and contrast audit
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          cp assets/css/site.css _site/assets/css/site.css
          node tools/perf-static-server.mjs _site 4173 >/tmp/ui-polish-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; rm -rf _site' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const failures = [];
          const viewports = [
            {width:390,height:844},
            {width:768,height:1024},
            {width:1440,height:1100},
            {width:1536,height:1024},
          ];
          const homes = ['/', '/hu/', '/de-at/'];
          const quotes = ['/requestaquote/', '/hu/ajanlatkeres/', '/de-at/anfrage/'];
          for (const vp of viewports) {
            const page = await browser.newPage({viewport:vp});
            for (const path of homes) {
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const g = await page.evaluate(() => {
                const parseRgb = (value) => {
                  const m=value.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
                  return m ? [Number(m[1]),Number(m[2]),Number(m[3])] : null;
                };
                const lum = (rgb) => {
                  const v=rgb.map(x=>{const c=x/255;return c<=0.04045?c/12.92:((c+0.055)/1.055)**2.4;});
                  return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
                };
                const contrast = (a,b) => {const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);};
                const h=document.querySelector('.site-header');
                const hero=document.querySelector('main > section.hero.hero-image-first.hero-visual-only');
                const art=document.querySelector('.fp-decision-system .fp-art-path > span');
                if(!h||!hero||!art)return null;
                const hr=h.getBoundingClientRect(), rr=hero.getBoundingClientRect();
                const ac=getComputedStyle(art);
                let bgEl=art.parentElement;
                let bg='rgba(0, 0, 0, 0)';
                while(bgEl){
                  bg=getComputedStyle(bgEl).backgroundColor;
                  if(bg && bg!=='rgba(0, 0, 0, 0)' && bg!=='transparent') break;
                  bgEl=bgEl.parentElement;
                }
                const fgRgb=parseRgb(ac.color), bgRgb=parseRgb(bg);
                return {
                  gap:rr.top-hr.bottom,
                  topPadding:getComputedStyle(hero).paddingTop,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  artContrast:fgRgb&&bgRgb?contrast(fgRgb,bgRgb):0,
                  artColor:ac.color,
                  artBg:bg
                };
              });
              if(!g) failures.push(`${path} ${vp.width}: missing header/visual hero/art prompt`);
              else {
                if(Math.abs(g.gap)>2) failures.push(`${path} ${vp.width}: header→hero gap ${g.gap.toFixed(2)}px`);
                if(parseFloat(g.topPadding)>1) failures.push(`${path} ${vp.width}: hero padding-top ${g.topPadding}`);
                if(g.artContrast < 4.5) failures.push(`${path} ${vp.width}: art prompt contrast ${g.artContrast.toFixed(2)} (${g.artColor} on ${g.artBg})`);
                if(g.overflow>1) failures.push(`${path} ${vp.width}: horizontal overflow ${g.overflow}px`);
              }
            }
            for (const path of quotes) {
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const r = await page.evaluate(() => {
                const cards=[...document.querySelectorAll('.smart-quote-layout .option-row, .smart-quote-layout .category-card')];
                const tips=[...document.querySelectorAll('.smart-quote-layout .info-tip')];
                const bad=[];
                let visibleTipCount=0;
                for(const tip of tips){
                  const card=tip.closest('.option-row,.category-card');
                  const span=tip.parentElement;
                  if(!card||!span)continue;
                  const t=tip.getBoundingClientRect();
                  if(t.width===0 || t.height===0) continue;
                  visibleTipCount += 1;
                  const c=card.getBoundingClientRect(), s=span.getBoundingClientRect();
                  const cs=getComputedStyle(tip), ss=getComputedStyle(span);
                  const rightSlack=c.right-t.right;
                  const spanSlack=c.right-s.right;
                  if(cs.position!=='static') bad.push(`tip position ${cs.position}`);
                  if(rightSlack < -1 || rightSlack > 18) bad.push(`tip not right-aligned: ${rightSlack.toFixed(1)}px`);
                  if(spanSlack < -1 || spanSlack > 18) bad.push(`span does not reach right side: ${spanSlack.toFixed(1)}px`);
                  if(ss.display!=='grid') bad.push(`span display ${ss.display}`);
                  if(t.width < 43 || t.height < 43) bad.push(`tip target too small ${t.width.toFixed(1)}x${t.height.toFixed(1)}`);
                }
                const legal=document.querySelector('.footer-legal-list');
                const gisa=legal?.querySelector('li strong');
                const bottom=document.querySelector('.footer-bottom');
                const lg=gisa?.getBoundingClientRect(), bg=bottom?.getBoundingClientRect();
                return {cardCount:cards.length,tipCount:tips.length,visibleTipCount,bad,gisaHeight:lg?.height??0,bottomHeight:bg?.height??0,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
              });
              if(r.cardCount===0||r.tipCount===0||r.visibleTipCount===0) failures.push(`${path} ${vp.width}: quote controls missing`);
              for(const x of r.bad) failures.push(`${path} ${vp.width}: ${x}`);
              if(vp.width>=1440 && r.gisaHeight>28) failures.push(`${path} ${vp.width}: GISA wraps (${r.gisaHeight.toFixed(1)}px)`);
              if(vp.width>=1440 && r.bottomHeight>64) failures.push(`${path} ${vp.width}: footer meta too tall (${r.bottomHeight.toFixed(1)}px)`);
              if(r.overflow>1) failures.push(`${path} ${vp.width}: horizontal overflow ${r.overflow}px`);
            }
            await page.close();
          }
          await browser.close();
          if(failures.length){ console.error(failures.join('\n')); process.exit(1); }
          console.log('UI polish browser audit passed: hero, contrast, footer and quote info alignment across 3 locales × 4 viewports.');
          NODE
          kill $PID || true
          rm -rf _site
          trap - EXIT
      - name: Full browser regression
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/exhaustive-visual artifacts/lighthouse-desktop && mkdir _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          cp assets/css/site.css _site/assets/css/site.css
          node tools/perf-static-server.mjs _site 4173 >/tmp/ui-polish-full.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; rm -rf _site' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          npm run test:e2e
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-browser-layout.mjs
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-first-principles-layout.mjs
          kill $PID || true
          rm -rf _site
          trap - EXIT
      - name: Commit only after all audits pass
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/exhaustive-visual artifacts/lighthouse-desktop
          rm -f .github/ui-polish-20260816.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css .github/ui-polish-20260816.py
          git diff --cached --check
          git commit -m 'Fix homepage hero, contrast, footer metadata and quote info alignment'
          git push origin HEAD:fix/ui-polish-hero-footer-info-20260816
