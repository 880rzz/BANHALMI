name: Hungarian footer and archive metadata polish

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-footer-meta-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish shared Hungarian footer and archive metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = sorted(Path('hu').glob('**/index.html'))
          if len(pages) != 19:
              raise SystemExit(f'Expected 19 Hungarian pages, found {len(pages)}')

          old_portrait = '>üzleti portré &amp; vezetői portré<'
          new_portrait = '>Üzleti és vezetői portré<'
          old_brand = '>Brand &amp; vizuális pozicionálás<'
          new_brand = '>Brandfotózás és vizuális pozicionálás<'

          portrait_count = 0
          brand_count = 0
          for page in pages:
              text = page.read_text(encoding='utf-8')
              portrait_count += text.count(old_portrait)
              brand_count += text.count(old_brand)
              text = text.replace(old_portrait, new_portrait)
              text = text.replace(old_brand, new_brand)
              page.write_text(text, encoding='utf-8')

          if portrait_count != 19:
              raise SystemExit(f'Expected 19 shared portrait footer labels, found {portrait_count}')
          if brand_count != 19:
              raise SystemExit(f'Expected 19 shared brand footer labels, found {brand_count}')

          archive = Path('hu/archivum/index.html')
          text = archive.read_text(encoding='utf-8')
          best_of_count = text.count('Best of')
          if best_of_count != 4:
              raise SystemExit(f'Expected four archive metadata Best of phrases, found {best_of_count}')
          text = text.replace('Könyvek, kiállítások, média és Best of', 'Könyvek, kiállítások, média és válogatás')
          archive.write_text(text, encoding='utf-8')

          audit_path = Path('tools/audit-hungarian-copy.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          anchor = "for (const file of pages) {\n  const text = visibleBody(fs.readFileSync(file, 'utf8'));\n  for (const pattern of banned) if (pattern.test(text)) failures.push(`${path.relative(root, file)}: non-Hungarian or obsolete visible phrase remains: ${pattern}`);\n}\n"
          addition = """for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('>Üzleti és vezetői portré<')) failures.push(`${path.relative(root, file)}: approved Hungarian portrait footer label missing`);
            if (!html.includes('>Brandfotózás és vizuális pozicionálás<')) failures.push(`${path.relative(root, file)}: approved Hungarian brand footer label missing`);
            if (html.includes('>üzleti portré &amp; vezetői portré<')) failures.push(`${path.relative(root, file)}: obsolete portrait footer label remains`);
            if (html.includes('>Brand &amp; vizuális pozicionálás<')) failures.push(`${path.relative(root, file)}: obsolete brand footer label remains`);
          }
          const archiveHtml = read('hu/archivum/index.html');
          if (archiveHtml.includes('Best of')) failures.push('archive metadata: obsolete English Best of phrase remains');
          if (!archiveHtml.includes('Könyvek, kiállítások, média és válogatás')) failures.push('archive metadata: approved Hungarian title phrase missing');
          """
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          if audit.count(anchor) != 1:
              raise SystemExit('Hungarian audit footer insertion anchor missing')
          audit = audit.replace(anchor, anchor + '\n' + addition)
          audit_path.write_text(audit, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/one-time-hu-footer-meta-polish.yml
      - name: Install dependencies
        run: npm install
      - name: Run Hungarian copy guard
        run: npm run audit:hu-copy
      - name: Run full deterministic audit
        run: npm run audit
      - name: Commit footer and metadata polish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Hungarian footer and archive metadata"
          git push
