name: Apply artist package copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-artist-package-copy.yml'
      - 'tools/apply-artist-package-copy-20260901.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply package copy migration
        run: node tools/apply-artist-package-copy-20260901.mjs
      - name: Verify changed pages
        run: |
          grep -q '1-Hour Artist Session' requestaquote/index.html
          grep -q '2 órás művészi portfólió' hu/ajanlatkeres/index.html
          grep -q '3-stündiges komplettes Künstler:innen-Portfolio' de-at/anfrage/index.html
          grep -q 'value="actor"' requestaquote/index.html
          grep -q 'value="dance"' hu/ajanlatkeres/index.html
          grep -q 'value="model-editorial"' de-at/anfrage/index.html
      - name: Run source audits
        run: npm test
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requestaquote/index.html hu/ajanlatkeres/index.html de-at/anfrage/index.html
          git commit -m 'Clarify artist and performer package choices'
          git push
