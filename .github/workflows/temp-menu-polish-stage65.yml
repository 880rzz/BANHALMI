name: Temporary Stage 65 menu polish
on:
  push:
    branches: [fix/menu-polish-stage65]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-menu-polish-stage65.mjs
      - run: rm .github/workflows/temp-menu-polish-stage65.yml tools/apply-menu-polish-stage65.mjs
      - run: |
          git config user.name "BANHALMI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine fullscreen menu hierarchy"
      - run: npm run audit
      - run: git push
