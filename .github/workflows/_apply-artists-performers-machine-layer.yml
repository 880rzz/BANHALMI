name: Temporary Apply Artists Performers Machine Layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-artists-performers-machine-layer.yml'
      - 'tools/apply-artists-performers-machine-layer-20260831.mjs'
      - 'tools/audit-machine-core.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply canonical Artists & Performers migration
        run: node tools/apply-artists-performers-machine-layer-20260831.mjs
      - name: Audit canonical migration contracts
        run: node tools/audit-workflow-safety.mjs && node tools/audit-machine-core.mjs && node tools/audit-artists-performers-layer.mjs && node tools/audit-clean-architecture.mjs
      - name: Legacy audit group A
        run: node tools/audit-css-cache-token.mjs && node tools/audit-claude-hardening-contract.mjs && node tools/audit-favicon-contract.mjs && node tools/audit-legacy-redirect-preservation.mjs && node tools/audit-embedded-schema-location-parity.mjs && node tools/audit-jsonld-canonical-references.mjs && node tools/audit-entity-role-separation.mjs && node tools/audit-foreign-entity-ownership.mjs && node tools/audit-worldwide-availability.mjs
      - name: Legacy audit group B
        run: node tools/audit-fine-art-art-bridge.mjs && node tools/audit-authority-memberships-peter-magyar.mjs && node tools/audit-apple-responsive-contract.mjs && node tools/audit-homepage-meta-parity.mjs && node tools/audit-content-structure-first-principles.mjs && node tools/audit-internal-fragment-targets.mjs && node tools/audit-about-ownership.mjs && node tools/audit-meta-description-quality.mjs
      - name: Audit Google Search contract
        run: node tools/audit-google-search-contract.mjs
      - name: Audit form autocomplete
        run: node tools/audit-form-autocomplete.mjs
      - name: Audit image priority
        run: node tools/audit-image-priority.mjs
      - name: Audit navigation CTA
        run: node tools/audit-navigation-cta-contract.mjs
      - name: Audit page head
        run: node tools/audit-page-head-contract.mjs
      - name: Audit SEO network
        run: node tools/audit-seo-network.mjs
      - name: Audit pricing HUF
        run: node tools/audit-pricing-huf.mjs
      - name: Audit trust center
        run: node tools/audit-trust-center.mjs
      - name: Legacy audit group D
        run: node tools/audit-human-voice-en-de.mjs && node tools/audit-human-voice.mjs && node tools/audit-human-seo-geo-llm.mjs && node tools/audit-schema-geo-llm-stage16.mjs && node tools/audit-static-integrity.mjs && node tests/customer-intent-model.test.mjs && node tests/audit-anchor-integrity.mjs && node tests/quote-pdf-content.test.mjs && node tools/audit-layout-authority.mjs
      - name: Run complete source quality gate
        run: npm test
      - name: Commit migration output
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/machine-core.json customer-intent-model.json customer-needs.json pricing.json pricing-huf.json assets/js/pricing-data.js requestaquote/index.html hu/ajanlatkeres/index.html de-at/anfrage/index.html glamour/index.html hu/muveszi-fotografia/index.html de-at/fine-art/index.html tools/apply-artists-performers-machine-layer-20260831.mjs tools/audit-machine-core.mjs tools/audit-artists-performers-layer.mjs tools/audit-clean-architecture.mjs package.json llms-full.txt
          git commit -m "Align Artists and Performers SEO GEO Schema LLM layer"
          git push
