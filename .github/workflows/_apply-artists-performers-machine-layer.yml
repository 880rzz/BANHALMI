name: Temporary Apply Artists Performers Machine Layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-artists-performers-machine-layer.yml'
      - 'tools/apply-artists-performers-machine-layer-20260831.mjs'
      - 'tools/patch-artists-migration-quality-20260831.mjs'
      - 'tools/audit-machine-core.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Normalize the one-time migration itself
        run: node tools/patch-artists-migration-quality-20260831.mjs
      - name: Apply canonical Artists & Performers migration
        run: node tools/apply-artists-performers-machine-layer-20260831.mjs
      - name: Audit workflow safety
        run: node tools/audit-workflow-safety.mjs
      - name: Audit canonical machine core
        run: node tools/audit-machine-core.mjs
      - name: Audit Artists & Performers layer
        run: node tools/audit-artists-performers-layer.mjs
      - name: Audit clean architecture
        run: node tools/audit-clean-architecture.mjs
      - name: Run complete source quality gate
        run: npm test
      - name: Commit migration output
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/machine-core.json customer-intent-model.json customer-needs.json pricing.json glamour/index.html hu/muveszi-fotografia/index.html de-at/fine-art/index.html tools/apply-artists-performers-machine-layer-20260831.mjs tools/audit-machine-core.mjs tools/audit-artists-performers-layer.mjs tools/audit-clean-architecture.mjs package.json llms-full.txt
          git commit -m "Align Artists and Performers SEO GEO Schema LLM layer"
          git push
