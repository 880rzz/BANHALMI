name: One-shot quote layout regression 20260816

on:
  push:
    branches: [fix/quote-layout-regression-20260816]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-layout-regression-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Apply fix and source audits
        run: |
          set -euo pipefail
          if [ -f .github/quote-layout-regression-20260816.py ]; then
            python3 .github/quote-layout-regression-20260816.py
          fi
          npm test
      - name: Browser geometry audit
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          cp assets/css/site.css _site/assets/css/site.css
          node tools/perf-static-server.mjs _site 4173 >/tmp/quote-layout.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; rm -rf _site' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const routes=['/requestaquote/','/hu/ajanlatkeres/','/de-at/anfrage/'];
          const vps=[{width:390,height:844},{width:768,height:1024},{width:1440,height:1100},{width:1536,height:1024}];
          for(const vp of vps){
            const page=await browser.newPage({viewport:vp});
            for(const route of routes){
              await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle'});
              const r=await page.evaluate(()=>{
                const grid=document.querySelector('.smart-quote-layout .category-grid');
                const cards=[...document.querySelectorAll('.smart-quote-layout .category-grid .category-card')].filter(e=>e.getBoundingClientRect().width>0);
                const rows=[...document.querySelectorAll('.smart-quote-layout .option-row')].filter(e=>e.getBoundingClientRect().width>0);
                const steps=[...document.querySelectorAll('.smart-quote-layout .quote-step')].filter(e=>e.getBoundingClientRect().width>0);
                const footer=document.querySelector('.site-footer .footer-bottom');
                const first=footer?.querySelector(':scope > span:first-child');
                const last=footer?.querySelector(':scope > span:last-child');
                const bad=[];
                const tops=[...new Set(cards.map(c=>Math.round(c.getBoundingClientRect().top)))].sort((a,b)=>a-b);
                for(let i=1;i<tops.length;i++) if(tops[i]-tops[i-1]>170) bad.push(`category row pitch ${tops[i]-tops[i-1]}px`);
                for(let i=1;i<steps.length;i++){
                  const prev=steps[i-1].getBoundingClientRect(), cur=steps[i].getBoundingClientRect();
                  const gap=cur.top-prev.bottom;
                  if(gap>20) bad.push(`quote-step gap ${gap.toFixed(1)}px`);
                }
                for(const row of rows){
                  const input=row.querySelector(':scope > input[type="radio"]');
                  const span=row.querySelector(':scope > span');
                  const tip=span?.querySelector(':scope > .info-tip');
                  if(!input||!span||!tip) continue;
                  const rr=row.getBoundingClientRect(), ir=input.getBoundingClientRect(), sr=span.getBoundingClientRect(), tr=tip.getBoundingClientRect();
                  if(Math.abs((ir.top+ir.height/2)-(rr.top+rr.height/2))>4) bad.push('radio not vertically centered');
                  if(Math.abs((tr.top+tr.height/2)-(rr.top+rr.height/2))>4) bad.push('info not vertically centered');
                  const rightSlack=rr.right-tr.right;
                  if(rightSlack<8||rightSlack>22) bad.push(`info right slack ${rightSlack.toFixed(1)}px`);
                  const leftSlack=ir.left-rr.left;
                  if(leftSlack<8||leftSlack>22) bad.push(`radio left slack ${leftSlack.toFixed(1)}px`);
                  if(sr.right<rr.right-24) bad.push('content span does not reach right side');
                  if(ir.width<23||ir.height<23||tr.width<43||tr.height<43) bad.push('target too small');
                }
                if(footer&&first&&last&&innerWidth>=1440){
                  const fr=footer.getBoundingClientRect(), ar=first.getBoundingClientRect(), br=last.getBoundingClientRect();
                  if(Math.abs(ar.left-fr.left)>2) bad.push(`footer copyright left offset ${(ar.left-fr.left).toFixed(1)}px`);
                  if(Math.abs(fr.right-br.right)>2) bad.push(`footer utility right offset ${(fr.right-br.right).toFixed(1)}px`);
                  if(Math.abs((ar.top+ar.height/2)-(br.top+br.height/2))>5) bad.push('footer metadata not on shared row');
                  if(br.height>48) bad.push(`footer utilities wrap ${br.height.toFixed(1)}px`);
                }
                return {bad,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cardCount:cards.length,rowCount:rows.length};
              });
              if(r.cardCount<5) failures.push(`${route} ${vp.width}: category cards missing`);
              if(r.rowCount<1) failures.push(`${route} ${vp.width}: option rows missing`);
              if(r.overflow>1) failures.push(`${route} ${vp.width}: overflow ${r.overflow}px`);
              for(const x of r.bad) failures.push(`${route} ${vp.width}: ${x}`);
            }
            await page.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('Quote spacing, choice alignment and footer metadata geometry passed across 3 locales × 4 viewports.');
          NODE
          kill $PID || true
          rm -rf _site
          trap - EXIT
      - name: Full regression
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/exhaustive-visual artifacts/lighthouse-desktop && mkdir _site
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          cp assets/css/site.css _site/assets/css/site.css
          node tools/perf-static-server.mjs _site 4173 >/tmp/quote-layout-full.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; rm -rf _site' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          npm run test:e2e
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-browser-layout.mjs
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-first-principles-layout.mjs
          kill $PID || true
          rm -rf _site
          trap - EXIT
      - name: Commit canonical fix only after all audits pass
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/exhaustive-visual artifacts/lighthouse-desktop
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/quote-layout-regression-20260816.py ]; then rm .github/quote-layout-regression-20260816.py; fi
          git add assets/css/site.css .github/quote-layout-regression-20260816.py || true
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Fix quote spacing, choice alignment and footer metadata row'
            git push origin HEAD:fix/quote-layout-regression-20260816
          fi
