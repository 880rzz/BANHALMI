name: Footer ecosystem helper
on: push
permissions:
  contents: write
jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - name: Append final footer CSS
        shell: bash
        run: |
          if ! grep -q 'STAGE-FOOTER-ECOSYSTEM-POLISH-20260813' assets/css/style.css; then
            printf '\n' >> assets/css/style.css
            echo '' | base64 -d >> assets/css/style.css
          fi
      - name: Commit CSS and remove helper
        shell: bash
        run: |
          git rm .github/workflows/footer-ecosystem-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'Polish footer ecosystem navigation'
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
