name: Footer ecosystem one-shot
on:
  push:
    branches:
      - agent/footer-ecosystem-layout-20260813
permissions:
  contents: write
jobs:
  align-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/footer-ecosystem-layout-20260813
      - name: Append shared footer authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/style.css')
          marker = '/* STAGE-FOOTER-ECOSYSTEM-POLISH-20260813 */'
          css = r'''

/* STAGE-FOOTER-ECOSYSTEM-POLISH-20260813 */
/* Keep the three official BANHALMI destinations compact, balanced and visible
   as one intentional footer navigation row at every viewport. */
.site-footer .banhalmi-ecosystem{
  width:min(100%,760px);
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:stretch;
  justify-content:center;
  gap:0;
  margin:1.35rem auto 0;
  padding-top:1rem;
  border-top:1px solid rgba(255,255,255,.16);
  text-align:center;
}
.site-footer .banhalmi-ecosystem a{
  min-width:0;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:.65rem .8rem;
  border-right:1px solid rgba(255,255,255,.12);
  color:#AEB4C2;
  opacity:.9;
  font-size:.86rem;
  line-height:1.3;
  text-align:center;
  text-wrap:balance;
}
.site-footer .banhalmi-ecosystem a:last-child{border-right:0}
.site-footer .banhalmi-ecosystem a[aria-current="page"]{color:#fff;opacity:1;font-weight:600}
.site-footer .banhalmi-ecosystem a:hover,
.site-footer .banhalmi-ecosystem a:focus-visible{color:#fff;opacity:1}
@media(max-width:640px){
  .site-footer .banhalmi-ecosystem{
    width:100%;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:stretch;
    gap:0;
    margin-top:1.2rem;
    padding-top:.8rem;
  }
  .site-footer .banhalmi-ecosystem a{
    min-height:56px;
    padding:.55rem .38rem;
    font-size:clamp(.76rem,3.25vw,.84rem);
    line-height:1.25;
    overflow-wrap:anywhere;
  }
}
'''
          text = p.read_text()
          if marker not in text:
              p.write_text(text.rstrip() + css + '\n')
          PY
      - name: Remove one-shot workflow and commit final CSS-only change
        shell: bash
        run: |
          git rm .github/workflows/footer-ecosystem-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/style.css
          git commit -m "Polish footer ecosystem navigation"
          git push origin HEAD:agent/footer-ecosystem-layout-20260813
