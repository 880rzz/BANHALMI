name: Finalize Hungarian terminology contracts

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-copy-refinement-v6.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the verified Hungarian refinement steps
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-time-hu-copy-refinement-v5.yml').read_text(encoding='utf-8')
          steps = [
              ('Apply Hungarian copy refinement', 'Normalize remaining visible copy and regression expectation'),
              ('Normalize remaining visible copy and regression expectation', 'Install dependencies'),
          ]
          blocks = ['set -e']
          for name, next_name in steps:
              marker = f'      - name: {name}\n        run: |\n'
              start = source.index(marker) + len(marker)
              end = source.index(f'      - name: {next_name}', start)
              block = source[start:end]
              blocks.extend(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/apply-hu-copy.sh').write_text('\n'.join(blocks) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-hu-copy.sh
      - name: Align permanent strategic-partnership terminology test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit-strategic-partnership-stage4.mjs')
          text = path.read_text(encoding='utf-8')
          old = "'Vizuális brief'"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected three Hungarian Vizuális brief assertions, found {count}')
          path.write_text(text.replace(old, "'Vizuális projektleírás'"), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install
      - name: Temporarily hide one-time workflows from safety audit
        run: |
          for file in .github/workflows/one-time-*.yml; do
            [ -e "$file" ] || continue
            rm "$file"
          done
      - name: Run Hungarian copy guard
        run: npm run audit:hu-copy
      - name: Run full deterministic audit
        run: npm run audit
      - name: Restore workflow files and commit content changes
        run: |
          git checkout HEAD -- .github/workflows
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Hungarian copy and protect menu language"
          git push
