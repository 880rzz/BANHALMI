name: One-shot Stage 68 HU wording
on:
  push:
    branches:
      - agent/first-principles-apple-20260813-v3
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Use Hungarian wording in Stage 68'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-principles-apple-20260813-v3
      - name: Fix Hungarian label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hu/index.html')
          s=p.read_text()
          old='<em>Executive portré →</em>'
          new='<em>Vezetői portré →</em>'
          if old not in s:
              raise SystemExit('Expected Stage 68 Hungarian label not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify Hungarian copy and Stage 68
        run: |
          node tools/audit-hungarian-copy.mjs
          node tools/audit-first-principles-apple-stage68.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu/index.html
          git commit -m "Use Hungarian wording in Stage 68"
          git push origin HEAD:agent/first-principles-apple-20260813-v3
