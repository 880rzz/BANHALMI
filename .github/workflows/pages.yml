name: BANHALMI production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
      - name: Run source contract audits
        run: |
          npm ci
          npm test
      - name: Prepare immutable Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
          # Keep committed .nojekyll so Pages does not run Jekyll and drop .well-known/.
          rm -rf _site/.git _site/.github _site/tools _site/tests _site/node_modules _site/artifacts _site/_site _site/package.json _site/package-lock.json
          # Repo-only hidden paths must never reach Pages (packager + include-hidden-files upload).
          rm -f _site/.gitignore _site/docs/.responsive-4k-audit-ready
          find _site -name .DS_Store -type f -delete
          printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt
          test -f _site/.nojekyll
          test -s _site/.well-known/agent.json
          cmp -s .nojekyll _site/.nojekyll
          cmp -s .well-known/agent.json _site/.well-known/agent.json
          test -s _site/sitemap.xml
          test -s _site/references/portfolio.pdf
          python3 -c "from pathlib import Path; p=Path('_site/references/portfolio.pdf'); assert p.read_bytes()[:5] == b'%PDF-', 'Invalid reference PDF bytes'"
          test "$(cat _site/deployment-sha.txt)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          site = Path('_site')
          required = ['.nojekyll', '.well-known/agent.json']
          missing = [name for name in required if not (site / name).is_file()]
          if missing:
              raise SystemExit('Pages artifact missing required discovery files: ' + ', '.join(missing))
          print('Artifact discovery files present:', ', '.join(required))
          for path in sorted(site.rglob('*')):
              if path.is_file():
                  print(path.relative_to(site).as_posix())
          PY
          node tools/assert-production-integrity.mjs _site
          python3 tools/package-pages-artifact.py --site _site --output "$RUNNER_TEMP/artifact.tar" --expected-sha "$GITHUB_SHA"
      - name: Block withdrawn private-derived content from Pages artifact
        run: |
          test ! -e _site/customer-intent-evidence.json
          test ! -e _site/docs/BANHALMI_VOICE_AND_CONTENT_AUDIT_2026-10-25.md
          test ! -e _site/docs/BANHALMI-VOICE-EN-HU-DE.md
          echo "Withdrawn correspondence-derived files absent from deployable artifact"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/banhalmi-pages.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/banhalmi-pages.log
          exit 1
      - name: Run exhaustive browser QA
        run: node tools/audit-browser-layout.mjs
      - name: Verify three-language mock quote delivery fail-closed behavior
        run: npx playwright test tests/quote-delivery-fail-closed.spec.mjs --workers=2
      - name: Run mobile Lighthouse strict 100 gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.mobile.cjs
      - name: Run desktop Lighthouse strict 100 gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.desktop.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # upload-pages-artifact@v4 drops dotfiles (including .nojekyll / .well-known)
      # even with include-hidden-files: true. Ship the packager-verified tar instead.
      - name: Prove deployable tar retains machine discovery files
        run: |
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.nojekyll'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/agent.json'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './references/portfolio.pdf'
          tar -xOf "$RUNNER_TEMP/artifact.tar" './.well-known/agent.json' > /tmp/packed-agent.json
          cmp -s .well-known/agent.json /tmp/packed-agent.json
          echo "Verified tar retains .nojekyll and exact agent.json bytes"
      - name: Upload the exact audited Pages artifact
        uses: actions/upload-artifact@v4
        with:
          # deploy-pages selects a single artifact by name. Include the workflow attempt
          # so retries cannot collide with a retained artifact from the same run.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exact commit is live on custom domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            live="$(curl --fail --silent --show-error https://www.banhalmiphotography.com/deployment-sha.txt | tr -d '\r\n')"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 20
          done
          echo "Expected $GITHUB_SHA, received $live"
          exit 1
      - name: Verify canonical reference PDF exact-live
        run: |
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS -L -o /tmp/live-portfolio.pdf -w '%{http_code}' -H 'Cache-Control: no-cache' https://www.banhalmiphotography.com/references/portfolio.pdf || true)"
            if [ "$status" = "200" ] && cmp -s references/portfolio.pdf /tmp/live-portfolio.pdf; then
              echo "Canonical reference PDF is live and matches source bytes"
              exit 0
            fi
            echo "reference-pdf attempt=$attempt status=$status"
            sleep 20
          done
          echo "Canonical reference PDF exact-live gate failed"
          exit 1
      - name: Verify machine discovery bytes on the custom domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            agent_code="$(curl -sS -o live-agent.json -w '%{http_code}' -L https://www.banhalmiphotography.com/.well-known/agent.json || true)"
            nojekyll_code="$(curl -sS -o /dev/null -w '%{http_code}' -L https://www.banhalmiphotography.com/.nojekyll || true)"
            if [ "$agent_code" = "200" ] && [ "$nojekyll_code" = "200" ] && cmp -s .well-known/agent.json live-agent.json; then
              curl -sS -I -L https://www.banhalmiphotography.com/.well-known/agent.json | tr -d '\r'
              curl -sS -I -L https://www.banhalmiphotography.com/.nojekyll | tr -d '\r'
              echo "Live agent.json matches committed source bytes for $GITHUB_SHA"
              exit 0
            fi
            echo "attempt=$attempt agent_http=$agent_code nojekyll_http=$nojekyll_code"
            sleep 20
          done
          echo "Machine discovery exact-live gate failed for $GITHUB_SHA"
          exit 1
      - name: Verify SEO and LLM entrypoints exact-live
        run: |
          set -euo pipefail
          for file in robots.txt sitemap.xml llms.txt ai.txt references/portfolio.jsonld api/v1/services.json; do
            live="/tmp/banhalmi-live-$(basename "$file")"
            matched=0
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -sS -L -o "$live" -w '%{http_code}' -H 'Cache-Control: no-cache' "https://www.banhalmiphotography.com/$file" || true)"
              if [ "$status" = "200" ] && cmp -s "$file" "$live"; then
                matched=1
                break
              fi
              echo "SEO/LLM exact-live mismatch: file=$file attempt=$attempt http=$status"
              sleep 20
            done
            if [ "$matched" != "1" ]; then
              echo "::error::SEO/LLM source/live byte mismatch at /$file"
              exit 1
            fi
            echo "Verified exact-live SEO/LLM source parity: /$file"
          done
      - name: Verify withdrawn private-derived URLs are unavailable on production
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.request
          import time

          base = "https://www.banhalmiphotography.com"
          paths = (
              "/customer-intent-evidence.json",
              "/docs/BANHALMI_VOICE_AND_CONTENT_AUDIT_2026-10-25.md",
              "/docs/BANHALMI-VOICE-EN-HU-DE.md",
          )
          for path in paths:
              last = "unverified"
              for attempt in range(6):
                  request = urllib.request.Request(base + path, headers={"Cache-Control": "no-cache", "User-Agent": "BANHALMI-privacy-release-gate"})
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status = response.status
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                  except Exception:
                      status = None
                  if status in (404, 410):
                      last = "withdrawn"
                      break
                  last = "unexpected-status" if status is not None else "request-failed"
                  if attempt < 5:
                      time.sleep(20)
              print(f"Privacy URL check: {path} => {last}")
              if last != "withdrawn":
                  raise SystemExit("Private-derived content removal is not proven on the custom domain")
          PY
      - name: Exact-live production gate
        run: echo "Exact-live gate passed for $GITHUB_SHA"

  exact-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-live deployment marker
        run: test "$(curl --fail --silent https://www.banhalmiphotography.com/deployment-sha.txt)" = "$GITHUB_SHA"

  live-production:
    needs: exact-live
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production live gate passed"

# Anti-rollback protected semantics: llm-canonical-overlay.json, market-geography.json, people-roles.json, llm-commercial-contract.json, approximately 50 professional photographer partners/collaborators, independent professional partner/collaborator, 1190 Döbling, XII. kerület / District 12 / Hegyvidék, protectedCanonicalOverlay.

# Protected evidence release guard: _site/external-photography-evidence.json; _site/press-institutional-evidence.json; _site/media-usage-evidence.json; _site/machine-manifest.json; Press / Editorial Photography; Institutional / Diplomatic Event Photography; International Editorial Image Circulation; Wikimedia Commons Licensed Distribution; Bécsi Napló; pressInstitutionalEvidence; mediaUsageEvidence; protectedPressInstitutionalEvidence; protectedMediaUsageEvidence; https://www.banhalmiphotography.com/external-photography-evidence.json; https://www.banhalmiphotography.com/press-institutional-evidence.json; https://www.banhalmiphotography.com/media-usage-evidence.json; https://www.banhalmiphotography.com/machine-manifest.json
