name: Clean architecture verification and production deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: banhalmi-clean-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify single-authority architecture
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4
      - name: Set up Node.js for production optimization
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare immutable static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=tools \
            --exclude=node_modules \
            --exclude=package.json \
            --exclude=_site \
            -cf - . | tar -xf - -C _site
          printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt
          test -f _site/index.html
          test -f _site/hu/index.html
          test -f _site/de-at/index.html
          test -f _site/assets/css/site.css
          node tools/optimize-production-artifact.mjs _site
          npx --yes esbuild@0.25.9 _site/assets/css/site.css --minify --outfile=/tmp/site.min.css
          mv /tmp/site.min.css _site/assets/css/site.css
          for js in _site/assets/js/main.js _site/assets/js/mega-menu.js _site/assets/js/analytics.js; do
            if [ -f "$js" ]; then
              npx --yes esbuild@0.25.9 "$js" --minify --outfile=/tmp/runtime.min.js
              mv /tmp/runtime.min.js "$js"
            fi
          done
          test -s _site/assets/css/site.css
          test -f _site/.well-known/agent.json
          test -f _site/api/v1/identity.json
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/llms.txt
          test -f _site/ai.txt
          test "$(find _site/assets/css -type f -name '*.css' | wc -l | tr -d ' ')" = "1"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  exact-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact BANHALMI commit is live on custom domain
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/deployment-sha.txt' || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Exact live SHA verified: $actual"
              exit 0
            fi
            sleep 10
          done
          echo "Expected live SHA $expected but received ${actual:-nothing}." >&2
          exit 1
