name: Deploy production site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install audit dependencies
        run: npm ci

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Run complete static repository audit
        run: npm run audit

      - name: Run browser regression suite
        run: npm run test:browser

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git archive --format=tar HEAD | tar -xf - -C _site

          rm -rf \
            _site/.github \
            _site/node_modules \
            _site/tests \
            _site/docs \
            _site/playwright-report \
            _site/test-results
          rm -f \
            _site/.gitignore \
            _site/package.json \
            _site/package-lock.json \
            _site/playwright.config.mjs \
            _site/playwright.production.config.mjs \
            _site/README.md \
            _site/DELETE-LOW-RES-FINE-ART-IMAGES.txt \
            _site/TORLENDO-FAJLOK.txt \
            _site/.vercel-redeploy-*

          printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt

          test -f _site/.nojekyll
          test -f _site/CNAME
          test -f _site/index.html
          test -f _site/hu/index.html
          test -f _site/de-at/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/assets/css/style.css
          test -f _site/assets/js/quote-calculator.js
          test -f _site/deployment-sha.txt
          test ! -e _site/.github
          test ! -e _site/tests
          test ! -e _site/docs

          if find _site -type l -print -quit | grep -q .; then
            echo 'Symbolic links are forbidden in the Pages artifact.' >&2
            exit 1
          fi

          echo "Prepared $(find _site -type f | wc -l | tr -d ' ') verified production files."

      - name: Minify production CSS conservatively
        run: node tools/minify-pages-css.mjs _site/assets/css

      - name: Remove source-only tooling from Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/tools
          test ! -e _site/tools

      - name: Run browser regressions against production artifact
        run: npx playwright test --config=playwright.production.config.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 50
    steps:
      - name: Check out deployment client
        uses: actions/checkout@v4

      - name: Deploy through Pages API without automatic cancellation
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_POLL_INTERVAL_MS: '10000'
          PAGES_POLL_TIMEOUT_MS: '2700000'
        run: node tools/deploy-pages-api.mjs

      - name: Verify exact commit is live on the custom domain
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/deployment-sha.txt' || true)"
            if [ "$actual" = "$expected" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Expected live SHA $expected but received ${actual:-nothing}." >&2
              exit 1
            fi
            sleep 10
          done

          en_html="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/')"
          hu_html="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/hu/')"
          de_html="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/de-at/')"
          a11y_css="$(curl -fsSL --max-time 20 'https://www.norbertbanhalmi.com/assets/css/accessibility-stage14.css')"

          grep -q 'BANHALMI' <<< "$en_html"
          grep -q 'BANHALMI' <<< "$hu_html"
          grep -q 'BANHALMI' <<< "$de_html"
          test -n "$a11y_css"
          grep -q '.visually-hidden' <<< "$a11y_css"
          grep -q 'prefers-reduced-motion' <<< "$a11y_css"
