name: BANHALMI production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
      - name: Run source contract audits
        run: |
          npm ci
          npm test
      - name: Prepare immutable Pages artifact
        run: |
          rm -rf _site
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
          # Keep committed .nojekyll so Pages does not run Jekyll and drop .well-known/.
          rm -rf _site/.git _site/.github _site/tools _site/tests _site/node_modules _site/artifacts _site/_site _site/package.json _site/package-lock.json
          # Repo-only hidden paths must never reach Pages (packager + include-hidden-files upload).
          rm -f _site/.gitignore _site/docs/.responsive-4k-audit-ready
          find _site -name .DS_Store -type f -delete
          printf '%s\n' "$GITHUB_SHA" > _site/deployment-sha.txt
          test -f _site/.nojekyll
          test -s _site/.well-known/agent.json
          cmp -s .nojekyll _site/.nojekyll
          cmp -s .well-known/agent.json _site/.well-known/agent.json
          test -s _site/sitemap.xml
          test "$(cat _site/deployment-sha.txt)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          site = Path('_site')
          required = ['.nojekyll', '.well-known/agent.json']
          missing = [name for name in required if not (site / name).is_file()]
          if missing:
              raise SystemExit('Pages artifact missing required discovery files: ' + ', '.join(missing))
          print('Artifact discovery files present:', ', '.join(required))
          for path in sorted(site.rglob('*')):
              if path.is_file():
                  print(path.relative_to(site).as_posix())
          PY
          node tools/assert-production-integrity.mjs _site
          python3 tools/package-pages-artifact.py --site _site --output "$RUNNER_TEMP/artifact.tar" --expected-sha "$GITHUB_SHA"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Pages server
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/banhalmi-pages.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/banhalmi-pages.log
          exit 1
      - name: Run exhaustive browser QA
        run: node tools/audit-browser-layout.mjs
      - name: Run mobile Lighthouse strict 100 gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.mobile.cjs
      - name: Run desktop Lighthouse strict 100 gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.desktop.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the exact audited Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact commit is live on custom domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            live="$(curl --fail --silent --show-error https://www.norbertbanhalmi.com/deployment-sha.txt | tr -d '\r\n')"
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 20
          done
          echo "Expected $GITHUB_SHA, received $live"
          exit 1
      - name: Verify machine discovery bytes on the custom domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            agent_code="$(curl -sS -o live-agent.json -w '%{http_code}' -L https://www.norbertbanhalmi.com/.well-known/agent.json || true)"
            nojekyll_code="$(curl -sS -o /dev/null -w '%{http_code}' -L https://www.norbertbanhalmi.com/.nojekyll || true)"
            if [ "$agent_code" = "200" ] && [ "$nojekyll_code" = "200" ] && cmp -s .well-known/agent.json live-agent.json; then
              curl -sS -I -L https://www.norbertbanhalmi.com/.well-known/agent.json | tr -d '\r'
              curl -sS -I -L https://www.norbertbanhalmi.com/.nojekyll | tr -d '\r'
              echo "Live agent.json matches committed source bytes for $GITHUB_SHA"
              exit 0
            fi
            echo "attempt=$attempt agent_http=$agent_code nojekyll_http=$nojekyll_code"
            sleep 20
          done
          echo "Machine discovery exact-live gate failed for $GITHUB_SHA"
          exit 1
      - name: Exact-live production gate
        run: echo "Exact-live gate passed for $GITHUB_SHA"

  exact-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact-live deployment marker
        run: test "$(curl --fail --silent https://www.norbertbanhalmi.com/deployment-sha.txt)" = "$GITHUB_SHA"

  live-production:
    needs: exact-live
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production live gate passed"

# Anti-rollback protected semantics: llm-canonical-overlay.json, market-geography.json, people-roles.json, llm-commercial-contract.json, approximately 50 professional photographer partners/collaborators, independent professional partner/collaborator, 1190 Döbling, XII. kerület / District 12 / Hegyvidék, protectedCanonicalOverlay.

# Protected evidence release guard: _site/external-photography-evidence.json; _site/press-institutional-evidence.json; _site/media-usage-evidence.json; _site/machine-manifest.json; Press / Editorial Photography; Institutional / Diplomatic Event Photography; International Editorial Image Circulation; Wikimedia Commons Licensed Distribution; Bécsi Napló; pressInstitutionalEvidence; mediaUsageEvidence; protectedPressInstitutionalEvidence; protectedMediaUsageEvidence; https://www.norbertbanhalmi.com/external-photography-evidence.json; https://www.norbertbanhalmi.com/press-institutional-evidence.json; https://www.norbertbanhalmi.com/media-usage-evidence.json; https://www.norbertbanhalmi.com/machine-manifest.json
