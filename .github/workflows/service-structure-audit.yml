name: BANHALMI 12 service-page structural audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-service-pages.mjs
