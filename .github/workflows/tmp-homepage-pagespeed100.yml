name: Temporary homepage PageSpeed branch test
on:
  push:
    branches:
      - fix/pagespeed-100-final-en-hu-de-20260808
    paths:
      - .github/workflows/tmp-homepage-pagespeed100.yml
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/banhalmi-http.log 2>&1 &
          sleep 2
      - name: Measure EN HU DE mobile
        run: |
          for pair in 'en http://127.0.0.1:4173/' 'hu http://127.0.0.1:4173/hu/' 'de http://127.0.0.1:4173/de-at/'; do
            set -- $pair
            lang="$1"; url="$2"
            npx --yes lighthouse@latest "$url" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --form-factor=mobile --screenEmulation.mobile=true --throttling-method=simulate --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lh-$lang.json"
            LANG_CODE="$lang" node <<'NODE'
          const fs=require('fs');
          const lang=process.env.LANG_CODE;
          const r=JSON.parse(fs.readFileSync(`lh-${lang}.json`,'utf8'));
          const s=id=>Math.round((r.categories[id]?.score||0)*100);
          const v=id=>r.audits[id]?.displayValue||'';
          console.log(`RESULT ${lang.toUpperCase()} PERFORMANCE=${s('performance')} ACCESSIBILITY=${s('accessibility')} BEST_PRACTICES=${s('best-practices')} SEO=${s('seo')}`);
          console.log(`METRICS ${lang.toUpperCase()} FCP=${v('first-contentful-paint')} LCP=${v('largest-contentful-paint')} SI=${v('speed-index')} TBT=${v('total-blocking-time')} CLS=${v('cumulative-layout-shift')} MAINTHREAD=${v('mainthread-work-breakdown')}`);
          NODE
          done
