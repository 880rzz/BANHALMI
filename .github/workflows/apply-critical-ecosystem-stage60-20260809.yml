name: Apply critical ecosystem stage60 20260809
on:
  push:
    branches: [fix/critical-ecosystem-audit-20260809]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-ecosystem-audit-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic migration
        run: node scripts/apply-critical-ecosystem-stage60-20260809.mjs
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portrait/index.html hu/portre/index.html de-at/portrait/index.html ai.txt package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: strengthen audience intent and flagship evidence'
          git push
