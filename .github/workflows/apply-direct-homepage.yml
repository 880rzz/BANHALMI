name: Apply direct human voice homepage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-voice-pages-direct
          fetch-depth: 0
      - name: Decode and validate reviewed homepage block
        run: |
          base64 --decode .human-voice/main/index.b64 > /tmp/main.html
          grep -q '^<main id="main">' /tmp/main.html
          grep -q 'The photograph speaks before the meeting begins.' /tmp/main.html
          grep -q '</main>$' /tmp/main.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          target = Path('index.html')
          html = target.read_text()
          block = Path('/tmp/main.html').read_text()
          updated, count = re.subn(r'<main id="main">[\s\S]*?</main>', lambda _: block, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one main block, replaced {count}')
          target.write_text(updated)
          PY
      - name: Update immutable copy expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/audit-static-integrity.mjs')
          s = p.read_text()
          old = "'index.html': ['Visual Trust Strategy', 'We build visual trust before the meeting begins.']"
          new = "'index.html': ['Visual Trust Strategy', 'The photograph speaks before the meeting begins.']"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm install
      - name: Run complete deterministic audit
        run: npm run audit
      - name: Verify exact scope
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          index.html
          tools/audit-static-integrity.mjs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit audited homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/audit-static-integrity.mjs
          git rm -r .human-voice .github/workflows/apply-direct-homepage.yml
          git commit -m "Apply reviewed English homepage copy"
          git push
