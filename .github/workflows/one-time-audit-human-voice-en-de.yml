name: One-time English and German human voice audit

on:
  push:
    paths:
      - '.github/workflows/one-time-audit-human-voice-en-de.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run existing human voice audit
        run: node tools/audit-human-voice.mjs
      - name: Extract visible English and German copy risks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('.')
          def visible(html):
              html=re.sub(r'<(?:script|style|noscript)\b[\s\S]*?</(?:script|style|noscript)>',' ',html,flags=re.I)
              html=re.sub(r'<!--.*?-->',' ',html,flags=re.S)
              html=re.sub(r'<[^>]+>',' | ',html)
              return re.sub(r'\s+',' ',html).strip()
          patterns={
            'en':[
              r'\bmore than\b',r'\bnot just\b',r'\bnot only\b',r'\bauthentic\w*\b',r'\btimeless\b',r'\bseamless\b',r'\belevat\w*\b',r'\bunique\b',r'\bvisual trust\b',r'\bstrategic visual partnership\b',r'\bdesigned to\b',r'\bempower\w*\b',r'\btransform\w*\b'],
            'de':[
              r'\bmehr als\b',r'\bnicht nur\b',r'\bauthentisch\w*\b',r'\bzeitlos\w*\b',r'\bnahtlos\w*\b',r'\beinzigartig\w*\b',r'\bvisuelles Vertrauen\b',r'\bstrategische visuelle Partnerschaft\b',r'\bentwickelt, um\b',r'\bstärk\w*\b',r'\btransform\w*\b']
          }
          records=[]
          for p in root.rglob('*.html'):
              rel=p.as_posix()
              if rel.startswith(('hu/','.git/','node_modules/','redirects/')): continue
              lang='de' if rel.startswith('de-at/') else 'en'
              text=visible(p.read_text(encoding='utf-8'))
              hits=[]
              for pat in patterns[lang]:
                  n=len(re.findall(pat,text,flags=re.I))
                  if n: hits.append((pat,n))
              long=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if len(s.split())>34]
              if hits or long:
                  records.append({'file':rel,'language':lang,'hits':hits,'long_sentences':long[:6]})
          print('EN/DE VISIBLE COPY AUDIT')
          print(json.dumps(records,ensure_ascii=False,indent=2))
          print('Flagged files:',len(records))
          PY
