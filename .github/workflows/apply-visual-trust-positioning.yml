name: Finalize visual trust positioning

on:
  push:
    branches:
      - agent/visual-trust-positioning
    paths:
      - .github/workflows/apply-visual-trust-positioning.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-trust-positioning
          fetch-depth: 0
      - name: Restore invariant-sensitive entity files
        run: |
          git fetch origin main
          git checkout origin/main -- entity.jsonld entity-graph.json knowledge.json partner-service-context.json
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entity.jsonld entity-graph.json knowledge.json partner-service-context.json
          git diff --cached --quiet || git commit -m 'Preserve entity graph invariants for visual trust update'
          git push
      - name: Validate retained positioning layer
        run: |
          node -e "JSON.parse(require('fs').readFileSync('brand-positioning.jsonld','utf8')); console.log('brand-positioning.jsonld valid')"
