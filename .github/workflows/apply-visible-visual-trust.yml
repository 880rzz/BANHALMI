name: Apply visible Visual Trust copy

on:
  push:
    branches:
      - agent/visible-visual-trust-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visible-visual-trust-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node tools/apply-visible-visual-trust.mjs
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit verified production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          git diff --cached --quiet || git commit -m 'Expose Visual Trust positioning in visible homepage copy'
          git push
