name: One-time HU copy report

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-copy-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Hungarian visible copy
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re

          root = Path('.')
          out = []

          def clean_visible(html: str):
              html = re.sub(r'(?is)<script\b[^>]*>.*?</script>', ' ', html)
              html = re.sub(r'(?is)<style\b[^>]*>.*?</style>', ' ', html)
              html = re.sub(r'(?is)<noscript\b[^>]*>.*?</noscript>', ' ', html)
              html = re.sub(r'(?is)<!--.*?-->', ' ', html)
              html = re.sub(r'(?i)</?(?:h[1-6]|p|li|dt|dd|legend|label|button|summary|figcaption|blockquote|address|article|section|header|footer|nav|main|div|form|fieldset|tr|td|th|br)\b[^>]*>', '\n', html)
              html = re.sub(r'(?is)<[^>]+>', ' ', html)
              html = unescape(html)
              lines = []
              for line in html.splitlines():
                  line = re.sub(r'\s+', ' ', line).strip()
                  if line and line not in lines[-2:]:
                      lines.append(line)
              return lines

          for path in sorted(Path('hu').glob('**/index.html')):
              text = path.read_text(encoding='utf-8')
              title = re.search(r'(?is)<title>(.*?)</title>', text)
              desc = re.search(r'(?is)<meta\s+[^>]*name=["\']description["\'][^>]*content=["\'](.*?)["\']', text)
              if not desc:
                  desc = re.search(r'(?is)<meta\s+[^>]*content=["\'](.*?)["\'][^>]*name=["\']description["\']', text)
              out.append('=' * 88)
              out.append(str(path))
              out.append('TITLE: ' + unescape(title.group(1).strip()) if title else 'TITLE:')
              out.append('DESCRIPTION: ' + unescape(desc.group(1).strip()) if desc else 'DESCRIPTION:')
              out.append('-' * 88)
              out.extend(clean_visible(text))
              out.append('')

          out.append('=' * 88)
          out.append('assets/js/mega-menu.js — HUNGARIAN CONFIG SOURCE')
          out.append('-' * 88)
          menu = Path('assets/js/mega-menu.js').read_text(encoding='utf-8')
          hu = re.search(r"\bhu:\{(.*?)\},\s*\nde:\{", menu, re.S)
          if hu:
              out.append(hu.group(1))

          Path('.audit').mkdir(exist_ok=True)
          Path('.audit/hu-copy-report.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Exported {len(list(Path("hu").glob("**/index.html")))} Hungarian pages.')
          PY
      - name: Commit report and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit/hu-copy-report.txt
          git rm .github/workflows/one-time-hu-copy-report.yml
          git commit -m "Add temporary Hungarian copy report"
          git push
