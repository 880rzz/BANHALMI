name: One-time mobile PageSpeed remediation

on:
  push:
    branches:
      - fix/pagespeed-100-round2-20260808
    paths:
      - .github/workflows/apply-pagespeed-mobile100.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile runtime remediation
        run: |
          python3 scripts/apply-pagespeed-mobile100.py
          python3 - <<'PY'
          from pathlib import Path
          old='main.js?v=20260808-startup-v1'
          new='main.js?v=20260808-mobile100-v2'
          changed=0
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed+=1
          if not changed:
              raise SystemExit('No main.js cache references found')
          print(f'Updated cache token in {changed} HTML files')
          PY
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name 'BANHALMI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/main.js -- '*.html' '**/*.html'
          git commit -m 'perf: remove decorative mobile startup work [mobile100-v2]'
          git push origin HEAD:fix/pagespeed-100-round2-20260808
