name: Update portrait brand audit contract
on:
  push:
    branches: [seo/portrait-brand-cluster-vienna-budapest-20260812]
    paths:
      - '.github/workflows/update-portrait-brand-audit-contract.yml'
      - 'tools/update-portrait-brand-audit-contract.mjs'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/portrait-brand-cluster-vienna-budapest-20260812
          fetch-depth: 0
      - run: node tools/update-portrait-brand-audit-contract.mjs
      - name: Commit audit contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-regression.mjs
          git commit -m 'Align regression contract to portrait-brand cluster'
          git push origin HEAD:seo/portrait-brand-cluster-vienna-budapest-20260812
