name: Fix German duplicate copy

on:
  push:
    branches:
      - agent/fix-german-duplicate-copy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-german-duplicate-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/fix-german-duplicate-copy.mjs
      - name: Commit corrected German copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de-at/index.html de-at/eventfotografie/index.html
          git diff --cached --quiet || git commit -m "Fix duplicated German diplomatic copy"
          git push
