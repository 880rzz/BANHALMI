name: One-time runtime cache v50
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-runtime-cache-v50.mjs'
      - '.github/workflows/one-time-runtime-cache-v50.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align site-config cache token
        run: node tools/migrate-runtime-cache-v50.mjs
      - name: Guard unified v50 release
        run: |
          ! grep -R 'site-config.js?v=20260807-blue-palette-v49' --include='*.html' .
          grep -q '/assets/css/mega-menu.css?v=20260807-type-accent-v50' assets/js/site-config.js
          grep -q '/assets/js/mega-menu.js?v=20260807-type-accent-v50' assets/js/site-config.js
          grep -q 'style.css?v=20260807-type-accent-v50' index.html
          grep -q 'site-config.js?v=20260807-type-accent-v50' index.html
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): align BANHALMI cache chain at v50'
          git push
