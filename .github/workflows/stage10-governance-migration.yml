name: One-time stage-ten governance migration
on:
  push:
    branches: [agent/governance-confidentiality-stage10-20260802]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governance-confidentiality-stage10-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply governance blocks
        run: node tools/apply-governance-confidentiality-stage10.mjs
      - name: Remove one-time migration files
        run: rm -f tools/apply-governance-confidentiality-stage10.mjs .github/workflows/stage10-governance-migration.yml
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy
      - name: Verify audit does not modify unrelated tracked files
        run: git diff --exit-code
      - name: Commit audited stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply stage ten governance and confidentiality clarity"
          git push origin HEAD:agent/governance-confidentiality-stage10-20260802
