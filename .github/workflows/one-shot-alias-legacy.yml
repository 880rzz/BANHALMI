name: One-shot alias legacy preservation

on:
  push:
    branches:
      - audit/final-10of10-hardening-20260814

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extend alias maps with slash variants and legacy redirects
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from html.parser import HTMLParser

          root = Path('.')
          canonical = 'https://www.norbertbanhalmi.com'

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.alts = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'link': return
                  a = dict(attrs); rel = (a.get('rel') or '').lower().split()
                  lang = (a.get('hreflang') or '').lower(); href = a.get('href') or ''
                  if 'alternate' in rel and lang in {'en','hu-hu','de-at'} and 'norbertbanhalmi.com' in href:
                      self.alts[lang] = urlparse(href).path

          families = set()
          for html in root.rglob('*.html'):
              parser = LinkParser()
              try: parser.feed(html.read_text(encoding='utf-8', errors='ignore'))
              except Exception: continue
              if all(k in parser.alts for k in ('en','hu-hu','de-at')):
                  families.add((parser.alts['en'], parser.alts['hu-hu'], parser.alts['de-at']))
          if len(families) < 15: raise SystemExit(f'Only {len(families)} route families found')

          family_lookup = {}
          for fam in families:
              for p in fam: family_lookup[p] = fam

          def variants(path):
              if path == '/': return ['/']
              p = '/' + path.strip('/')
              return [p, p + '/']

          # Parse every static redirect stub already preserved in the clean repository.
          legacy = {}
          refresh_re = re.compile(r'<meta[^>]+http-equiv=["\']refresh["\'][^>]+content=["\'][^"\']*url=([^"\']+)', re.I)
          refresh_re2 = re.compile(r'<meta[^>]+content=["\'][^"\']*url=([^"\']+)["\'][^>]+http-equiv=["\']refresh["\']', re.I)
          for html in root.rglob('index.html'):
              rel = html.relative_to(root)
              if str(rel).startswith('redirects/'):
                  continue
              text = html.read_text(encoding='utf-8', errors='ignore')
              m = refresh_re.search(text) or refresh_re2.search(text)
              if not m: continue
              target = m.group(1).strip()
              source = '/' if rel == Path('index.html') else '/' + str(rel.parent).replace('\\','/') + '/'
              legacy[source] = target

          def locale_target(target, index):
              u = urlparse(target)
              if u.netloc in {'www.norbertbanhalmi.com','norbertbanhalmi.com'}:
                  fam = family_lookup.get(u.path)
                  if fam:
                      return fam[index] + (('#' + u.fragment) if u.fragment else '')
                  return target
              return target

          def make_map(index):
              mapping = {}
              for fam in sorted(families):
                  destination = fam[index]
                  for source in fam:
                      for variant in variants(source): mapping[variant] = destination
              for source, target in legacy.items():
                  localized = locale_target(target, index)
                  for variant in variants(source): mapping[variant] = localized
              return mapping

          at_map, hu_map = make_map(2), make_map(1)

          def middleware(mapping, fallback):
              map_json = json.dumps(mapping, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              return f'''export const config = {{ matcher: '/:path*' }};\n\nconst ROUTES = {map_json};\nconst CANONICAL = {json.dumps(canonical)};\nconst FALLBACK = {json.dumps(fallback)};\n\nexport default function middleware(request) {{\n  const incoming = new URL(request.url);\n  const rawPath = incoming.pathname || '/';\n  const slashPath = rawPath === '/' || rawPath.endsWith('/') ? rawPath : rawPath + '/';\n  const mapped = ROUTES[rawPath] || ROUTES[slashPath];\n  const destination = mapped || FALLBACK;\n  const target = /^https?:\\/\\//i.test(destination) ? new URL(destination) : new URL(destination, CANONICAL);\n  if (!target.search && incoming.search) target.search = incoming.search;\n  return new Response(null, {{ status: 308, headers: {{ Location: target.href, 'Cache-Control': 'public, max-age=0, s-maxage=86400' }} }});\n}}\n'''

          (root/'redirects/at/middleware.js').write_text(middleware(at_map, '/de-at/'), encoding='utf-8')
          (root/'redirects/hu/middleware.js').write_text(middleware(hu_map, '/hu/'), encoding='utf-8')

          # Root project mirrors the exact same host behavior when aliases are attached there.
          vp = root/'vercel.json'; cfg = json.loads(vp.read_text(encoding='utf-8'))
          ordinary = [r for r in cfg.get('redirects',[]) if not any(h.get('key')=='Host' for h in r.get('has',[]))]
          host_rules=[]
          for host, mapping, fallback in (
              ('banhalmi.at',at_map,'/de-at/'),('www.banhalmi.at',at_map,'/de-at/'),
              ('banhalminorbert.hu',hu_map,'/hu/'),('www.banhalminorbert.hu',hu_map,'/hu/')):
              for source,dest in sorted(mapping.items()):
                  absolute = dest if re.match(r'^https?://',dest,re.I) else canonical+dest
                  host_rules.append({'source':source,'destination':absolute,'permanent':True,'has':[{'type':'header','key':'Host','value':host}]})
              host_rules.append({'source':'/:path*','destination':canonical+fallback,'permanent':True,'has':[{'type':'header','key':'Host','value':host}]})
          cfg['redirects']=host_rules+ordinary
          vp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Critical assertions: localized current routes, slashless variants, legacy business URLs, ART/blog legacy bridges.
          assert hu_map['/portrait'] == '/hu/portre/'
          assert at_map['/portrait'] == '/de-at/portrait/'
          assert hu_map['/lifestyle'] == '/hu/brand/'
          assert at_map['/oneletrajz-cv-fotozas'] == '/de-at/portrait/'
          assert hu_map['/oneletrajz-cv-fotozas'] == '/hu/portre/'
          assert 'blog.banhalmi.art' in hu_map['/post/amikor-csak-egy-táncpartnered-van-egész-estére']
          assert 'banhalmi.art' in at_map['/press']
          print(f'Alias maps: AT {len(at_map)}, HU {len(hu_map)}, legacy stubs {len(legacy)}')

      - name: Validate refined routing
        run: |
          npm test
          node --check redirects/at/middleware.js
          node --check redirects/hu/middleware.js
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          grep -q 'oneletrajz-cv-fotozas' redirects/at/middleware.js
          grep -q 'oneletrajz-cv-fotozas' redirects/hu/middleware.js
          grep -q 'blog.banhalmi.art' redirects/hu/middleware.js
          grep -q 'www.banhalmi.art' redirects/at/middleware.js
      - name: Commit verified refinement and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-alias-legacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve localized and legacy alias routing"
          git push origin HEAD:audit/final-10of10-hardening-20260814
