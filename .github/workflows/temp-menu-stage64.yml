name: Temporary Stage 64 menu migration
on:
  push:
    branches: [fix/menu-no-blogs-fullscreen-20260810]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/apply-menu-stage64.mjs
      - run: rm .github/workflows/temp-menu-stage64.yml tools/apply-menu-stage64.mjs
      - run: npm run audit
      - run: |
          git config user.name "BANHALMI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify fullscreen navigation and remove blog menu links"
          git push
