name: Apply PageSpeed stage 32

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pagespeed-stage32.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node tools/apply-pagespeed-stage32.mjs
      - name: Remove one-time migration files
        run: git rm .github/workflows/apply-pagespeed-stage32.yml tools/apply-pagespeed-stage32.mjs
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BANHALMI PageSpeed migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): close PageSpeed accessibility and positioning gaps'
          git push origin HEAD:main
