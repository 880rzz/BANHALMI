name: One-time stage45 CSS deduplicate
on:
  push:
    branches: [main]
    paths:
      - 'tools/remove-exact-style-duplicate-stage45.mjs'
      - '.github/workflows/one-time-stage45-css-deduplicate.yml'
permissions:
  contents: write
jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/remove-exact-style-duplicate-stage45.mjs
      - name: Commit exact duplicate removal
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'fix(css): remove exact duplicate production design block'
          git push
