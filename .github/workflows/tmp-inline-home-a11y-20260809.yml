name: Temporary inline homepage accessibility CSS
on:
  push:
    branches:
      - fix/pagespeed-home-a11y-inline-20260809
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagespeed-home-a11y-inline-20260809
      - name: Inline critical accessibility CSS on EN HU DE homepages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('assets/css/accessibility-stage14.css').read_text()
          css=re.sub(r'/\* STAGE42-STATIC-VALIDATION:START \*/.*?/\* STAGE42-STATIC-VALIDATION:END \*/','',css,flags=re.S)
          # Preserve named contract comments while compacting whitespace.
          css=re.sub(r'\s+',' ',css).strip()
          css=re.sub(r'\s*([{}:;,])\s*',r'\1',css)
          inline='<style data-banhalmi-home-a11y>'+css+'</style>'
          pattern=re.compile(r'<link href="/assets/css/accessibility-stage14\.css\?v=20260802" rel="stylesheet"\s*/?>')
          for name in ['index.html','hu/index.html','de-at/index.html']:
              p=Path(name); html=p.read_text()
              new,n=pattern.subn(inline,html,count=1)
              if n!=1: raise SystemExit(f'{name}: expected one accessibility stylesheet link, found {n}')
              p.write_text(new)
          PY
      - name: Commit generated homepage changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'perf: inline homepage accessibility CSS'
          git push origin HEAD:fix/pagespeed-home-a11y-inline-20260809
