name: Fix meta description lengths

on:
  push:
    branches:
      - fix/homepage-meta-parity-20260816
    paths:
      - 'tools/fix-meta-lengths-20260816.mjs'
      - '.github/workflows/fix-meta-lengths-20260816.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-meta-parity-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact description remediation
        run: node tools/fix-meta-lengths-20260816.mjs
      - name: Verify strict source contracts and commit
        run: |
          set -euo pipefail
          node tools/audit-homepage-meta-parity.mjs
          node tools/audit-meta-description-quality.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hu/index.html de-at/index.html portrait/index.html tools/audit-homepage-meta-parity.mjs
          git commit -m 'fix: keep broadened positioning within meta quality limits'
          git push origin HEAD:fix/homepage-meta-parity-20260816
