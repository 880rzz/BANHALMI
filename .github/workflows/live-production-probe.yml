# PR production-state probe: verify that the public site still matches main.
# Semantic live-state assertions run after deployment in llm-live-integrity.yml,
# so a corrective PR is not blocked merely because production still contains
# the regression that the PR is designed to remove.
name: Live production probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production origin matches current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/880rzz/BANHALMI/git/ref/heads/main' | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          actual="$(curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/deployment-sha.txt')"
          echo "EXPECTED_SHA=$expected"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$expected"

          # Keep a minimal availability probe here. Relationship and LLM semantics
          # are intentionally verified post-deploy by llm-live-integrity.yml.
          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/speier-viko/' >/dev/null
          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/llms.txt' >/dev/null
