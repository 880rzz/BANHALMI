name: BANHALMI live production probe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact current main deployment SHA
        run: |
          expected="$(curl --fail --silent https://api.github.com/repos/880rzz/BANHALMI/commits/main | sed -n 's/.*"sha": "\([0-9a-f]*\)".*/\1/p' | head -1)"
          live="$(curl --fail --silent https://www.norbertbanhalmi.com/deployment-sha.txt | tr -d '\r\n')"
          test -n "$expected" && test "$live" = "$expected"
