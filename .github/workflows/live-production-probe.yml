name: BANHALMI live production probe
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify last successful Pages release on the custom domain
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone

          base = 'https://api.github.com/repos/880rzz/BANHALMI'
          headers = {'User-Agent': 'BANHALMI-live-production-probe',
                     'Accept': 'application/vnd.github+json',
                     'Cache-Control': 'no-cache'}

          def fetch(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          # Compare production with the latest *successfully deployed* commit,
          # not a new main revision that is still passing the Pages QA gates.
          runs = json.loads(fetch(
              base + '/actions/workflows/pages.yml/runs?branch=main&per_page=30'
          ))['workflow_runs']
          deployed = next((r for r in runs
                           if r.get('status') == 'completed'
                           and r.get('conclusion') == 'success'), None)
          if not deployed:
              raise SystemExit('No successful BANHALMI Pages release to verify')

          expected = deployed['head_sha']
          live = fetch(
              'https://www.banhalmiphotography.com/deployment-sha.txt'
          ).decode('utf-8').strip()
          if live == expected:
              print('PRODUCTION-VERIFIED:', live, 'matches last successful Pages release')
              sys.exit(0)

          # A newer release can become visible before its workflow has passed
          # every exact-live/privacy gate. Do not issue a false alarm mid-release.
          cutoff = datetime.now(timezone.utc) - timedelta(hours=1)
          active = [r for r in runs
                    if r.get('status') in ('queued', 'requested', 'waiting',
                                           'pending', 'in_progress')
                    and datetime.fromisoformat(
                        r['created_at'].replace('Z', '+00:00')
                    ) > cutoff]
          if active:
              print('DEFERRED: Pages deployment still active; latest successful',
                    expected, 'live', live)
              sys.exit(0)

          print('PRODUCTION-MISMATCH: expected last successful', expected,
                'but live marker was', live, file=sys.stderr)
          sys.exit(1)
          PY
