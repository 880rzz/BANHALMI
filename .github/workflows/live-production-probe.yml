# Redeploy trigger: 2026-09-04 LLM commercial semantics
name: Live production probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production origin and LLM relationship semantics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/880rzz/BANHALMI/git/ref/heads/main' | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          actual="$(curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/deployment-sha.txt')"
          echo "EXPECTED_SHA=$expected"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$expected"

          for url in \
            'https://www.norbertbanhalmi.com/speier-viko/' \
            'https://www.norbertbanhalmi.com/hu/speier-viko/' \
            'https://www.norbertbanhalmi.com/de-at/speier-viko/'; do
            html="$(curl -fsSL --max-time 30 "$url")"
            printf '%s' "$html" | grep -q 'viko@banhalmi.at'
            if printf '%s' "$html" | grep -Eq '"employee"[[:space:]]*:[[:space:]]*\{[[:space:]]*"@id"[[:space:]]*:[[:space:]]*"https://www\.norbertbanhalmi\.com/speier-viko/#person"'; then
              echo "Unsupported employee semantics detected on $url" >&2
              exit 1
            fi
            if printf '%s' "$html" | grep -Eq '"worksFor"[[:space:]]*:[[:space:]]*\{[[:space:]]*"@id"[[:space:]]*:[[:space:]]*"https://www\.norbertbanhalmi\.com/#organization"'; then
              echo "Unsupported worksFor semantics detected on $url" >&2
              exit 1
            fi
          done

          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/people-roles.json' | grep -Fq 'independent professional partner and collaborator'
          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/team-capabilities.json' | grep -Fq 'approximateProfessionalPhotographerPartners'
          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/market-geography.json' | grep -Fq '1190 Döbling'
          curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/llm-commercial-contract.json' | grep -Fq 'approximately 50 professional photographer partners/collaborators'
