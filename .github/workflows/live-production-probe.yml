name: Live production probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/880rzz/BANHALMI/git/ref/heads/main' | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          actual="$(curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/deployment-sha.txt')"
          echo "EXPECTED_SHA=$expected"
          echo "ACTUAL_SHA=$actual"
          html="$(curl -fsSL --max-time 30 'https://www.norbertbanhalmi.com/speier-viko/')"
          if printf '%s' "$html" | grep -q 'viko@banhalmi.at'; then
            echo 'VIKO_EMAIL=OK'
          else
            echo 'VIKO_EMAIL=OLD_OR_MISSING'
          fi
          test "$actual" = "$expected"
          printf '%s' "$html" | grep -q 'viko@banhalmi.at'

  candidate-production-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate homepage artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site artifacts/browser-layout artifacts/lighthouse-mobile artifacts/lighthouse-desktop /tmp/banhalmi-home-css
          mkdir -p _site /tmp/banhalmi-home-css
          git ls-files -z | rsync -a --from0 --files-from=- ./ _site/
          node tools/optimize-production-artifact.mjs _site
          cat >> _site/assets/css/site.css <<'EOF'
          @media (max-width:760px){
            main[data-homepage-redesign] > section:nth-of-type(n+2){
              content-visibility:auto;
              contain-intrinsic-size:auto 760px;
            }
          }
          EOF
          node tools/build-home-css-safelist.mjs _site/assets/css/site.css _site/.home-css-safelist.html
          npx --yes purgecss@7.0.2 --css _site/assets/css/site.css --content _site/index.html _site/hu/index.html _site/de-at/index.html _site/.home-css-safelist.html --output /tmp/banhalmi-home-css
          mv /tmp/banhalmi-home-css/site.css _site/assets/css/home.css
          rm -f _site/.home-css-safelist.html
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          for (const file of ['_site/index.html','_site/hu/index.html','_site/de-at/index.html']) {
            let html = fs.readFileSync(file, 'utf8');
            html = html.replace(/\/assets\/css\/site\.css([^\"']*)/g, '/assets/css/home.css$1');
            fs.writeFileSync(file, html);
          }
          EOF
          npx --yes esbuild@0.25.9 _site/assets/css/site.css --minify --outfile=/tmp/site.min.css
          mv /tmp/site.min.css _site/assets/css/site.css
          npx --yes esbuild@0.25.9 _site/assets/css/home.css --minify --outfile=/tmp/home.min.css
          mv /tmp/home.min.css _site/assets/css/home.css
          for js in _site/assets/js/main.js _site/assets/js/mega-menu.js _site/assets/js/analytics.js; do
            if [ -f "$js" ]; then
              npx --yes esbuild@0.25.9 "$js" --minify --outfile=/tmp/runtime.min.js
              mv /tmp/runtime.min.js "$js"
            fi
          done
          echo "HOME_CSS_BYTES=$(wc -c < _site/assets/css/home.css)"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate candidate browser behavior and layout
        shell: bash
        run: |
          set -euo pipefail
          node tools/perf-static-server.mjs _site 4173 > /tmp/banhalmi-candidate-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.25; done
          npm run test:e2e
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-browser-layout.mjs
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=_site node tools/audit-first-principles-layout.mjs
      - name: Run candidate mobile Lighthouse gate
        run: |
          npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.mobile.cjs
          node tools/audit-lighthouse-all-runs.mjs artifacts/lighthouse-mobile
      - name: Run candidate desktop Lighthouse gate
        run: |
          npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.desktop.cjs
          node tools/audit-lighthouse-all-runs.mjs artifacts/lighthouse-desktop
