name: Live production probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7

      - name: Crawl live blog ecosystem in HU EN DE
        run: node tools/audit-live-blog-ecosystem.mjs

      - name: Upload live blog audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-blog-audit-report
          path: live-blog-audit-report.json
          if-no-files-found: warn
