name: Fix clean quote info layout
on:
  push:
    branches: [main]
    paths:
      - tools/fix-clean-quote-info-layout-20260825.mjs
      - .github/workflows/fix-clean-quote-info-layout-20260825.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fix-clean-quote-info-layout-20260825.mjs
      - run: node tools/audit-apple-responsive-contract.mjs
      - run: node tools/audit-layout-authority.mjs
      - name: Commit CSS correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo 'No CSS changes.'
          else
            git commit -m 'Fix quote info controls within clean design authority'
            git push origin HEAD:main
          fi
