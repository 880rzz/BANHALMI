name: One-shot Stage 68 contact path
on:
  push:
    branches:
      - agent/first-principles-apple-20260813-v3
permissions:
  contents: write
jobs:
  transform:
    if: github.event.head_commit.message != 'Route Stage 68 uncertainty through contact choice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-principles-apple-20260813-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix-stage68-contact-path.py
      - run: node tools/audit-first-principles-apple-stage68.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html
          git commit -m "Route Stage 68 uncertainty through contact choice"
          git push origin HEAD:agent/first-principles-apple-20260813-v3
