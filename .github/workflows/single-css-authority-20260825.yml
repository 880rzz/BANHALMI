name: Consolidate BANHALMI single CSS authority

# One-shot migration v7: push only non-workflow source changes; production workflow is updated separately.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/single-css-authority-20260825.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidate source and production CSS authority
        run: |
          node tools/migrate-single-css-authority-20260825.cjs
          node tools/migrate-pages-single-css-20260825.cjs
          node tools/cleanup-css-authority-20260825.cjs
          rm -f assets/css/visual-rhythm-20260825.css
          rm -f tools/audit-visual-rhythm-regression.mjs
          rm -f tools/audit-visual-rhythm-regression-20260825.mjs
      - name: Validate source contracts
        run: npm test
      - name: Commit non-workflow design system changes
        run: |
          git config user.name "BANHALMI release bot"
          git config user.email "actions@users.noreply.github.com"
          git restore .github/workflows/pages.yml
          git restore .github/workflows/single-css-authority-20260825.yml
          rm -f tools/migrate-single-css-authority-20260825.cjs
          rm -f tools/migrate-pages-single-css-20260825.cjs
          rm -f tools/cleanup-css-authority-20260825.cjs
          git add -u -- ':!.github/workflows/**'
          git add assets/css/site.css tools/audit-apple-responsive-contract.mjs tools/audit-layout-authority.mjs package.json '*.html' ':**/*.html'
          git commit -m "Restore single Apple responsive CSS authority"
          git push origin HEAD:main
