name: One-shot portrait location metadata

on:
  push:
    branches:
      - seo/portrait-metadata-vienna-budapest-20260821
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/portrait-metadata-vienna-budapest-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact metadata replacements
        run: node tools/one-shot-portrait-location-metadata-20260821.mjs
      - name: Validate target metadata
        run: |
          grep -Fq 'Executive Portrait &amp; Headshot Photographer | Vienna–Budapest | BANHALMI' portrait/index.html
          grep -Fq 'Executive portré és Headshot fotózás | Bécs–Budapest | BANHALMI' hu/portre/index.html
          grep -Fq 'Executive-Porträt &amp; Headshot-Fotografie | Wien–Budapest | BANHALMI' de-at/portrait/index.html
      - name: Remove one-shot helpers
        run: |
          rm tools/one-shot-portrait-location-metadata-20260821.mjs
          rm .github/workflows/one-shot-portrait-location-metadata-20260821.yml
      - name: Commit targeted production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portrait/index.html hu/portre/index.html de-at/portrait/index.html tools/one-shot-portrait-location-metadata-20260821.mjs .github/workflows/one-shot-portrait-location-metadata-20260821.yml
          git diff --cached --check
          git commit -m 'SEO: add Vienna–Budapest to portrait metadata'
          git push origin HEAD:seo/portrait-metadata-vienna-budapest-20260821
