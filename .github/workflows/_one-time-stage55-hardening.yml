name: One-time Stage 55 strict trust/legal hardening

on:
  push:
    branches:
      - audit/strict-trust-legal-20260808

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/strict-trust-legal-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply strict legal trust GA schema hardening
        run: node tools/apply-strict-trust-legal-stage55.mjs
      - name: Remove one-time mutating maintenance before audited tree
        run: |
          rm -f .github/workflows/_one-time-stage55-hardening.yml
          rm -f tools/apply-strict-trust-legal-stage55.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full deterministic audit
        run: npm run audit
      - name: Run full browser regression
        run: npm run test:browser
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'compliance: harden legal trust analytics and AI transparency'
          git push origin HEAD:audit/strict-trust-legal-20260808
