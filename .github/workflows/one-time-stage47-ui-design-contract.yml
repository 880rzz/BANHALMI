name: One-time stage47 UI design contract
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-ui-design-contract-stage47.mjs'
      - '.github/workflows/one-time-stage47-ui-design-contract.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final UI contract
        run: node tools/migrate-ui-design-contract-stage47.mjs
      - name: Guard expected contract
        run: |
          grep -q 'STAGE47-UI-DESIGN-CONTRACT:START' assets/css/style.css
          grep -q -- '--ui-image-radius:4px' assets/css/style.css
          grep -q -- '--ui-gallery-gap:16px' assets/css/style.css
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(design): unify gallery spacing image radius and viewport footer'
          git push
