name: Apply plain-language artist packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply copy migration
        run: python3 tools/apply-plain-language-artist-packages-20260901.py
      - name: Commit localized package copy and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_apply-plain-language-artist-packages-20260901.yml
          git rm tools/apply-plain-language-artist-packages-20260901.py
          git add glamour/index.html hu/muveszi-fotografia/index.html de-at/fine-art/index.html
          git commit -m 'Clarify artist packages for actors dancers and performers'
          git push
