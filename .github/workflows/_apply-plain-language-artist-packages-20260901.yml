<!-- PLAIN-LANGUAGE-ARTIST-PACKAGES:END -->'''
          }

          marker = re.compile(r'<!-- PLAIN-LANGUAGE-ARTIST-PACKAGES:START -->.*?<!-- PLAIN-LANGUAGE-ARTIST-PACKAGES:END -->', re.S)
          for path_str, block in pages.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              text = marker.sub('', text)
              if '</main>' not in text:
                  raise SystemExit(f'Missing </main> in {path}')
              text = text.replace('</main>', block + '\n</main>', 1)
              path.write_text(text, encoding='utf-8')

          # Guard the commercial contract: package prices and service routing must not change.
          import json
          pricing = json.loads(Path('pricing.json').read_text(encoding='utf-8'))
          fine = next(s for s in pricing['services'] if s['id'] == 'fine-art')
          expected = [('art60', 690), ('art120', 990), ('art180', 1290)]
          actual = [(p['code'], p['grossEUR']) for p in fine['packages']]
          if actual != expected:
              raise SystemExit(f'Fine Art pricing changed unexpectedly: {actual}')
          if fine['quoteRouting']['serviceContext'] != 'fine-art':
              raise SystemExit('fine-art routing contract changed unexpectedly')
          PY

          git rm .github/workflows/_apply-plain-language-artist-packages-20260901.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glamour/index.html hu/muveszi-fotografia/index.html de-at/fine-art/index.html
          git commit -m 'Clarify artist packages for actors dancers and performers'
          git push
