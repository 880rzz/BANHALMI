<!-- PLAIN-LANGUAGE-ARTIST-PACKAGES:END -->''',
            'de-at/fine-art/index.html': '''<!-- PLAIN-LANGUAGE-ARTIST-PACKAGES:START -->
<section class="section-band" id="artist-packages-guide">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Künstler:innen &amp; Performer:innen</span>
      <h2>Wähle danach, was du brauchst — nicht nach Fotografie-Fachbegriffen.</h2>
