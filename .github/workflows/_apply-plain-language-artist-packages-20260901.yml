        <ul class="ticks"><li>Vollständiges Schauspiel- oder Performer:innen-Portfolio</li><li>Mehrere Charaktere oder visuelle Richtungen</li><li>Statische und dynamische Tanzbilder</li><li>Material für Casting, Website, Social Media, Presse und Agenturen</li></ul>
