        <ul class="ticks"><li>Teljes színész- vagy előadóművész portfólió</li><li>Több különböző karakter vagy vizuális irány</li><li>Statikus és dinamikus táncképek</li><li>Képek castinghoz, weboldalhoz, social mediához, sajtóhoz és ügynökséghez</li></ul>
