name: Apply plain-language artist packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-plain-language-artist-packages-20260901.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update localized Fine Art package guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
