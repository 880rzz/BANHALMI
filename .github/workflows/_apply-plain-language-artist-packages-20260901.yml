        <ul class="ticks"><li>Színészportfólió castingokhoz</li><li>Portrék és mozgásos képek táncosoknak</li><li>Több ruha vagy karakter</li><li>Képek weboldalra, ügynökséghez és közösségi felületekre</li></ul>
      </article>
      <article class="card">
        <h3>3 órás teljes művészi portfólió — 1 290 €</h3>
