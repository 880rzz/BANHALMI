name: One-shot BANHALMI complete remediation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banhalmi-full-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-remediation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consolidate artistic archive ownership
        run: node tools/simplify-about-art-ownership-20260814.mjs
      - name: Consolidate team-role ownership
        run: node tools/simplify-team-role-ownership-20260814.mjs
      - name: Consolidate legal content ownership
        run: node tools/simplify-legal-content-ownership-20260814.mjs
      - name: Remove duplicated quote legal chapters
        run: node tools/simplify-quote-legal-ownership-20260814.mjs
      - name: Remove Person homeLocation business-location misuse
        run: node tools/remove-person-home-location-20260814.mjs
      - name: Correct canonical HU Terms references
        run: node tools/fix-hu-terms-links-20260814.mjs
      - name: Correct Hungarian copy globally
        run: node tools/fix-hungarian-article-vezetoi-20260814.mjs
      - name: Complete truncated subpage metadata
        run: node tools/fix-meta-description-quality-20260814.mjs
      - name: Harden browser autofill semantics
        run: node tools/remediate-form-autocomplete-20260814.mjs
      - name: Fix English lightbox accessible names
        run: node tools/remediate-lightbox-a11y-20260814.mjs
      - name: Compact quote decision geometry
        run: node tools/remediate-quote-density-20260814.mjs
      - name: Fix desktop contrast and link accessibility
        run: node tools/remediate-desktop-a11y-20260814.mjs
      - name: Run complete source contract
        run: npm test
      - name: Verify first-principles post-migration state
        run: node tools/audit-postmigration-first-principles-20260814.mjs
      - name: Commit complete remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+880rzz@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit.'
            exit 0
          fi
          git commit -m 'Simplify BANHALMI ownership and fix audited UI defects'
          git push origin HEAD:audit/full-remediation-20260814
