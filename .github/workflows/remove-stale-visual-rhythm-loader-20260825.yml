name: Remove stale visual rhythm loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-stale-visual-rhythm-loader-20260825.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete secondary stylesheet loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/mega-menu.js')
          s = p.read_text()
          start = "/* Emergency visual-authority loader."
          marker = "var C={"
          assert start in s, 'stale loader start not found'
          assert marker in s, 'mega-menu data marker not found'
          a = s.index(start)
          b = s.index(marker, a)
          s = s[:a] + s[b:]
          assert 'visual-rhythm-20260825.css' not in s, 'stale stylesheet reference remains'
          p.write_text(s)
          PY
          node --check assets/js/mega-menu.js
          test "$(git diff --name-only)" = "assets/js/mega-menu.js"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/mega-menu.js
          git commit -m 'Remove stale visual rhythm stylesheet loader'
          git push origin HEAD:main
