name: Fix HU stage60 copy 20260809
on:
  push:
    branches: [fix/critical-ecosystem-audit-20260809]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/critical-ecosystem-audit-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-hu-stage60-copy-20260809.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hu/portre/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep Hungarian portrait copy native'
          git push
