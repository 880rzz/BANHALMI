name: Sync sitemap lastmod from real page history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_sync-sitemap-lastmod-20260812.yml'

permissions:
  contents: write

jobs:
  sync-lastmod:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize sitemap lastmod from each canonical source page
        run: npm run sync:sitemap-lastmod

      - name: Verify sitemap freshness contract
        run: npm run audit:sitemap-freshness

      - name: Remove one-shot workflow before audit
        run: rm -f .github/workflows/_sync-sitemap-lastmod-20260812.yml

      - name: Run complete repository audit
        run: npm run audit

      - name: Commit audited sitemap metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '880rzz'
          git config user.email '107166660+880rzz@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Sync sitemap lastmod with canonical page history'
          git push origin HEAD:main
