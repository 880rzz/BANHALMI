name: Source contract diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source audits and capture diagnostics
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          rc=$?
          set -e
          mkdir -p artifacts/source-contract-diagnostic
          cp /tmp/npm-test.log artifacts/source-contract-diagnostic/npm-test.log
          git status --short > artifacts/source-contract-diagnostic/git-status.txt
          git diff --name-only > artifacts/source-contract-diagnostic/git-diff-names.txt
          git diff > artifacts/source-contract-diagnostic/git-diff.patch
          printf '%s\n' "$rc" > artifacts/source-contract-diagnostic/exit-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-contract-diagnostic-${{ github.sha }}
          path: artifacts/source-contract-diagnostic
          retention-days: 1
