name: COM cross-site diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-cross-site-audit-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run all audits with diagnostics
        shell: bash
        run: |
          set +e
          npm run audit 2>&1 | tee com-audit.log
          s1=${PIPESTATUS[0]}
          npm run audit:copy 2>&1 | tee -a com-audit.log
          s2=${PIPESTATUS[0]}
          echo "statuses: $s1 $s2" | tee -a com-audit.log
          exit $((s1 || s2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: com-cross-site-diagnostics
          path: com-audit.log
