name: One-time quote service context stage 8

on:
  push:
    branches:
      - agent/quote-service-context-stage8
    paths:
      - scripts/_migrate-quote-service-context-stage8.mjs
      - .github/workflows/_quote-service-context-stage8.yml

permissions:
  contents: write

jobs:
  migrate-audit-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected branch
        uses: actions/checkout@v4
        with:
          ref: agent/quote-service-context-stage8
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify migration syntax
        run: node --check scripts/_migrate-quote-service-context-stage8.mjs

      - name: Apply focused quote context migration
        run: node scripts/_migrate-quote-service-context-stage8.mjs

      - name: Verify generated JavaScript syntax
        run: |
          node --check assets/js/quote-calculator.js
          node --check tools/audit-quote-service-context-stage24.mjs
          node --check tests/quote-service-context.spec.mjs

      - name: Install audit dependencies
        run: npm install

      - name: Run complete repository audit
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: npm run test:browser

      - name: Verify quote context contract directly
        run: node tools/audit-quote-service-context-stage24.mjs

      - name: Remove temporary writers
        run: |
          rm scripts/_migrate-quote-service-context-stage8.mjs
          rm .github/workflows/_quote-service-context-stage8.yml

      - name: Verify temporary writers are gone
        run: |
          test ! -e scripts/_migrate-quote-service-context-stage8.mjs
          test ! -e .github/workflows/_quote-service-context-stage8.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 4
          git diff --check

      - name: Commit verified stage
        run: |
          git config user.name "BANHALMI audit automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified changes to commit"; exit 1; }
          git commit -m "Preserve service context in quote builder"
          git push origin HEAD:agent/quote-service-context-stage8
