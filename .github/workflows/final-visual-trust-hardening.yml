name: Final visual trust hardening

on:
  push:
    branches:
      - agent/final-visual-trust-hardening
    paths:
      - tools/final-visual-trust-hardening.mjs
      - .github/workflows/final-visual-trust-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-visual-trust-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply hardening
        run: node tools/final-visual-trust-hardening.mjs
      - name: Validate deterministic audit
        run: npm run audit
      - name: Validate browser behaviour
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Commit validated production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html entity.jsonld package.json tools/audit-regression.mjs .github/workflows/production-audit.yml
          git rm -f tools/run-current-positioning-audit.mjs 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Harden visual trust positioning schema and audit'
          git push