name: Quote flow simplification

on:
  push:
    branches:
      - agent/simplify-quote-flow-20260813
    paths:
      - tools/apply-quote-simplification.mjs
      - .github/workflows/quote-flow-simplify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-flow-simplification
  cancel-in-progress: false

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-quote-flow-20260813
          fetch-depth: 0
          persist-credentials: true

      - name: Apply three-language quote simplification
        run: node tools/apply-quote-simplification.mjs

      - name: Validate calculator and pricing contracts
        run: |
          node tools/audit-pricing-huf.mjs
          node tools/audit-pricing-currency-stage38.mjs
          node tools/audit-quote-service-context-stage24.mjs
          node tools/audit-first-principles-stage28.mjs
          node tools/audit-hungarian-copy.mjs
          node tools/audit-human-voice-en-de.mjs

      - name: Commit generated quote pages
        shell: bash
        run: |
          if git diff --quiet -- hu/ajanlatkeres/index.html requestaquote/index.html de-at/anfrage/index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hu/ajanlatkeres/index.html requestaquote/index.html de-at/anfrage/index.html
          git commit -m "Simplify quote flow in HU EN DE"
          git push origin HEAD:agent/simplify-quote-flow-20260813
