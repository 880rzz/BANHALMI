name: Apply strict final web audit fixes

on:
  push:
    branches: [agent/strict-final-web-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-final-web-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, html
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8'); n=s.replace('· ·','·')
              if n!=s: p.write_text(n,encoding='utf-8')
          redirects={'en/work':'https://www.banhalmi.art/en/work','hu/eletmu':'https://www.banhalmi.art/hu/eletmu','de-at/werk':'https://www.banhalmi.art/de/werk','about/norbert-banhalmi':'https://www.banhalmi.art/about/norbert-banhalmi','hu/rolam/banhalmi-norbert':'https://www.banhalmi.art/hu/rolam/banhalmi-norbert','de/ueber-mich/norbert-banhalmi':'https://www.banhalmi.art/de/ueber-mich/norbert-banhalmi','press':'https://www.banhalmi.art/press','old-print':'https://www.banhalmi.art/old-print','hu/sajto/megjelenesek':'https://www.banhalmi.art/hu/sajto/megjelenesek','hu/sajto/nyomtatott':'https://www.banhalmi.art/hu/sajto/nyomtatott','de/presse/presseauftritte':'https://www.banhalmi.art/de/presse/presseauftritte','de/presse/print':'https://www.banhalmi.art/de/presse/print'}
          t='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Redirecting | BANHALMI</title><link rel="canonical" href="{target}"><meta http-equiv="refresh" content="0;url={target}"><script>window.location.replace({js});</script></head><body><main><p>This address has moved. <a href="{target}">Continue to the current page</a>.</p></main></body></html>'''
          for route,target in redirects.items():
              p=Path(route)/'index.html'; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(t.format(target=html.escape(target,quote=True),js=json.dumps(target)),encoding='utf-8')
          audit='''import fs from "node:fs";import path from "node:path";const redirects='''+json.dumps(redirects)+''';let e=[];for(const [r,t] of Object.entries(redirects)){const f=path.join(r,"index.html");if(!fs.existsSync(f)){e.push(`missing ${f}`);continue}const h=fs.readFileSync(f,"utf8");for(const x of ["noindex,follow",`href="${t}"`,`content="0;url=${t}"`,"window.location.replace"])if(!h.includes(x))e.push(`${f}: missing ${x}`)}for(const f of ["index.html","hu/index.html","de-at/index.html"]){if(fs.readFileSync(f,"utf8").includes("· ·"))e.push(`${f}: duplicated footer separator`)}if(e.length){console.error(e.join("\\n"));process.exit(1)}console.log(`Static redirect and footer audit passed (${Object.keys(redirects).length} routes).`);'''
          Path('tools/audit-static-legacy-routes-stage27.mjs').write_text(audit,encoding='utf-8')
          clarity='''import fs from "node:fs";const pages=[{file:"index.html",must:[/BANHALMI/i,/visual strategic partner|visual trust/i,/Executive Portrait/i,/Brand Photography/i,/Event Photography/i,/Fine Art/i,/Vienna/i,/Budapest/i,/request|consultation|quote/i,/banhalmi\\.art/i]},{file:"hu/index.html",must:[/BANHALMI/i,/vizuális stratégiai partner|vizuális bizalom/i,/Executive portré/i,/Brandfotó/i,/Eseményfotó/i,/Fine Art|Művészeti/i,/Bécs/i,/Budapest/i,/ajánlat|konzultáció/i,/banhalmi\\.art/i]},{file:"de-at/index.html",must:[/BANHALMI/i,/visueller strategischer Partner|visuelles Vertrauen/i,/Executive-Porträt/i,/Brandfotografie/i,/Eventfotografie/i,/Fine Art/i,/Wien/i,/Budapest/i,/Angebot|Beratung/i,/banhalmi\\.art/i]}];let e=[];for(const{file,must}of pages){const h=fs.readFileSync(file,"utf8");for(const r of must)if(!r.test(h))e.push(`${file}: missing clarity signal ${r}`)}const d=fs.readFileSync("de-at/index.html","utf8");if(/Sechs fotografische Leistungen/i.test(d))e.push("stale six-service framing");if(!/Vier fotografische Leistungen/i.test(d))e.push("four-service framing missing");if(e.length){console.error(e.join("\\n"));process.exit(1)}console.log("First-principles five-second clarity audit passed for EN/HU/DE.");'''
          Path('tools/audit-first-principles-stage28.mjs').write_text(clarity,encoding='utf-8')
          pkg=json.loads(Path('package.json').read_text()); cmd=pkg['scripts']['audit']
          for a in ['node tools/audit-static-legacy-routes-stage27.mjs','node tools/audit-first-principles-stage28.mjs']:
              if a not in cmd: cmd+=' && '+a
          pkg['scripts']['audit']=cmd; pkg['scripts']['audit:legacy-routes']='node tools/audit-static-legacy-routes-stage27.mjs'; pkg['scripts']['audit:first-principles']='node tools/audit-first-principles-stage28.mjs'; Path('package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          Path('.github/workflows/apply-strict-final-audit.yml').unlink()
          PY
      - run: npm install --ignore-scripts
      - run: npm run audit
      - run: npx playwright install --with-deps chromium && npm run test:browser
      - name: Commit verified result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Close legacy routes and enforce first-principles clarity"
          git push origin HEAD:agent/strict-final-web-audit
