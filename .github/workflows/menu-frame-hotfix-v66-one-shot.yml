name: Menu frame cache hotfix v66
on:
  push:
    branches: [fix/menu-frame-cache-hotfix-20260810]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/menu-frame-cache-hotfix-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted menu hotfix
        run: python3 tools/apply-menu-frame-hotfix-v66.py
      - name: Remove temporary migration machinery
        run: |
          rm -f tools/apply-menu-frame-hotfix-v66.py
          rm -f .github/workflows/menu-frame-hotfix-v66-one-shot.yml
      - name: Commit prepared tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mega-menu frame regression and cache bust"
      - name: Run full static audit
        run: npm run audit
      - name: Install browser for regression
        run: npx playwright install --with-deps chromium
      - name: Run browser regression
        run: npm run test:browser
      - name: Push verified hotfix
        run: git push origin HEAD:fix/menu-frame-cache-hotfix-20260810