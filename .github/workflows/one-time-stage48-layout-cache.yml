name: One-time stage48 layout cache
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-layout-cache-stage48.mjs'
      - '.github/workflows/one-time-stage48-layout-cache.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stage 48 layout and cache contract
        run: node tools/migrate-layout-cache-stage48.mjs
      - name: Guard contract
        run: |
          grep -q 'STAGE48-LAYOUT-CACHE-CONTRACT:START' assets/css/style.css
          grep -q 'html{min-height:100%;background:#202530!important}' assets/css/style.css
          grep -q 'trust-proof .grid-3{gap:24px!important' assets/css/style.css
          grep -q 'mega-menu.css?v=20260807-layout-cache-v48' assets/js/site-config.js
          ! grep -R 'style.css?v=20260715-image-age-fix' --include='*.html' .
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(design): restore trust spacing and Safari footer floor'
          git push
