name: Clarity consent migration

on:
  push:
    branches:
      - feat/clarity-consent-trust-20260817

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(clarity): apply generated consent trust changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clarity-consent-trust-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node tools/apply-clarity-consent-20260817.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/analytics.js trust-center.json '*.html' 'hu/**/*.html' 'de-at/**/*.html' || true
          git add -A
          git commit -m "chore(clarity): apply generated consent trust changes"
          git push origin HEAD:feat/clarity-consent-trust-20260817
