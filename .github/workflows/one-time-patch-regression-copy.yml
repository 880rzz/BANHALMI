name: One-time patch regression visible copy
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-regression-visible-copy.mjs'
      - '.github/workflows/one-time-patch-regression-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node tools/patch-regression-visible-copy.mjs
      - name: Guard patch
        run: |
          grep -q 'function visibleText(html)' tools/audit-regression.mjs
          grep -q 'const visible=visibleText(read(file))' tools/audit-regression.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-regression.mjs
          git commit -m 'test(design): make strategic copy audit markup-agnostic'
          git push
