name: One-shot BANHALMI homepage meta remediation

on:
  push:
    branches: [audit/full-remediation-20260814]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-remediation-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply homepage SEO/meta remediation
        run: node tools/remediate-homepage-meta-20260814.mjs
      - name: Run complete source audits
        run: npm test
      - name: Commit remediated homepages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          if git diff --cached --quiet; then
            echo 'No homepage changes to commit.'
            exit 0
          fi
          git commit -m 'Synchronize BANHALMI homepage SEO metadata'
          git push origin HEAD:audit/full-remediation-20260814
