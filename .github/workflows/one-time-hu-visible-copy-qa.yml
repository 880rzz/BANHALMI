name: One-time Hungarian visible-copy QA

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-visible-copy-qa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect visible Hungarian text
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re

          pages = sorted(Path('hu').glob('**/index.html'))
          suspect = re.compile(
              r'\b(?:Best of|executive|headshot|meeting|board|lifestyle|employer branding|personal branding|thought leadership|workshop|backend|widget(?:ek)?|honeypot|shared-secret|since|Maps|brief)\b',
              re.I,
          )
          issues = []

          def strip_markup(value):
              value = re.sub(r'(?is)<script\b[^>]*>.*?</script>', ' ', value)
              value = re.sub(r'(?is)<style\b[^>]*>.*?</style>', ' ', value)
              value = re.sub(r'(?is)<noscript\b[^>]*>.*?</noscript>', ' ', value)
              value = re.sub(r'(?is)<template\b[^>]*>.*?</template>', ' ', value)
              value = re.sub(r'(?is)<!--.*?-->', ' ', value)
              value = re.sub(r'(?is)<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', unescape(value)).strip()

          for path in pages:
              html = path.read_text(encoding='utf-8')
              body = re.search(r'(?is)<body\b[^>]*>(.*?)</body>', html)
              body = body.group(1) if body else ''
              body = re.sub(r'(?is)<script\b[^>]*>.*?</script>', ' ', body)
              body = re.sub(r'(?is)<style\b[^>]*>.*?</style>', ' ', body)
              body = re.sub(r'(?is)<noscript\b[^>]*>.*?</noscript>', ' ', body)
              body = re.sub(r'(?is)<template\b[^>]*>.*?</template>', ' ', body)

              blocks = []
              for tag, inner in re.findall(r'(?is)<(h[1-6]|p|li|summary|button|label|legend|figcaption)\b[^>]*>(.*?)</\1>', body):
                  text = strip_markup(inner)
                  if text:
                      blocks.append((tag.lower(), text))

              for tag, text in blocks:
                  if tag.startswith('h') and text[0].isalpha() and text[0].islower():
                      issues.append(f'{path} | LOWERCASE HEADING | {tag} | {text}')
                  if suspect.search(text):
                      issues.append(f'{path} | ENGLISH/SUSPECT TERM | {tag} | {text}')
                  duplicate = re.search(r'\b([A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]{3,})\s+\1\b', text, re.I)
                  if duplicate:
                      issues.append(f'{path} | DUPLICATE WORD | {tag} | {text}')
                  if re.search(r'\bAz\s+[bcdfgjklmnpqrstvwxyz]', text):
                      issues.append(f'{path} | ARTICLE CHECK AZ | {tag} | {text}')
                  if re.search(r'\bA\s+[aáeéiíoóöőuúüű]', text):
                      # Keep common acronym/proper-name cases out of the report.
                      if not re.search(r'\bA\s+(?:AI|AmCham|Európai|adat|alkot|archív|ember|egyes|első|esemény|élet|oldal|online|ügy|űrlap)', text, re.I):
                          issues.append(f'{path} | ARTICLE CHECK A | {tag} | {text}')

          print(f'PAGES={len(pages)}')
          print(f'ISSUES={len(issues)}')
          for item in issues:
              print(item)
          PY
