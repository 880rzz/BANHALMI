name: Deepen audience and visual presence positioning

on:
  push:
    branches:
      - content/audience-visual-presence-work
    paths:
      - 'tools/deepen-audience-positioning-20260816-v4.mjs'
      - 'tools/deepen-audience-positioning-20260816-v4.trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/audience-visual-presence-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply positioning edits
        run: node tools/deepen-audience-positioning-20260816-v4.mjs
      - name: Content-only placement check and commit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for (const f of ['ai-entry.json','knowledge-core.json','customer-needs.json','services.json','brand-positioning.jsonld','entity.jsonld','ecosystem.json']) JSON.parse(fs.readFileSync(f,'utf8'));
          const checks={
            'index.html':['executive portraiture','headshots','brand photography','c-level','artists','actors','visual presence'],
            'hu/index.html':['executive portré','headshot','brandfotózás','c-level','művészek','színészek','vizuális jelenlét'],
            'de-at/index.html':['executive-porträt','headshot','brandfotografie','c-level','künstler','schauspieler','visuelle präsenz'],
            'brand-positioning.jsonld':['professional headshot photography','artists','actors','visual presence'],
            'entity.jsonld':['professional headshot photography','artists','actors','visual presence'],
            'ecosystem.json':['executive portrait','professional headshot','brand photography','c-level event photography','artists','actors'],
            'llms-full.txt':['audience and complete visual presence','executive portrait','professional headshot','brand photography','c-level event photography','artists','actors'],
            'tools/optimize-production-artifact.mjs':['audience-positioning-production-guard','professional headshot','artists','actors']
          };
          for(const [file,tokens] of Object.entries(checks)){
            const body=fs.readFileSync(file,'utf8').toLowerCase();
            for(const token of tokens){
              if(!body.includes(token.toLowerCase())) throw new Error(`${file}: placement token missing: ${token}`);
            }
            console.log(`PLACEMENT OK: ${file}`);
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html brand-positioning.jsonld entity.jsonld ecosystem.json llms-full.txt tools/optimize-production-artifact.mjs
          git commit -m 'content: align broad audience across human schema and build layers'
          git push origin HEAD:content/audience-visual-presence-work
