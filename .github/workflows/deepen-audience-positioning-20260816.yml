name: Deepen audience and visual presence positioning

on:
  push:
    branches:
      - content/audience-visual-presence-work
    paths:
      - 'tools/deepen-audience-positioning-20260816.mjs'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/audience-visual-presence-work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply positioning edits
        run: node tools/deepen-audience-positioning-20260816.mjs
      - name: Content-only sanity check and commit
        run: |
          set -euo pipefail
          node -e "for (const f of ['ai-entry.json','knowledge-core.json','customer-needs.json','services.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"
          grep -q 'artists, actors and creative professionals' index.html
          grep -q 'művészeknek, színészeknek' hu/index.html
          grep -q 'Künstler, Schauspieler' de-at/index.html
          grep -q 'Executive Portrait' llms.txt
          grep -q 'Headshot' llms.txt
          grep -q 'Brand Photography' llms.txt
          grep -q 'C-Level Event Photography' llms.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html portrait/index.html hu/portre/index.html de-at/portrait/index.html ai-entry.json knowledge-core.json customer-needs.json services.json llms.txt ai.txt
          git commit -m 'content: broaden BANHALMI audience without diluting core intents'
          git push origin HEAD:content/audience-visual-presence-work
