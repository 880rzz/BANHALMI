name: One-shot sync embedded location schema

on:
  push:
    branches: [audit/embedded-schema-location-parity-20260814]
    paths:
      - .github/workflows/one-shot-sync-embedded-location-schema.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/embedded-schema-location-parity-20260814
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize canonical Gersthofer office into embedded JSON-LD
        run: |
          python - <<'PY'
          import copy, json, re
          from pathlib import Path

          PERSON='https://www.norbertbanhalmi.com/about/'
          ORG='https://www.norbertbanhalmi.com/#organization'
          OFFICE='https://www.norbertbanhalmi.com/#vienna-gersthofer-office'
          canonical=json.loads(Path('entity.jsonld').read_text(encoding='utf-8'))
          cgraph=canonical.get('@graph',[])
          office=next((x for x in cgraph if isinstance(x,dict) and x.get('@id')==OFFICE),None)
          if office is None:
              raise SystemExit('canonical Gersthofer office node missing')

          rx=re.compile(r'(<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>)([\s\S]*?)(</script>)',re.I)
          changed=[]
          person_count=org_count=0

          def ids(value):
              vals=value if isinstance(value,list) else ([value] if value else [])
              out=[]
              for item in vals:
                  if isinstance(item,str): out.append(item)
                  elif isinstance(item,dict) and item.get('@id'): out.append(item['@id'])
              return out

          def add_ref(node,key):
              value=node.get(key)
              vals=value if isinstance(value,list) else ([value] if value else [])
              if OFFICE not in ids(vals):
                  vals.append({'@id':OFFICE})
              node[key]=vals

          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','_site'} for part in p.parts):
                  continue
              text=p.read_text(encoding='utf-8')
              def repl(m):
                  raw=m.group(2)
                  try:
                      data=json.loads(raw)
                  except Exception:
                      return m.group(0)
                  graph=data.get('@graph') if isinstance(data,dict) else None
                  if not isinstance(graph,list):
                      return m.group(0)
                  person=next((n for n in graph if isinstance(n,dict) and n.get('@id')==PERSON and (n.get('@type')=='Person' or 'Person' in (n.get('@type') or []))),None)
                  org=next((n for n in graph if isinstance(n,dict) and n.get('@id')==ORG and (n.get('@type')=='Organization' or 'Organization' in (n.get('@type') or []))),None)
                  if not person and not org:
                      return m.group(0)
                  if person:
                      add_ref(person,'workLocation')
                  if org:
                      add_ref(org,'location')
                  if not any(isinstance(n,dict) and n.get('@id')==OFFICE for n in graph):
                      graph.append(copy.deepcopy(office))
                  return m.group(1)+json.dumps(data,ensure_ascii=False,separators=(',',':'))+m.group(3)

              new=rx.sub(repl,text)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed.append(str(p))

          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','_site'} for part in p.parts):
                  continue
              text=p.read_text(encoding='utf-8')
              for m in rx.finditer(text):
                  try: data=json.loads(m.group(2))
                  except Exception: continue
                  graph=data.get('@graph') if isinstance(data,dict) else None
                  if not isinstance(graph,list): continue
                  if any(isinstance(n,dict) and n.get('@id')==PERSON for n in graph): person_count+=1
                  if any(isinstance(n,dict) and n.get('@id')==ORG for n in graph): org_count+=1
          if len(changed)<45:
              raise SystemExit(f'expected >=45 schema pages to change, got {len(changed)}')
          print(f'updated {len(changed)} HTML files; Person graphs={person_count}; Organization graphs={org_count}')
          PY
          npm test
          git diff --check
      - name: Commit synchronized embedded schema
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git diff --cached --check
          git commit -m 'Synchronize embedded location schema with canonical entity graph'
          git push origin HEAD:audit/embedded-schema-location-parity-20260814
