name: One-time stage52 type accent
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-type-accent-stage52.mjs'
      - '.github/workflows/one-time-stage52-type-accent.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded type accent migration
        run: node tools/migrate-type-accent-stage52.mjs
      - name: Guard type accent contract
        run: |
          grep -q -- '--title-accent:#2F6F78' assets/css/style.css
          grep -q 'STAGE52-TYPE-ACCENT:START' assets/css/style.css
          grep -q 'title-accent title-accent--block' index.html
          grep -q 'title-accent title-accent--block' hu/index.html
          grep -q 'title-accent title-accent--block' de-at/index.html
          ! grep -R 'style.css?v=20260807-blue-palette-v49' --include='*.html' .
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(design): add sparse type accents and v50 cache'
          git push
