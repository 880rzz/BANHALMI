name: One-time stage50 blue cache
on:
  push:
    branches: [main]
    paths:
      - 'tools/migrate-blue-cache-stage50.mjs'
      - '.github/workflows/one-time-stage50-blue-cache.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Propagate blue palette cache key
        run: node tools/migrate-blue-cache-stage50.mjs
      - name: Guard cache key
        run: |
          ! grep -R '20260807-layout-cache-v48' --include='*.html' .
          grep -q '20260807-blue-palette-v49' assets/js/site-config.js
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(design): propagate BANHALMI blue palette cache'
          git push
