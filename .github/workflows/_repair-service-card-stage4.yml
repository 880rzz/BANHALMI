name: Repair service-card stage 4

on:
  push:
    branches:
      - agent/service-card-decisions-stage4

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair stage-four audit generator') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected branch
        uses: actions/checkout@v4
        with:
          ref: agent/service-card-decisions-stage4
          fetch-depth: 0
      - name: Repair nested template string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/_migrate-service-card-decisions-stage4.mjs')
          text = p.read_text()
          old = '    const exact=`<a class="card reveal" href="${card.href}"><h3>${card.title}</h3><p>${card.description}</p><span class="more">${card.cta}</span></a>`;'
          new = '    const exact=\'<a class="card reveal" href="\'+card.href+\'"><h3>\'+card.title+\'</h3><p>\'+card.description+\'</p><span class="more">\'+card.cta+\'</span></a>\';'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one nested template-string line, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          Path('.github/workflows/_repair-service-card-stage4.yml').unlink()
          PY
      - name: Commit repair
        run: |
          git config user.name "BANHALMI audit automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/_migrate-service-card-decisions-stage4.mjs .github/workflows/_repair-service-card-stage4.yml
          git commit -m "Repair stage-four audit generator"
          git push origin HEAD:agent/service-card-decisions-stage4
