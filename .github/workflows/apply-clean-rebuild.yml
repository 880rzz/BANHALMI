name: Apply clean rebuild

on:
  push:
    branches:
      - rebuild/clean-architecture-20260814
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/clean-architecture-20260814
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fix Stage79 visible-category guard without touching schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-service-first-principles-stage78.mjs')
          s=p.read_text(encoding='utf-8')
          needle='|Extended artistic archive|Bővített művészeti archívum|Erweitertes Kunstarchiv'
          if needle not in s:
              raise SystemExit('Stage79 schema/UI guard token missing')
          p.write_text(s.replace(needle,''),encoding='utf-8')
          PY

      - name: Bake final production transforms into source
        run: node tools/optimize-homepage-critical-path.mjs .

      - name: Collapse to one clean architecture authority
        run: python3 tools/clean_architecture_migrate.py

      - name: Verify clean source
        run: node tools/audit-clean-architecture.mjs

      - name: Commit baked clean source without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/clean_architecture_migrate.py
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild BANHALMI with one clean architecture authority"
          git push origin HEAD:rebuild/clean-architecture-20260814
