name: Apply homepage human voice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply natural-voice homepage rewrites
        run: python3 .human-voice/homepage-rewrite.py
      - name: Validate key phrases
        run: |
          grep -q 'The photograph often speaks before you do' index.html
          grep -q 'A fénykép gyakran előbb beszél, mint Ön' hu/index.html
          grep -q 'Das Bild spricht oft, bevor Sie es tun' de-at/index.html
          grep -q 'Two kinds of work. Same way of looking' index.html
          grep -q 'Kétféle munka. Ugyanaz a nézés' hu/index.html
          grep -q 'Zwei Arbeitsfelder. Dieselbe Art zu schauen' de-at/index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html
          git status
          git commit -m "Rewrite homepage copy in natural human voice (EN, HU, DE)"
          git push
