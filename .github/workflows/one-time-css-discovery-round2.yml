name: One-time early CSS discovery remediation

on:
  push:
    branches:
      - fix/pagespeed-round2-20260808

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[css-discovery-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagespeed-round2-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Move accessibility CSS into early discovery path and add guard
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.cwd();
          const skip=new Set(['.git','node_modules','.github']);
          const files=[];
          function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(skip.has(e.name))continue;const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))files.push(p)}}
          walk(root);
          let changed=0;
          for(const file of files){
            let html=fs.readFileSync(file,'utf8');
            if(!/<html\b/i.test(html)||!/<\/head\s*>/i.test(html))continue;
            const links=[...html.matchAll(/<link\b[^>]*href=["']\/assets\/css\/accessibility-stage14\.css(?:\?[^"']*)?["'][^>]*>/gi)];
            if(!links.length)continue;
            const tag=links[0][0];
            html=html.replace(/\s*<link\b[^>]*href=["']\/assets\/css\/accessibility-stage14\.css(?:\?[^"']*)?["'][^>]*>/gi,'');
            const style=/<link\b[^>]*href=["']\/assets\/css\/style\.css(?:\?[^"']*)?["'][^>]*>/i.exec(html);
            if(style){
              const end=style.index+style[0].length;
              html=html.slice(0,end)+'\n'+tag+html.slice(end);
            }else{
              const firstLocal=/<link\b[^>]*href=["']\/assets\/css\/[^"']+\.css(?:\?[^"']*)?["'][^>]*>/i.exec(html);
              if(firstLocal){
                const end=firstLocal.index+firstLocal[0].length;
                html=html.slice(0,end)+'\n'+tag+html.slice(end);
              }else{
                const schema=/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>/i.exec(html);
                if(schema)html=html.slice(0,schema.index)+tag+'\n'+html.slice(schema.index);
                else html=html.replace(/<\/head\s*>/i,tag+'\n</head>');
              }
            }
            const count=(html.match(/accessibility-stage14\.css/gi)||[]).length;
            if(count!==1)throw new Error(path.relative(root,file)+': expected exactly one accessibility stylesheet, got '+count);
            fs.writeFileSync(file,html);
            changed++;
          }
          if(!changed)throw new Error('No HTML pages were updated');

          fs.writeFileSync('tools/audit-css-discovery-stage57.mjs',`import fs from 'node:fs';\nimport path from 'node:path';\nconst root=path.resolve(import.meta.dirname,'..');\nconst failures=[];\nconst skip=new Set(['.git','node_modules','.github']);\nconst files=[];\nfunction walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(skip.has(e.name))continue;const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.name.endsWith('.html'))files.push(p)}}\nwalk(root);\nlet audited=0;\nfor(const file of files){const html=fs.readFileSync(file,'utf8');if(!/<html\\b/i.test(html)||!/<\\/head\\s*>/i.test(html))continue;const rel=path.relative(root,file).replaceAll('\\\\','/');const matches=[...html.matchAll(/<link\\b[^>]*href=[\\\"']\\/assets\\/css\\/accessibility-stage14\\.css(?:\\?[^\\\"']*)?[\\\"'][^>]*>/gi)];if(!matches.length)continue;audited++;if(matches.length!==1)failures.push(rel+': accessibility stylesheet must occur exactly once');const a11yIndex=matches[0].index;const schema=/<script\\b[^>]*type=[\\\"']application\\/ld\\+json[\\\"'][^>]*>/i.exec(html);if(schema&&a11yIndex>schema.index)failures.push(rel+': accessibility CSS is discovered after JSON-LD instead of before it');if(['index.html','hu/index.html','de-at/index.html'].includes(rel)){const style=/<link\\b[^>]*href=[\\\"']\\/assets\\/css\\/style\\.css(?:\\?[^\\\"']*)?[\\\"'][^>]*>/i.exec(html);if(!style)failures.push(rel+': primary stylesheet missing');else if(a11yIndex<style.index)failures.push(rel+': accessibility stylesheet should follow primary style.css');if(/<script\\b[^>]*src=[\\\"']https:\\/\\/cdn\\.trustindex\\.io\\//i.test(html))failures.push(rel+': Trustindex must remain interaction-gated, not static');}}\nif(failures.length){for(const f of failures)console.error('FAIL '+f);process.exit(1)}\nconsole.log('Stage 57 CSS discovery audit passed for '+audited+' HTML pages: accessibility CSS is unique and discovered before JSON-LD.');\n`);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const stage='node tools/audit-css-discovery-stage57.mjs';
          if(!pkg.scripts.audit.includes(stage))pkg.scripts.audit+=' && '+stage;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          rm .github/workflows/one-time-css-discovery-round2.yml
      - name: Install dependencies
        run: npm ci
      - name: Run full audit
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Commit verified CSS discovery remediation
        shell: bash
        run: |
          git config user.name 'BANHALMI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'perf: discover critical styles before schema parsing [css-discovery-done]'
          git push origin HEAD:fix/pagespeed-round2-20260808
