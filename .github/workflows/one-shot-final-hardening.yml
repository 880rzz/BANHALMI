name: One-shot final SEO GEO hardening

on:
  push:
    branches:
      - audit/final-10of10-hardening-20260814

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-10of10-hardening-20260814
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply canonical entity and alias-routing hardening
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from html.parser import HTMLParser

          root = Path('.')
          canonical = 'https://www.norbertbanhalmi.com'
          office_id = canonical + '/#vienna-gersthofer-office'

          # 1. Canonical schema: add Gersthofer as an office/client-meeting Place, never as a studio.
          entity_path = root / 'entity.jsonld'
          entity = json.loads(entity_path.read_text(encoding='utf-8'))
          graph = entity.get('@graph', [])
          ids = {n.get('@id'): n for n in graph if isinstance(n, dict)}
          if office_id not in ids:
              graph.append({
                  '@type': 'Place',
                  '@id': office_id,
                  'name': 'BANHALMI Vienna — Gersthofer office & client meeting location',
                  'description': 'Active Vienna office and client meeting location. This is not a photographic studio.',
                  'address': {
                      '@type': 'PostalAddress',
                      'streetAddress': 'Gersthofer Straße 150–154/6/2',
                      'postalCode': '1180',
                      'addressLocality': 'Wien',
                      'addressCountry': 'AT'
                  },
                  'containedInPlace': {
                      '@type': 'City',
                      'name': 'Wien',
                      'sameAs': 'https://www.wikidata.org/wiki/Q1741'
                  }
              })
          for node in graph:
              if not isinstance(node, dict):
                  continue
              if node.get('@id') == canonical + '/#organization':
                  locations = node.setdefault('location', [])
                  if isinstance(locations, dict):
                      locations = [locations]
                      node['location'] = locations
                  if not any(isinstance(x, dict) and x.get('@id') == office_id for x in locations):
                      locations.append({'@id': office_id})
              if node.get('@id') == canonical + '/about/':
                  locations = node.setdefault('workLocation', [])
                  if isinstance(locations, dict):
                      locations = [locations]
                      node['workLocation'] = locations
                  if not any(isinstance(x, dict) and x.get('@id') == office_id for x in locations):
                      locations.append({'@id': office_id})
          entity_path.write_text(json.dumps(entity, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2. Build a route-family map directly from published hreflang declarations.
          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.alts = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'link':
                      return
                  a = dict(attrs)
                  rel = (a.get('rel') or '').lower().split()
                  lang = (a.get('hreflang') or '').lower()
                  href = a.get('href') or ''
                  if 'alternate' in rel and lang in {'en', 'hu-hu', 'de-at'} and 'norbertbanhalmi.com' in href:
                      self.alts[lang] = urlparse(href).path

          families = set()
          for html in root.rglob('*.html'):
              parser = LinkParser()
              try:
                  parser.feed(html.read_text(encoding='utf-8', errors='ignore'))
              except Exception:
                  continue
              if all(k in parser.alts for k in ('en', 'hu-hu', 'de-at')):
                  families.add((parser.alts['en'], parser.alts['hu-hu'], parser.alts['de-at']))
          if len(families) < 15:
              raise SystemExit(f'Expected at least 15 trilingual route families, found {len(families)}')

          def make_map(index):
              mapping = {}
              for fam in sorted(families):
                  destination = fam[index]
                  for source in fam:
                      mapping[source] = destination
              return mapping

          at_map = make_map(2)
          hu_map = make_map(1)

          # 3. Root Vercel config: exact host-aware rules first, safe locale-home fallback last.
          vercel_path = root / 'vercel.json'
          vercel = json.loads(vercel_path.read_text(encoding='utf-8'))
          ordinary = []
          for rule in vercel.get('redirects', []):
              if any(h.get('key') == 'Host' for h in rule.get('has', [])):
                  continue
              ordinary.append(rule)
          host_rules = []
          for host, mapping, fallback in (
              ('banhalmi.at', at_map, '/de-at/'),
              ('www.banhalmi.at', at_map, '/de-at/'),
              ('banhalminorbert.hu', hu_map, '/hu/'),
              ('www.banhalminorbert.hu', hu_map, '/hu/'),
          ):
              for source, destination in sorted(mapping.items()):
                  host_rules.append({
                      'source': source,
                      'destination': canonical + destination,
                      'permanent': True,
                      'has': [{'type': 'header', 'key': 'Host', 'value': host}]
                  })
              host_rules.append({
                  'source': '/:path*',
                  'destination': canonical + fallback,
                  'permanent': True,
                  'has': [{'type': 'header', 'key': 'Host', 'value': host}]
              })
          vercel['redirects'] = host_rules + ordinary
          vercel_path.write_text(json.dumps(vercel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4. The two actual Vercel redirect subprojects use the same exact path map.
          def middleware(mapping, fallback):
              map_json = json.dumps(mapping, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              return f'''export const config = {{ matcher: '/:path*' }};\n\nconst ROUTES = {map_json};\nconst CANONICAL = {json.dumps(canonical)};\nconst FALLBACK = {json.dumps(fallback)};\n\nexport default function middleware(request) {{\n  const incoming = new URL(request.url);\n  const targetPath = ROUTES[incoming.pathname] || FALLBACK;\n  const target = new URL(targetPath, CANONICAL);\n  target.search = incoming.search;\n  return new Response(null, {{\n    status: 308,\n    headers: {{\n      Location: target.href,\n      'Cache-Control': 'public, max-age=0, s-maxage=86400'\n    }}\n  }});\n}}\n'''

          (root / 'redirects/at/middleware.js').write_text(middleware(at_map, '/de-at/'), encoding='utf-8')
          (root / 'redirects/hu/middleware.js').write_text(middleware(hu_map, '/hu/'), encoding='utf-8')

          # Disable the old blind wildcard redirect in subproject vercel.json; middleware is authority.
          for locale in ('at', 'hu'):
              p = root / f'redirects/{locale}/vercel.json'
              cfg = json.loads(p.read_text(encoding='utf-8'))
              cfg['redirects'] = []
              p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Fail closed on the essential contracts.
          assert 'Gersthofer Straße 150–154/6/2' in entity_path.read_text(encoding='utf-8')
          assert 'not a photographic studio' in entity_path.read_text(encoding='utf-8')
          assert '/portrait/' in at_map and at_map['/portrait/'] == '/de-at/portrait/'
          assert '/portrait/' in hu_map and hu_map['/portrait/'] == '/hu/portre/'
          assert '/lifestyle/' in hu_map and hu_map['/lifestyle/'] == '/hu/brand/'
          assert '/about/' in at_map and at_map['/about/'] == '/de-at/werk/'
          print(f'Hardened {len(families)} route families; {len(at_map)} AT and {len(hu_map)} HU source paths.')

      - name: Validate clean architecture and redirect contracts
        run: |
          npm test
          node --check redirects/at/middleware.js
          node --check redirects/hu/middleware.js
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('vercel.json','utf8')); JSON.parse(fs.readFileSync('entity.jsonld','utf8'));"
          grep -q 'Gersthofer Straße 150–154/6/2' entity.jsonld
          grep -q 'This is not a photographic studio' entity.jsonld
          grep -q 'ROUTES' redirects/at/middleware.js
          grep -q 'ROUTES' redirects/hu/middleware.js

      - name: Commit verified hardening and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden canonical entity and localized alias redirects"
          git push origin HEAD:audit/final-10of10-hardening-20260814
