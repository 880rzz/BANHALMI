name: One-time exact CSS dedupe

on:
  push:
    branches:
      - audit/self-healing-css-drift-20260808

permissions:
  contents: write

jobs:
  dedupe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/self-healing-css-drift-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove exact duplicate CSS rules
        run: node scripts/dedupe-exact-css-rules.mjs assets/css/style.css
      - name: Commit maintenance result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/css/style.css; then
            echo 'No duplicate CSS rules remained.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'fix: remove exact duplicate CSS rules'
          git push origin HEAD:audit/self-healing-css-drift-20260808
