name: One-time service conversion stage 6

on:
  push:
    branches:
      - agent/service-conversion-stage6
    paths:
      - scripts/_migrate-service-conversion-stage6.mjs
      - .github/workflows/_service-conversion-stage6.yml

permissions:
  contents: write

jobs:
  migrate-audit-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected branch
        uses: actions/checkout@v4
        with:
          ref: agent/service-conversion-stage6
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify migration syntax
        run: node --check scripts/_migrate-service-conversion-stage6.mjs

      - name: Apply focused service conversion migration
        run: node scripts/_migrate-service-conversion-stage6.mjs

      - name: Install audit dependencies
        run: npm install

      - name: Run complete repository audit
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: npm run test:browser

      - name: Verify conversion contract directly
        run: |
          node tools/audit-service-conversion-stage22.mjs
          node --check tools/audit-service-conversion-stage22.mjs
          node --check tests/service-conversion.spec.mjs

      - name: Remove temporary writers
        run: |
          rm scripts/_migrate-service-conversion-stage6.mjs
          rm .github/workflows/_service-conversion-stage6.yml

      - name: Verify temporary writers are gone
        run: |
          test ! -e scripts/_migrate-service-conversion-stage6.mjs
          test ! -e .github/workflows/_service-conversion-stage6.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 4
          git diff --check

      - name: Commit verified stage
        run: |
          git config user.name "BANHALMI audit automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified changes to commit"; exit 1; }
          git commit -m "Clarify service-page conversion path"
          git push origin HEAD:agent/service-conversion-stage6
