name: One-time PageSpeed main.js startup remediation

on:
  push:
    branches:
      - fix/pagespeed-startup-mainjs-20260808
    paths:
      - .github/workflows/apply-pagespeed-startup-mainjs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic startup remediation
        run: |
          python3 scripts/apply-pagespeed-startup-mainjs.py
          git diff --check
      - name: Commit remediation
        run: |
          git config user.name 'BANHALMI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/main.js
          git commit -m 'perf: shorten main.js startup task [startup-mainjs-done]'
          git push origin HEAD:fix/pagespeed-startup-mainjs-20260808
