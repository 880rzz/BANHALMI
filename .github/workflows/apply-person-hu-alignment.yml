name: Apply Person and Hungarian oeuvre alignment

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/align-person-and-hu-oeuvre.py
      - .github/workflows/apply-person-hu-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/person-and-hu-oeuvre-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical Person and Hungarian content cleanup
        run: python3 tools/align-person-and-hu-oeuvre.py
      - name: Align permanent audit invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://www.norbertbanhalmi.com/about/'
          new = 'https://www.banhalmi.art/norbert-banhalmi#person'
          p = Path('tools/audit-static-integrity.mjs')
          s = p.read_text()
          s = s.replace("const canonicalPersonId = 'https://www.norbertbanhalmi.com/about/';", "const canonicalPersonId = 'https://www.banhalmi.art/norbert-banhalmi#person';")
          s = s.replace("assert(!corpus.includes('https://www.banhalmi.art/norbert-banhalmi'), 'obsolete BANHALMI ART Person ID remains');\n", '')
          p.write_text(s)
          p = Path('tools/audit-regression.mjs')
          s = p.read_text().replace(old, new)
          s = s.replace("assert(wkoProfileMatches.every(url=>url===wkoProfileUrl), 'outdated or inconsistent WKO company profile link remains');", "assert(wkoProfileMatches.every(url=>url.replaceAll('%C3%BC','ü').replaceAll('%C3%A4','ä')===wkoProfileUrl), 'outdated or inconsistent WKO company profile link remains');")
          s = s.replace('|norbert-banhalmi|', '|')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run repository audits
        run: |
          node tools/audit-static-integrity.mjs
          node tools/audit-regression.mjs
          if [ -f tools/audit-production-routing.mjs ]; then node tools/audit-production-routing.mjs; fi
      - name: Verify changed content
        run: |
          grep -q 'https://www.banhalmi.art/norbert-banhalmi#person' hu/eletmu/index.html
          ! grep -q 'Ébredés – az Új kezdet / Awakening' hu/eletmu/index.html
          ! grep -q 'Ébredés – az Új kezdet! / Awakening: The New Beginning!' hu/eletmu/index.html
          ! grep -q '<span>Article</span>' hu/eletmu/index.html
          ! grep -q '<span>Video</span>' hu/eletmu/index.html
      - name: Remove one-time tooling
        run: |
          rm tools/align-person-and-hu-oeuvre.py
          rm .github/workflows/apply-person-hu-alignment.yml
      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Align canonical Person and Hungarian oeuvre content'
          git push origin HEAD:agent/person-and-hu-oeuvre-alignment
