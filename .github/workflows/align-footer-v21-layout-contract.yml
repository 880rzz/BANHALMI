name: Align footer V21 layout contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align cache token and layout marker
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const tokenOld='20260916-live-pixel-v22';
          const tokenNew='20260917-footer-v21';
          for(const p of ['tools/optimize-production-artifact.mjs','tools/audit-layout-contract-v18.mjs']){
            let s=fs.readFileSync(p,'utf8');
            s=s.split(tokenOld).join(tokenNew);
            fs.writeFileSync(p,s);
          }
          const audit='tools/audit-layout-contract-v18.mjs';
          let a=fs.readFileSync(audit,'utf8');
          a=a.replace("must(fluid.includes('LIVE-PIXEL-GEOMETRY-V22'),'canonical live-pixel stylesheet marker missing');", "must(fluid.includes('FOOTER-DESKTOP-GEOMETRY-V21-FLUID:START'),'canonical footer/layout stylesheet marker missing');");
          fs.writeFileSync(audit,a);
          NODE
      - name: Verify source contracts
        run: npm test
      - name: Commit contract alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/optimize-production-artifact.mjs tools/audit-layout-contract-v18.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align footer V21 with production layout contract [skip ci]"
          git push origin HEAD:main
