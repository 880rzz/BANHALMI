name: Align footer V21 layout contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align production geometry cache token
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tools/optimize-production-artifact.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.split('20260916-live-pixel-v22').join('20260917-footer-v21');
          fs.writeFileSync(p,s);
          NODE
      - name: Verify focused layout contracts
        run: |
          node tools/audit-footer-cards-tail-contract.mjs
          node tools/audit-layout-contract-v18.mjs
          node tools/audit-executive-footer-contract.mjs
          node tools/audit-historical-design-regressions.mjs
      - name: Commit token alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/optimize-production-artifact.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align footer V21 production cache token [skip ci]"
          git push origin HEAD:main
