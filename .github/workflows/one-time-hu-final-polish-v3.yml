name: Finalize Hungarian copy polish

on:
  push:
    paths:
      - '.github/workflows/one-time-hu-final-polish-v3.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified final-polish transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-time-hu-final-polish-v2.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply verified final-polish transformation\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.index('      - name: Correct article agreement on service pages', start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/apply-final-polish.sh').write_text('set -e\n' + script, encoding='utf-8')
          PY
          bash /tmp/apply-final-polish.sh
      - name: Correct article agreement on service pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for path in sorted(Path('hu').glob('**/index.html')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('Az munkáltatói márkaépítés', 'A munkáltatói márkaépítés')
              updated = updated.replace('az munkáltatói márkaépítés', 'a munkáltatói márkaépítés')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          if changed != 3:
              raise SystemExit(f'Expected article correction on three Hungarian pages, changed {changed}')
          print(f'Corrected article agreement on {changed} pages.')
          PY
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/one-time-hu-visible-copy-qa.yml
          rm -f .github/workflows/one-time-hu-final-polish.yml
          rm -f .github/workflows/one-time-hu-final-polish-v2.yml
          rm -f .github/workflows/one-time-hu-final-polish-v3.yml
      - name: Install dependencies
        run: npm install
      - name: Run Hungarian language guard
        run: npm run audit:hu-copy
      - name: Run full deterministic audit
        run: npm run audit
      - name: Commit final Hungarian polish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish final Hungarian copy details"
          git push
