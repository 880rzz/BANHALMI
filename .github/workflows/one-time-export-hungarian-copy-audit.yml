name: One-time Hungarian copy audit export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-export-hungarian-copy-audit.yml'

permissions:
  contents: write

jobs:
  export-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract visible Hungarian copy
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip = 0
                  self.out = []
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style','svg','noscript','template'}:
                      self.skip += 1
                  self.stack.append(tag)
                  if tag in {'h1','h2','h3','h4','p','li','summary','label','button','a','legend','option','small','strong','blockquote'}:
                      self.out.append(f'\n<{tag}> ')
              def handle_endtag(self, tag):
                  if tag in {'script','style','svg','noscript','template'} and self.skip:
                      self.skip -= 1
                  if self.stack:
                      self.stack.pop()
              def handle_data(self, data):
                  if self.skip:
                      return
                  text = re.sub(r'\s+', ' ', data).strip()
                  if text:
                      self.out.append(text + ' ')

          pages = sorted(Path('hu').rglob('*.html'))
          print(f'HUNGARIAN HTML PAGES: {len(pages)}')
          for path in pages:
              parser = Extractor()
              parser.feed(path.read_text(encoding='utf-8'))
              text = ''.join(parser.out)
              text = re.sub(r'\n+', '\n', text)
              lines = []
              seen = set()
              for raw in text.splitlines():
                  line = re.sub(r'\s+', ' ', raw).strip()
                  if len(line) < 2:
                      continue
                  # Keep repeated menu/footer only on homepage; elsewhere remove exact duplicates inside page.
                  if line in seen:
                      continue
                  seen.add(line)
                  lines.append(line)
              print('\n' + '='*100)
              print(path)
              print('='*100)
              print('\n'.join(lines))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-export-hungarian-copy-audit.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-export-hungarian-copy-audit.yml
          git commit -m "Remove one-time Hungarian copy audit export"
          git push
