name: One-time stage43 inline presentation consolidation
on:
  push:
    branches: [main]
    paths:
      - 'tools/consolidate-inline-presentation-stage43.mjs'
      - '.github/workflows/one-time-stage43-inline-presentation.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/consolidate-inline-presentation-stage43.mjs
      - name: Commit consolidation
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css '*.html' '**/*.html'
          git commit -m 'fix(design): replace repeated inline presentation with shared CSS'
          git push
