name: Full COM audit fixes

on:
  push:
    branches:
      - agent/full-cross-site-audit-fixes

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-cross-site-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser audit dependencies
        run: npm install
      - name: Apply complete cross-site fixes
        run: npm run fix:cross-site
      - name: Run static, SEO, GDPR and cross-site audits
        run: npm run audit && npm run audit:copy
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply complete COM audit fixes [skip ci]"
            git push
          fi
