name: Portrait brand source diagnostic
on:
  push:
    branches: [seo/portrait-brand-cluster-vienna-budapest-20260812]
    paths: ['.github/workflows/portrait-brand-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/portrait-brand-cluster-vienna-budapest-20260812
      - name: Print exact brand hero markup
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['lifestyle/index.html','hu/brand/index.html','de-at/brand/index.html']){
            const s=fs.readFileSync(file,'utf8');
            console.log('\n### '+file);
            for(const re of [/<p class="eyebrow">[^<]*<\/p>/g,/<h1[^>]*>[\s\S]*?<\/h1>/g,/<p class="lead">[\s\S]*?<\/p>/g]){
              const arr=[...s.matchAll(re)].slice(0,4).map(m=>m[0]);
              console.log(arr.join('\n'));
            }
          }
          NODE
