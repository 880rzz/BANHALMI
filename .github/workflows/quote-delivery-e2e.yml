name: BANHALMI quote delivery mock E2E

on:
  pull_request:
    paths:
      - 'assets/js/site-config.js'
      - 'assets/js/main.js'
      - 'assets/js/analytics.js'
      - 'tests/quote-session-privacy.test.mjs'
      - 'tests/quote-delivery-fail-closed.spec.mjs'
      - 'tests/contact-lead-attribution.test.mjs'
      - 'tests/contact-delivery-attribution.spec.mjs'
      - 'contact/index.html'
      - 'hu/kapcsolat/index.html'
      - 'de-at/kontakt/index.html'
      - '.github/workflows/quote-delivery-e2e.yml'
      - 'requestaquote/index.html'
      - 'hu/ajanlatkeres/index.html'
      - 'de-at/anfrage/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-delivery-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local-only site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/banhalmi-quote-mock.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:4173/requestaquote/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/banhalmi-quote-mock.log
          exit 1
      - name: Verify source analytics and privacy contracts
        run: npm test
      - name: Verify EN/HU/DE quote and contact mock responses without external emails
        run: npx playwright test tests/quote-delivery-fail-closed.spec.mjs tests/contact-delivery-attribution.spec.mjs --workers=2
