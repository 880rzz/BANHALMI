name: One-time desktop footer overflow repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply footer geometry repair
        run: node tools/repair-footer-v21.mjs
      - name: Verify footer contract
        run: node tools/audit-executive-footer-contract.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css data/design-authority.json tools/audit-executive-footer-contract.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix desktop footer overflow and contact geometry [skip ci]"
          git push origin HEAD:main
