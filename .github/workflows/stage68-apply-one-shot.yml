name: Stage68 apply human editorial + Apple design

on:
  push:
    branches: [fix/human-editorial-apple-audit-20260810]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-editorial-apple-audit-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage68 migration
        run: python3 tools/apply-stage68-human-design.py
      - name: Remove temporary migration machinery
        run: |
          rm -f tools/apply-stage68-human-design.py
          rm -f .github/workflows/stage68-human-design-scan.yml
          rm -f .github/workflows/stage68-apply-one-shot.yml
      - name: Commit final tree before audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Stage68 human editorial and Apple design audit"
      - name: Run complete static audit on final tree
        run: npm run audit
      - name: Push verified Stage68 tree
        run: git push origin HEAD:fix/human-editorial-apple-audit-20260810
