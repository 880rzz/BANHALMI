name: Apply reviewed oeuvre human voice copy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-voice-oeuvre-round
          fetch-depth: 0
      - name: Decode reviewed rewrite script
        run: |
          base64 --decode .human-voice/oeuvre-rewrite.py.gz.b64 | gzip -d > /tmp/apply_oeuvre.py
          python /tmp/apply_oeuvre.py
      - name: Validate new three-language copy
        run: |
          grep -q 'show the person rather than merely record their appearance' about/index.html
          grep -q 'hogyan mutathatja meg a fénykép az embert' hu/eletmu/index.html
          grep -q 'Wie kann ein Bild den Menschen zeigen' de-at/werk/index.html
      - name: Install dependencies
        run: npm install --silent
      - name: Run complete repository audit
        run: npm run audit
      - name: Verify exact production scope
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          about/index.html
          de-at/werk/index.html
          hu/eletmu/index.html
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit audited oeuvre pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html de-at/werk/index.html hu/eletmu/index.html
          git rm .human-voice/oeuvre-rewrite.py.gz.b64 .github/workflows/apply-oeuvre-human-voice.yml
          rmdir .human-voice 2>/dev/null || true
          git commit -m "Rewrite multilingual oeuvre introduction copy"
          git push
