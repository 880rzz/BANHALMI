name: One-shot Trustindex legal cleanup
on:
  push:
    branches:
      - fix/remove-trustindex-legal-disclosures-20260809
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-trustindex-legal-disclosures-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove stale Trustindex disclosures and align audits
        shell: python
        run: |
          from pathlib import Path
          import json, re

          # Machine-readable processor registry: Trustindex is no longer an active provider.
          p = Path('processors.json')
          data = json.loads(p.read_text())
          data['schemaVersion'] = '2026-08-09-v3'
          data['dateModified'] = '2026-08-09'
          data['providers'] = [x for x in data.get('providers', []) if x.get('id') != 'trustindex']
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          cookie_files = [Path('cookie-policy/index.html'), Path('hu/sutik/index.html'), Path('de-at/cookies/index.html')]
          for p in cookie_files:
            s = p.read_text()
            # Remove the dedicated stale provider row.
            s, n = re.subn(r'<tr><td>Trustindex Ltd</td>.*?</tr>', '', s, flags=re.S)
            if n != 1:
              raise SystemExit(f'{p}: expected exactly one Trustindex table row, got {n}')
            replacements = {
              'Google Analytics 4, Trustindex and Elfsight': 'Google Analytics 4 and Elfsight',
              'Google Analytics 4, a Trustindex és az Elfsight': 'Google Analytics 4 és az Elfsight',
              'Google Analytics 4, Trustindex und Elfsight': 'Google Analytics 4 und Elfsight',
            }
            for old, new in replacements.items():
              s = s.replace(old, new)
            if 'Trustindex' in s:
              raise SystemExit(f'{p}: stale Trustindex disclosure remains')
            p.write_text(s)

          privacy_files = [Path('privacy-policy/index.html'), Path('hu/adatvedelem/index.html'), Path('de-at/datenschutz/index.html')]
          for p in privacy_files:
            s = p.read_text()
            replacements = [
              ('Trustindex Ltd and Elfsight', 'Elfsight'),
              ('Trustindex and Elfsight', 'Elfsight'),
              ('Trustindex Ltd és az Elfsight', 'Az Elfsight'),
              ('Trustindex és az Elfsight', 'Az Elfsight'),
              ('Trustindex Ltd und Elfsight', 'Elfsight'),
              ('Trustindex und Elfsight', 'Elfsight'),
              ('Trustindex Ltd és Elfsight', 'Elfsight'),
              ('Trustindex és Elfsight', 'Elfsight'),
            ]
            for old, new in replacements:
              s = s.replace(old, new)
            if 'Trustindex' in s:
              raise SystemExit(f'{p}: stale Trustindex disclosure remains after targeted replacements')
            p.write_text(s)

          # Stage 40: active provider registry and privacy disclosure contract.
          p = Path('tools/audit-processors-trust-stage40.mjs')
          s = p.read_text()
          s = s.replace("'google-analytics-4','trustindex','elfsight'", "'google-analytics-4','elfsight'")
          s = s.replace("'google-analytics-4','trustindex','elfsight'", "'google-analytics-4','elfsight'")
          s = s.replace("'GitHub Pages','Cloudflare','Google Apps Script','Trustindex','Elfsight','Vercel'", "'GitHub Pages','Cloudflare','Google Apps Script','Elfsight','Vercel'")
          if "'trustindex'" in s or "'Trustindex'" in s:
            raise SystemExit('Stage 40 still requires Trustindex')
          p.write_text(s)

          # Stage 53: cross-domain privacy pages must describe active optional processors only.
          p = Path('tools/audit-seo-gdpr-indexing-stage53.mjs')
          s = p.read_text().replace("'Google Analytics 4','Trustindex','Elfsight','data-privacy-domain-scope'", "'Google Analytics 4','Elfsight','data-privacy-domain-scope'")
          if "'Trustindex'" in s:
            raise SystemExit('Stage 53 still requires Trustindex')
          p.write_text(s)

          # Keep Stage 56's fail-closed Trustindex prohibition. Verify the legal/registry corpus is clean.
          for rel in [
            'processors.json','cookie-policy/index.html','hu/sutik/index.html','de-at/cookies/index.html',
            'privacy-policy/index.html','hu/adatvedelem/index.html','de-at/datenschutz/index.html',
            'tools/audit-processors-trust-stage40.mjs','tools/audit-seo-gdpr-indexing-stage53.mjs'
          ]:
            if 'Trustindex' in Path(rel).read_text() or 'trustindex' in Path(rel).read_text().lower():
              raise SystemExit(f'{rel}: Trustindex residue remains')

      - name: Run focused audits
        run: |
          node tools/audit-processors-trust-stage40.mjs
          node tools/audit-seo-gdpr-indexing-stage53.mjs
          node tools/audit-strict-trust-legal-stage55.mjs
          node tools/audit-third-party-performance-stage56.mjs
      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/cleanup-trustindex-legal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processors.json cookie-policy/index.html hu/sutik/index.html de-at/cookies/index.html privacy-policy/index.html hu/adatvedelem/index.html de-at/datenschutz/index.html tools/audit-processors-trust-stage40.mjs tools/audit-seo-gdpr-indexing-stage53.mjs .github/workflows/cleanup-trustindex-legal-once.yml
          git commit -m "Align legal disclosures with active review provider"
          git push origin HEAD:fix/remove-trustindex-legal-disclosures-20260809
