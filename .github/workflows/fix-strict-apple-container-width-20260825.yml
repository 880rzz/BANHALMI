name: Fix strict Apple container width
on:
  push:
    paths:
      - 'tools/fix-strict-apple-container-width-20260825.mjs'
      - '.github/workflows/fix-strict-apple-container-width-20260825.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node tools/fix-strict-apple-container-width-20260825.mjs
      - name: Commit corrected container width
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/css/site.css; then
            echo 'No CSS change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git commit -m 'Constrain BANHALMI strict Apple content width'
          git push origin HEAD:main
