name: One-time patch English positioning audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-regression-en-positioning.mjs'
      - '.github/workflows/one-time-patch-regression-en-positioning.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node tools/patch-regression-en-positioning.mjs
      - name: Guard current English positioning phrase
        run: |
          grep -Fq "I photograph leaders and organisations for the places where their images actually need to work." tools/audit-regression.mjs
          ! grep -Fq "'builds visual trust'" tools/audit-regression.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-regression.mjs
          git commit -m 'test(copy): align English strategic positioning guard'
          git push
