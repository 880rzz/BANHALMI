name: One-time footer V21 cache sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize site.css cache token across source HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const css=fs.readFileSync('assets/css/site.css');
          const expected=`design-${crypto.createHash('sha256').update(css).digest('hex').slice(0,16)}`;
          const skip=new Set(['.git','node_modules','.github','artifacts','_site']);
          let files=0,refs=0,changed=0;
          function walk(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(e.name)) continue;
              const full=path.join(dir,e.name);
              if(e.isDirectory()) walk(full);
              else if(e.isFile()&&e.name.endsWith('.html')){
                files++;
                const src=fs.readFileSync(full,'utf8');
                let local=0;
                const out=src.replace(/\/assets\/css\/site\.css\?v=[^"']+/g,()=>{local++;refs++;return `/assets/css/site.css?v=${expected}`;});
                if(local&&out!==src){fs.writeFileSync(full,out);changed++;}
              }
            }
          }
          walk('.');
          if(refs<50) throw new Error(`Expected at least 50 site.css references, found ${refs}`);
          console.log(`Synchronized ${refs} site.css references in ${changed}/${files} HTML files to ${expected}.`);
          NODE
      - name: Create clean local candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-footer-v21-cache-sync.yml
          git add -A
          git commit -m "Synchronize footer V21 CSS cache token across source HTML"
      - name: Run complete source audit on committed candidate
        run: npm test
      - name: Push audited candidate
        run: git push origin HEAD:main
