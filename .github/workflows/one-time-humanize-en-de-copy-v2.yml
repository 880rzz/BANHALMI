name: Finalize English and German human voice revision

on:
  push:
    paths:
      - '.github/workflows/one-time-humanize-en-de-copy-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the reviewed copy revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow=Path('.github/workflows/one-time-humanize-en-de-copy.yml').read_text(encoding='utf-8')
          match=re.search(r"python3 - <<'PY'\n([\s\S]*?)\n          PY",workflow)
          if not match: raise SystemExit('Could not extract reviewed rewrite script')
          code=textwrap.dedent(match.group(1))
          exec(compile(code,'humanize-en-de','exec'),{})
          PY
      - name: Align permanent copy contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/audit-static-integrity.mjs')
          s=p.read_text(encoding='utf-8')
          replacements={
            "'index.html': ['Visual Trust Strategy', 'Executive portraits and visual positioning for leaders and organisations.']":"'index.html': ['Photography for clear communication', 'I photograph leaders and organisations for the places where their images actually need to work.']",
            "'de-at/index.html': ['Strategie für visuelles Vertrauen', 'Executive-Porträts und visuelle Positionierung für Führungskräfte und Organisationen.']":"'de-at/index.html': ['Fotografie für klare Kommunikation', 'Ich fotografiere Führungskräfte und Organisationen für die Situationen, in denen ihre Bilder tatsächlich funktionieren müssen.']"
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'Missing old audit contract: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Keep any matching exact regression contracts aligned as well.
          for name in ['tools/audit-regression.mjs','tools/audit-homepage-positioning-stage3.mjs']:
              q=Path(name)
              if not q.exists(): continue
              t=q.read_text(encoding='utf-8')
              for old,new in {
                'Visual Trust Strategy':'Photography for clear communication',
                'Executive portraits and visual positioning for leaders and organisations.':'I photograph leaders and organisations for the places where their images actually need to work.',
                'Strategie für visuelles Vertrauen':'Fotografie für klare Kommunikation',
                'Executive-Porträts und visuelle Positionierung für Führungskräfte und Organisationen.':'Ich fotografiere Führungskräfte und Organisationen für die Situationen, in denen ihre Bilder tatsächlich funktionieren müssen.',
                'Four photographic services':'Four ways we can work together',
                'Four fields, connected by one visual language':'Portraits, brand work, events and fine art — approached with the same care.',
                'Vier fotografische Leistungen':'Vier Formen der Zusammenarbeit',
                'Vier Bereiche, verbunden durch eine Bildsprache':'Porträt, Brand, Events und Fine Art — mit derselben Sorgfalt fotografiert.'
              }.items(): t=t.replace(old,new)
              q.write_text(t,encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/one-time-audit-human-voice-en-de.yml
          rm -f .github/workflows/one-time-humanize-en-de-copy.yml
          rm -f .github/workflows/one-time-humanize-en-de-copy-v2.yml
      - name: Install dependencies
        run: npm install
      - name: Run focused copy audit
        run: npm run audit:en-de-copy
      - name: Run complete repository audit
        run: npm run audit
      - name: Commit and publish
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Humanize English and German website copy"
          git push
