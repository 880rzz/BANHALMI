name: Apply schema title parity fix

on:
  push:
    branches:
      - fix/claude-audit-hardening-20260823
    paths:
      - tools/fix-google-search-schema-title-parity.mjs
      - .github/workflows/schema-title-parity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-audit-hardening-20260823
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize page-level schema names with titles
        run: node tools/fix-google-search-schema-title-parity.mjs
      - name: Verify source contracts
        run: npm test
      - name: Commit deterministic parity fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No schema-title parity changes required.'
            exit 0
          fi
          git commit -m 'fix: synchronize page schema names with titles'
          git push origin HEAD:fix/claude-audit-hardening-20260823
