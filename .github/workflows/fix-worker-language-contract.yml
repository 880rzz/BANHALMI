name: Fix Worker language contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-worker-language-contract-20260831.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch frontend payload language contract
        run: node tools/fix-worker-language-contract-20260831.mjs
      - name: Validate contract
        run: |
          grep -q "data.language = languageOf(form);" assets/js/site-config.js
          grep -q "data.page_language = data.language;" assets/js/site-config.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site-config.js
          git commit -m 'Align form payload language with Cloudflare gateway'
          git push origin HEAD:main
