name: One-shot Stage 69 fine-art path
on:
  push:
    branches:
      - agent/fine-art-secondary-path-20260813
permissions:
  contents: write
jobs:
  transform:
    if: github.event.head_commit.message != 'Apply Stage 69 fine-art secondary path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fine-art-secondary-path-20260813
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply-fine-art-secondary-path.py
      - run: |
          grep -q 'class="fp-art-path"' index.html
          grep -q 'class="fp-art-path"' hu/index.html
          grep -q 'class="fp-art-path"' de-at/index.html
          grep -q 'STAGE69-FINE-ART-PATH:START' assets/css/style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html assets/css/style.css
          git commit -m "Apply Stage 69 fine-art secondary path"
          git push origin HEAD:agent/fine-art-secondary-path-20260813
