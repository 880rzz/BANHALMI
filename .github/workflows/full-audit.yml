name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice copy report
        run: npm run audit:copy > human-voice-audit.json
      - name: Upload human voice copy report
        uses: actions/upload-artifact@v4
        with:
          name: banhalmi-human-voice-audit
          path: human-voice-audit.json
          if-no-files-found: error
      - name: Create full repository archive
        run: |
          mkdir -p /tmp/banhalmi-export/BANHALMI
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='human-voice-audit.json' --exclude='link-audit-results.json' ./ /tmp/banhalmi-export/BANHALMI/
          cd /tmp/banhalmi-export
          zip -r BANHALMI-main.zip BANHALMI
      - name: Upload full repository archive
        uses: actions/upload-artifact@v4
        with:
          name: banhalmi-full-repository
          path: /tmp/banhalmi-export/BANHALMI-main.zip
          if-no-files-found: error
      - name: Verify audit did not modify tracked files
        run: git diff --exit-code
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
