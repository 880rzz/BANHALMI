name: One-time professional human and entity migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/human-seo-llm-audit-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-seo-llm-audit-20260802
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        working-directory: work
        run: npm install
      - name: Apply the three-language biography and entity migration
        working-directory: work
        run: node tools/apply-human-seo-llm-migration.mjs
      - name: Remove the one-time migration helper
        working-directory: work
        run: rm tools/apply-human-seo-llm-migration.mjs
      - name: Run deterministic audit
        working-directory: work
        run: npm run audit
      - name: Run human voice report
        working-directory: work
        run: npm run audit:copy > /tmp/banhalmi-human-voice-audit.json
      - name: Commit the audited migration
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply human voice, biography and entity audit"
          git push origin HEAD:agent/human-seo-llm-audit-20260802

  restore-main-audit:
    if: always()
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore the permanent read-only full audit
        run: |
          cat > .github/workflows/full-audit.yml <<'YAML'
          name: Full site regression audit

          on:
            push:
              branches:
                - main
                - 'agent/**'
            pull_request:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.head_ref || github.ref_name }}
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - name: Run deterministic audit
                  run: npm run audit
                - name: Generate human voice copy report
                  run: npm run audit:copy > human-voice-audit.json
                - name: Upload human voice copy report
                  uses: actions/upload-artifact@v4
                  with:
                    name: banhalmi-human-voice-audit
                    path: human-voice-audit.json
                    if-no-files-found: error
                - name: Verify audit did not modify tracked files
                  run: git diff --exit-code
                - name: Check live endpoints and external links
                  run: npm run audit:live
                - name: Upload external link report
                  if: always() && hashFiles('link-audit-results.json') != ''
                  uses: actions/upload-artifact@v4
                  with:
                    name: external-link-audit
                    path: link-audit-results.json
                    if-no-files-found: ignore
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/full-audit.yml
          if git diff --cached --quiet; then
            echo "Permanent full audit already restored."
          else
            git commit -m "Restore read-only full audit [skip ci]"
            git push origin main
          fi
