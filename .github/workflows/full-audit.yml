name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic audit
        run: npm run audit
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Commit normalized compliance text
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hu/adatvedelem/index.html \
            requestaquote/index.html \
            de-at/anfrage/index.html \
            de-at/kontakt/index.html \
            de-at/speier-viko/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Normalize compliance wording"
            git push
          fi
