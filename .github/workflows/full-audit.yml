name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic audit
        run: npm run audit
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
      - name: Commit normalized production HTML
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -- '*.html' | while IFS= read -r file; do
            [ -n "$file" ] && git add -- "$file"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Normalize compliance wording and verified links"
            git push
          fi
