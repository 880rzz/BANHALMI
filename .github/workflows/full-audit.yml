name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply visible Visual Trust migration
        if: (github.head_ref || github.ref_name) == 'agent/visible-visual-trust-fix' && github.actor != 'github-actions[bot]'
        run: node tools/apply-visible-visual-trust.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Commit verified visible homepage copy
        if: (github.head_ref || github.ref_name) == 'agent/visible-visual-trust-fix' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hu/index.html de-at/index.html
          git diff --cached --quiet || git commit -m 'Expose Visual Trust positioning in visible homepage copy'
          git push
      - name: Verify audit did not modify tracked files
        run: git diff --exit-code
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
