name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply final visual trust hardening
        if: github.ref_name == 'agent/final-visual-trust-hardening' && github.actor != 'github-actions[bot]'
        run: node tools/final-visual-trust-hardening.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
      - name: Commit validated production changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hu/index.html de-at/index.html entity.jsonld package.json tools/audit-regression.mjs .github/workflows/production-audit.yml
          git rm -f tools/run-current-positioning-audit.mjs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Apply validated visual trust hardening"
          git push