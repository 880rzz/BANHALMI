name: One-time stage-three homepage positioning migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/homepage-positioning-stage3-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-positioning-stage3-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply three-language homepage positioning
        run: node tools/apply-homepage-positioning-stage3.mjs
      - name: Remove one-time migration helper
        run: rm -f tools/apply-homepage-positioning-stage3.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy > /tmp/banhalmi-human-voice-audit.json
      - name: Verify audit does not modify unrelated tracked files
        run: git diff --exit-code -- . ':!index.html' ':!hu/index.html' ':!de-at/index.html' ':!tools/audit-regression.mjs' ':!tools/apply-homepage-positioning-stage3.mjs'
      - name: Commit audited stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply homepage positioning and service hierarchy"
          git push origin HEAD:agent/homepage-positioning-stage3-20260802
