name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Run deterministic audit
        run: npm run audit
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Generate human voice copy report
        run: npm run audit:copy > human-voice-audit.json
      - name: Upload human voice copy report
        uses: actions/upload-artifact@v4
        with:
          name: banhalmi-human-voice-audit
          path: human-voice-audit.json
          if-no-files-found: error
      - name: Verify audit did not modify tracked files
        run: git diff --exit-code
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
