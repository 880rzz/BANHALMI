name: One-time stage-four strategic partnership migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/strategic-partnership-stage4-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategic-partnership-stage4-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add concrete strategic partnership process
        run: node tools/apply-strategic-partnership-stage4.mjs
      - name: Remove one-time migration helper
        run: rm -f tools/apply-strategic-partnership-stage4.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice report
        run: npm run audit:copy > /tmp/banhalmi-human-voice-audit.json
      - name: Verify audit does not modify unrelated tracked files
        run: git diff --exit-code -- . ':!portrait/index.html' ':!lifestyle/index.html' ':!event-photography/index.html' ':!hu/portre/index.html' ':!hu/brand/index.html' ':!hu/rendezvenyfotozas/index.html' ':!de-at/portrait/index.html' ':!de-at/brand/index.html' ':!de-at/eventfotografie/index.html' ':!tools/apply-strategic-partnership-stage4.mjs'
      - name: Commit audited stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make strategic partnership concrete across service pages"
          git push origin HEAD:agent/strategic-partnership-stage4-20260802
