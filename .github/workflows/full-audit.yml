name: Full site regression audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-time German coordination copy correction
        if: github.ref_name == 'agent/fix-german-duplicate-copy' || github.head_ref == 'agent/fix-german-duplicate-copy'
        run: |
          node tools/fix-german-coordination-copy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de-at/eventfotografie/index.html
          git diff --cached --quiet || git commit -m "Fix duplicated German coordination copy"
          git push origin HEAD:agent/fix-german-duplicate-copy
      - run: npm install
      - name: Run deterministic audit
        run: npm run audit
      - name: Verify audit did not modify tracked files
        run: git diff --exit-code
      - name: Check live endpoints and external links
        run: npm run audit:live
      - name: Upload external link report
        if: always() && hashFiles('link-audit-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: external-link-audit
          path: link-audit-results.json
          if-no-files-found: ignore
