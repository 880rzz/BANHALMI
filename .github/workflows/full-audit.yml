name: Full site regression audit

on:
  push:
    branches:
      - agent/governance-confidentiality-stage10-20260802

permissions:
  contents: write

jobs:
  migrate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governance-confidentiality-stage10-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply governance blocks
        run: node tools/apply-governance-confidentiality-stage10.mjs
      - name: Restore permanent workflow and remove one-time files
        run: |
          git checkout origin/main -- .github/workflows/full-audit.yml
          rm -f .github/workflows/stage10-governance-migration.yml tools/apply-governance-confidentiality-stage10.mjs
      - name: Run deterministic audit
        run: npm run audit
      - name: Generate human voice copy report
        run: npm run audit:copy > human-voice-audit.json
      - name: Verify audit did not modify unrelated tracked files
        run: git diff --exit-code -- . ':!*.html' ':!package.json' ':!tools/audit-governance-confidentiality-stage10.mjs' ':!.github/workflows/full-audit.yml' ':!.github/workflows/stage10-governance-migration.yml' ':!tools/apply-governance-confidentiality-stage10.mjs'
      - name: Commit audited stage
        run: |
          rm -f human-voice-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply stage ten governance and confidentiality clarity"
          git push origin HEAD:agent/governance-confidentiality-stage10-20260802
