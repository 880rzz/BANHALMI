name: Apply SEO entity consistency 20260809

on:
  push:
    branches:
      - fix/seo-geo-entity-consistency-20260809
    paths:
      - scripts/apply-seo-entity-consistency-20260809.mjs
      - .github/workflows/apply-seo-entity-consistency-20260809.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-geo-entity-consistency-20260809
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic migration
        run: |
          node scripts/apply-seo-entity-consistency-20260809.mjs
          git ls-files '*.mjs' '*.js' | xargs -r git checkout --
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/audit-seo-entity-consistency-stage59.mjs')
          s=p.read_text()
          s=s.replace('(html|json|jsonld|txt|md|mjs|js|xml)', '(html|json|jsonld|txt|md|xml)')
          p.write_text(s)
          PY
          node tools/audit-seo-entity-consistency-stage59.mjs
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: unify SEO titles FAQ knowledge and entity signals"
          git push origin HEAD:fix/seo-geo-entity-consistency-20260809
