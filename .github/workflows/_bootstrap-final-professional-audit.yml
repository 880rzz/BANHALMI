name: One-time final professional-site audit bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  run-on-feature-branch:
    if: github.head_ref == 'agent/final-ecosystem-audit-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-ecosystem-audit-20260802
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        working-directory: work
        run: npm install
      - name: Apply final ecosystem hardening
        working-directory: work
        run: node tools/_apply-final-ecosystem-audit.mjs
      - name: Run source, primary-live, SEO, GEO, schema, LLM, GDPR and link audits
        working-directory: work
        run: npm run audit && npm run audit:copy && npm run audit:production && npm run audit:alias-entities
      - name: Note alias-domain deployment gate
        run: echo "HTTP alias redirects are verified after production deployment; source host rules are covered by audit-redirect-config.mjs."
      - name: Install browser runtime
        working-directory: work
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser regression suite
        working-directory: work
        run: npm run test:browser
      - name: Commit only audited source and regression tests
        working-directory: work
        run: |
          git rm tools/_apply-final-ecosystem-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Harden professional-site ecosystem and automation safety"
          git push origin agent/final-ecosystem-audit-20260802
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: cleanup
      - name: Remove this one-time bootstrap from main
        working-directory: cleanup
        run: |
          git pull --rebase origin main
          git rm .github/workflows/_bootstrap-final-professional-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time professional audit bootstrap [skip ci]"
          git push origin main
