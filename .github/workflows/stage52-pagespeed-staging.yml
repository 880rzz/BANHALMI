name: Stage 52 PageSpeed staging gate

on:
  push:
    branches:
      - audit/pagespeed-hardening-20260808

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[perf-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: audit/pagespeed-hardening-20260808
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install audit dependencies
        run: npm ci

      - name: Apply Stage 52 hardening
        run: node tools/apply-pagespeed-hardening-stage52.mjs

      - name: Verify static audit chain
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify full browser regression suite
        run: npm run test:browser

      - name: Commit verified staging result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BANHALMI CI'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/main.js assets/css/accessibility-stage14.css index.html hu/index.html de-at/index.html package.json tools/audit-pagespeed-runtime-stage52.mjs
          if git diff --cached --quiet; then
            echo 'No staged changes to commit.'
            exit 0
          fi
          git commit -m 'perf: remove forced hero reflow and harden mobile rendering [perf-applied]'
          git push origin HEAD:audit/pagespeed-hardening-20260808
