name: Temporary Trustindex rich-snippet cleanup

on:
  push:
    branches:
      - fix/remove-ineligible-trustindex-richsnippet-20260809
    paths:
      - .github/workflows/temp-remove-trustindex-richsnippet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-ineligible-trustindex-richsnippet-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove Trustindex rich-snippet runtime and harden audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const mainPath = 'assets/js/main.js';
          let main = fs.readFileSync(mainPath, 'utf8');
          const startNeedle = '        var pathName = window.location.pathname.replace(/\\/index\\.html$/, "/");';
          const endNeedle = '        if (document.querySelector(\'[class*="elfsight-app-"]\') && !hasScriptSource("elfsightcdn.com/platform.js")) {';
          const start = main.indexOf(startNeedle);
          const end = main.indexOf(endNeedle, start);
          if (start < 0 || end < 0) throw new Error('Could not locate Trustindex rich-snippet block boundaries in main.js');
          main = main.slice(0, start) + main.slice(end);
          main = main.replace('["trustindex-richsnippet", "elfsight-platform"]', '["elfsight-platform"]');
          main = main.replace('iframe[src*="trustindex"],iframe[src*="elfsight"],script[src*="trustindex"],script[src*="elfsight"]', 'iframe[src*="elfsight"],script[src*="elfsight"]');
          if (main.includes('cdn.trustindex.io/assets/js/richsnippet.js') || main.includes('trustindex-richsnippet')) {
            throw new Error('Trustindex rich-snippet runtime still present in main.js');
          }
          fs.writeFileSync(mainPath, main);

          const auditPath = 'tools/audit-third-party-performance-stage56.mjs';
          let audit = fs.readFileSync(auditPath, 'utf8');
          audit = audit.replace("'cdn.trustindex.io/assets/js/richsnippet.js',", '');
          const failAnchor = "if(failures.length){for(const failure of failures) console.error('FAIL '+failure);process.exit(1);}";
          if (!audit.includes(failAnchor)) throw new Error('Stage56 fail anchor not found');
          audit = audit.replace(failAnchor, "if(main.includes('cdn.trustindex.io') || main.includes('trustindex-richsnippet')) failures.push('main.js: Trustindex rich-snippet generator must remain absent; self-serving LocalBusiness/Organization ratings are not an eligible Google review rich-result strategy');\n" + failAnchor);
          audit = audit.replace('Stage 56 third-party performance audit passed: Trustindex and Elfsight are absent from static HTML and remain consent-plus-interaction gated.', 'Stage 56 third-party performance audit passed: Trustindex rich-snippet generation is absent, while Elfsight remains consent-plus-interaction gated and absent from static HTML.');
          fs.writeFileSync(auditPath, audit);
          NODE

          node tools/audit-third-party-performance-stage56.mjs
          node tools/audit-processors-trust-stage40.mjs

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/main.js tools/audit-third-party-performance-stage56.mjs
          git diff --cached --quiet && exit 1
          git commit -m "fix(seo): remove ineligible Trustindex rich-snippet runtime"
          git push origin HEAD:fix/remove-ineligible-trustindex-richsnippet-20260809
