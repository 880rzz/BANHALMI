name: One-time stage44 CSS fragment cleanup
on:
  push:
    branches: [main]
    paths:
      - 'tools/cleanup-css-fragments-stage44.mjs'
      - '.github/workflows/one-time-stage44-css-fragments.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/cleanup-css-fragments-stage44.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/style.css
          git commit -m 'fix(css): remove malformed standalone vendor-prefix fragments'
          git push
