name: Remediate presence dark accent

on:
  push:
    branches:
      - audit/full-10-10-20260816

permissions:
  contents: write

concurrency:
  group: remediate-presence-dark-accent
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-10-10-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic CSS remediation
        run: node tools/remediate-presence-dark-accent.mjs
      - name: Verify corrected selector
        run: |
          grep -F '.presence-thesis[data-surface="dark"]' assets/css/site.css
          grep -F 'linear-gradient(90deg,#F5F5F7 0%,#AFC4D9 62%,#DCC56B 100%)' assets/css/site.css
      - name: Commit corrected source
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/css/site.css; then
            echo 'No CSS source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git commit -m 'fix(ui): restore readable dark-surface title accent'
          git push origin HEAD:audit/full-10-10-20260816
