name: Final live content fix

on:
  push:
    branches:
      - agent/final-live-content-fix

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-live-content-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply final content fixes
        run: node tools/final-live-content-fix.mjs
      - name: Commit generated content
        run: |
          if git diff --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply final live content fixes [skip ci]"
            git push
          fi
      - name: Run all audits
        run: npm run audit && npm run audit:copy
