name: Repair stage-four migration generator

on:
  push:
    branches:
      - agent/service-card-decisions-stage4
    paths:
      - .github/workflows/_fix-service-card-stage4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/service-card-decisions-stage4
          fetch-depth: 0
      - name: Repair nested template literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_migrate-service-card-decisions-stage4.mjs')
          text = path.read_text()
          old = '    const exact=`<a class="card reveal" href="${card.href}"><h3>${card.title}</h3><p>${card.description}</p><span class="more">${card.cta}</span></a>`;'
          new = '    const exact=\'<a class="card reveal" href="\'+card.href+\'"><h3>\'+card.title+\'</h3><p>\'+card.description+\'</p><span class="more">\'+card.cta+\'</span></a>\';'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one nested template literal')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/_fix-service-card-stage4.yml').unlink()
          PY
      - name: Commit repair
        run: |
          git config user.name "BANHALMI audit automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair stage-four migration generator"
          git push origin HEAD:agent/service-card-decisions-stage4
