name: Finalize footer V21 authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align source, fluid authority and audits
        run: node tools/repair-footer-v21.mjs
      - name: Verify footer audits
        run: |
          node tools/audit-executive-footer-contract.mjs
          node tools/audit-footer-cards-tail-contract.mjs
          node tools/audit-historical-design-regressions.mjs
      - name: Commit final footer authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css assets/css/fluid-4k-rhythm.css assets/js/fluid-rhythm-boot.js data/design-authority.json tools/audit-executive-footer-contract.mjs tools/audit-footer-cards-tail-contract.mjs tools/audit-historical-design-regressions.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align footer V21 production authority and audits [skip ci]"
          git push origin HEAD:main
