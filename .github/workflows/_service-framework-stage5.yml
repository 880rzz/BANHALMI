name: One-time service framework stage 5

on:
  push:
    branches:
      - agent/service-framework-stage5
    paths:
      - scripts/_migrate-service-framework-stage5.mjs
      - scripts/_repair-main-semantics-stage5.mjs
      - .github/workflows/_service-framework-stage5.yml

permissions:
  contents: write

jobs:
  migrate-audit-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected branch
        uses: actions/checkout@v4
        with:
          ref: agent/service-framework-stage5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused service framework migration
        run: |
          node scripts/_migrate-service-framework-stage5.mjs
          node scripts/_repair-main-semantics-stage5.mjs

      - name: Install audit dependencies
        run: npm install

      - name: Run complete repository audit
        run: npm run audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: npm run test:browser

      - name: Verify framework contract directly
        run: |
          node tools/audit-service-framework-stage20.mjs
          node tools/audit-main-semantics-stage21.mjs
          node --check tools/audit-service-framework-stage20.mjs
          node --check tools/audit-main-semantics-stage21.mjs
          node --check tests/service-framework.spec.mjs
          node --check tools/audit-governance-confidentiality-stage10.mjs
          node --check tools/audit-booking-contingency-stage11.mjs

      - name: Remove temporary writers
        run: |
          rm scripts/_migrate-service-framework-stage5.mjs
          rm scripts/_repair-main-semantics-stage5.mjs
          rm .github/workflows/_service-framework-stage5.yml

      - name: Verify temporary writers are gone
        run: |
          test ! -e scripts/_migrate-service-framework-stage5.mjs
          test ! -e scripts/_repair-main-semantics-stage5.mjs
          test ! -e .github/workflows/_service-framework-stage5.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 4
          git diff --check

      - name: Commit verified stage
        run: |
          git config user.name "BANHALMI audit automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No verified changes to commit"; exit 1; }
          git commit -m "Consolidate service-page project framework"
          git push origin HEAD:agent/service-framework-stage5
